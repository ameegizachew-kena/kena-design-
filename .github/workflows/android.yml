name: Build KENA DESIGN Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/
          cp student.html www/ || true
          cp dashboard.html www/ || true
          cp register.html www/ || true
          cp admin.html www/ || true
          cp lesson.html www/ || true
          cp lesson2.html www/ || true
          cp manifest.json www/ || true
          cp -r icons www/ || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Configure Capacitor
        run: |
          npx cap init "KENA DESIGN" "com.kenadesign.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KENA-DESIGN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
