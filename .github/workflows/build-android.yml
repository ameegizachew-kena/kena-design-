name: Build KENA DESIGN Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check required files
        run: |
          echo "Checking required files..."
          ls -la

          for file in index.html login.html register.html dashboard.html; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file hin jiru!"
              exit 1
            fi
          done

      - name: Prepare www folder
        run: |
          rm -rf www
          mkdir -p www

          cp -v index.html login.html register.html dashboard.html www/

          for file in *.html *.js *.css *.json *.webmanifest; do
            if [ -f "$file" ]; then
              cp -v "$file" www/
            fi
          done

          for folder in icons images media assets; do
            if [ -d "$folder" ]; then
              cp -r "$folder" www/
            fi
          done

          echo "===== WWW FILES ====="
          find www -maxdepth 3 -type f | sort

          test -f www/index.html
          test -f www/login.html
          test -f www/register.html
          test -f www/dashboard.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kenadesign.app",
            "appName": "KENA DESIGN",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          cat capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Sync and verify Android assets
        run: |
          npx cap sync android

          ASSETS="android/app/src/main/assets/public"

          echo "===== ANDROID ASSETS ====="
          find "$ASSETS" -maxdepth 3 -type f | sort

          for file in index.html login.html register.html dashboard.html; do
            if [ ! -f "$ASSETS/$file" ]; then
              echo "ERROR: $file APK assets keessa hin jiru!"
              exit 1
            fi
          done

          echo "All required HTML files are present."

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENA-DESIGN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
