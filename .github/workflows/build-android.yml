name: Build KENA DESIGN Android APK

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout project
        uses: actions/checkout@v4



      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22



      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21



      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest
          npm install @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest



      - name: Create Capacitor App
        run: |
          npx cap init "KENA DESIGN" "com.kenadesign.app" --web-dir .
          
          npx cap add android

          npx cap copy android

          npx cap sync android



      - name: Check Web Files
        run: |
          ls -la
          echo "Checking login.html"
          test -f login.html
          echo "login.html FOUND"



      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug



      - name: Upload KENA DESIGN APK
        uses: actions/upload-artifact@v4
        with:
          name: KENA-DESIGN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
