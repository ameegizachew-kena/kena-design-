<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    header {
      background: #101c2c;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .top-info {
      color: #9fb0c5;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .refresh {
      background: #32d583;
      color: #07111f;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .search-box {
      background: #101c2c;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #07111f;
      color: white;
      outline: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .stat {
      background: #101c2c;
      padding: 18px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #9fb0c5;
      font-size: 14px;
    }

    .total {
      color: #60a5fa;
    }

    .paid {
      color: #32d583;
    }

    .pending {
      color: #facc15;
    }

    .unpaid {
      color: #f87171;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #7f1d1d;
      color: white;
    }

    .table-box {
      background: #101c2c;
      padding: 15px;
      border-radius: 15px;
      overflow-x: auto;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #9fb0c5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 11px 8px;
      border-bottom: 1px solid #26364a;
      text-align: left;
      font-size: 14px;
    }

    th {
      color: #9fb0c5;
      background: #0b1727;
    }

    tr:hover {
      background: #132236;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-paid {
      background: #064e3b;
      color: #6ee7b7;
    }

    .status-pending {
      background: #713f12;
      color: #fde68a;
    }

    .status-unpaid {
      background: #7f1d1d;
      color: #fecaca;
    }

    .paid-btn {
      background: #32d583;
      color: #07111f;
      padding: 8px 11px;
      font-size: 12px;
    }

    .paid-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .view-btn {
      background: #3b82f6;
      color: white;
      padding: 8px 11px;
      font-size: 12px;
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: #9fb0c5;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: #101c2c;
      border-radius: 15px;
      padding: 15px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      margin: 0;
    }

    .close-btn {
      background: #ef4444;
      color: white;
    }

    #screenshotImage {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
      background: #07111f;
    }

    .mobile-card {
      display: none;
    }

    @media (max-width: 700px) {

      body {
        padding: 8px;
      }

      h1 {
        font-size: 21px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat {
        padding: 13px 8px;
      }

      .stat-number {
        font-size: 23px;
      }

      .table-box {
        padding: 8px;
        overflow: visible;
      }

      table {
        min-width: 0;
        width: 100%;
      }

      table thead {
        display: none;
      }

      table,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      tr {
        background: #0b1727;
        margin-bottom: 12px;
        border-radius: 12px;
        padding: 10px;
        border: 1px solid #26364a;
      }

      td {
        border: 0;
        padding: 6px 4px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      td::before {
        content: attr(data-label);
        color: #94a3b8;
        font-weight: bold;
        min-width: 90px;
      }

      td[data-label="Full Name"],
      td[data-label="Course"],
      td[data-label="Amount"],
      td[data-label="Method"],
      td[data-label="Status"],
      td[data-label="Screenshot"],
      td[data-label="Action"] {
        display: flex;
      }

      td[data-label="Father Name"],
      td[data-label="Gender"],
      td[data-label="Age"],
      td[data-label="Phone"],
      td[data-label="Email"],
      td[data-label="Address"],
      td[data-label="Paid Time"] {
        display: none;
      }

      .mobile-card {
        display: block;
        color: #9fb0c5;
        font-size: 12px;
        margin-bottom: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Kena Design Admin</h1>

    <div class="top-info">
      Barattoota: <strong id="studentCount">0</strong>
    </div>

    <div class="buttons">
      <button class="refresh" onclick="loadStudents()">
        🔄 Refresh
      </button>

      <button class="logout" onclick="logout()">
        Logout
      </button>
    </div>
  </header>

  <div id="message" class="message"></div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Maqaa, phone, course ykn address barbaadi..."
      oninput="renderStudents()"
    >
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-number total" id="totalCount">0</div>
      <div class="stat-label">Total</div>
    </div>

    <div class="stat">
      <div class="stat-number paid" id="paidCount">0</div>
      <div class="stat-label">Paid</div>
    </div>

    <div class="stat">
      <div class="stat-number pending" id="pendingCount">0</div>
      <div class="stat-label">Pending</div>
    </div>

    <div class="stat">
      <div class="stat-number unpaid" id="unpaidCount">0</div>
      <div class="stat-label">Unpaid</div>
    </div>

  </div>

  <div class="table-box">

    <div id="loading" class="loading">
      Loading...
    </div>

    <table id="studentsTable" style="display:none;">

      <thead>
        <tr>
          <th>#</th>
          <th>Full Name</th>
          <th>Father Name</th>
          <th>Gender</th>
          <th>Age</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Course</th>
          <th>Address</th>
          <th>Amount</th>
          <th>Method</th>
          <th>Status</th>
          <th>Screenshot</th>
          <th>Action</th>
          <th>Paid Time</th>
        </tr>
      </thead>

      <tbody id="studentsBody"></tbody>

    </table>

  </div>

</div>

<!-- Screenshot Modal -->
<div id="imageModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h3>Payment Screenshot</h3>

      <button class="close-btn" onclick="closeModal()">
        Close
      </button>

    </div>

    <img id="screenshotImage" src="" alt="Payment Screenshot">

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://baoczizarrnzxwguyili.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let students = [];


  // =========================
  // ADMIN CHECK
  // =========================

  async function checkAdmin() {

    try {

      const {
        data: {
          user
        },
        error
      } = await supabaseClient.auth.getUser();

      if (error || !user) {

        window.location.href = "admin.html";

        return false;
      }

      if (
        user.email !==
        "ameegizachew@gmail.com"
      ) {

        await supabaseClient.auth.signOut();

        alert(
          "Ati admin miti."
        );

        window.location.href = "admin.html";

        return false;
      }

      return true;

    } catch (error) {

      console.error(error);

      return false;
    }
  }


  // =========================
  // LOAD STUDENTS
  // =========================

  async function loadStudents() {

    const loading =
      document.getElementById("loading");

    const table =
      document.getElementById("studentsTable");

    loading.style.display = "block";
    table.style.display = "none";

    hideMessage();

    try {

      const controller =
        new AbortController();

      const timeout =
        setTimeout(() => {
          controller.abort();
        }, 15000);


      const {
        data,
        error
      } = await supabaseClient
        .from("Students")
        .select("*")
        .order("created_at", {
          ascending: false
        })
        .abortSignal(
          controller.signal
        );


      clearTimeout(timeout);


      if (error) {
        throw error;
      }


      students =
        data || [];


      updateStats();

      renderStudents();


      loading.style.display =
        "none";

      table.style.display =
        "table";


    } catch (error) {

      console.error(
        "Students error:",
        error
      );


      loading.style.display =
        "none";

      table.style.display =
        "table";


      if (
        error.name ===
        "AbortError"
      ) {

        showMessage(
          "Supabase irraa deebiin yeroo dheeraa fudhate. Refresh godhi.",
          "error"
        );

      } else {

        showMessage(
          "Barattoota fiduu hin dandeenye: " +
          error.message,
          "error"
        );
      }

    }
  }


  // =========================
  // STATS
  // =========================

  function updateStats() {

    const total =
      students.length;


    const paid =
      students.filter(
        student =>
          String(
            student.payment_status || ""
          ).toUpperCase() === "PAID"
      ).length;


    const pending =
      students.filter(
        student =>
          String(
            student.payment_status || ""
          ).toUpperCase() === "PENDING"
      ).length;


    const unpaid =
      students.filter(
        student =>
          String(
            student.payment_status || ""
          ).toUpperCase() === "UNPAID"
      ).length;


    document.getElementById(
      "totalCount"
    ).textContent = total;


    document.getElementById(
      "paidCount"
    ).textContent = paid;


    document.getElementById(
      "pendingCount"
    ).textContent = pending;


    document.getElementById(
      "unpaidCount"
    ).textContent = unpaid;


    document.getElementById(
      "studentCount"
    ).textContent = total;
  }


  // =========================
  // RENDER STUDENTS
  // =========================

  function renderStudents() {

    const body =
      document.getElementById(
        "studentsBody"
      );


    const search =
      document.getElementById(
        "searchInput"
      ).value
      .toLowerCase()
      .trim();


    let filtered =
      students.filter(student => {

        const text = [

          student.fullname,

          student["Full name"],

          student.fathername,

          student.phone,

          student.email,

          student.course,

          student.address,

          student.other_address,

          student.payment_method,

          student.payment_status

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(search);
      });


    if (
      filtered.length === 0
    ) {

      body.innerHTML = `
        <tr>
          <td
            colspan="15"
            class="no-data"
          >
            Barataan hin argamne.
          </td>
        </tr>
      `;

      return;
    }


    body.innerHTML =
      filtered.map(
        (student, index) =>
          studentRow(
            student,
            index + 1
          )
      ).join("");
  }


  // =========================
  // STUDENT ROW
  // =========================

  function studentRow(
    student,
    number
  ) {

    const status =
      String(
        student.payment_status ||
        "UNPAID"
      ).toUpperCase();


    let statusClass =
      "status-unpaid";


    if (status === "PAID") {

      statusClass =
        "status-paid";

    } else if (
      status === "PENDING"
    ) {

      statusClass =
        "status-pending";
    }


    const fullname =
      student.fullname ||
      student["Full name"] ||
      "-";


    const fathername =
      student.fathername ||
      "-";


    const gender =
      student.gender ||
      "-";


    const age =
      student.age ||
      "-";


    const phone =
      student.phone ||
      "-";


    const email =
      student.email ||
      "-";


    const course =
      student.course ||
      "-";


    const address =
      student.other_address ||
      student.address ||
      "-";


    const amount =
      student.payment_amount
      ? Number(
          student.payment_amount
        ).toLocaleString()
        + " ETB"
      : "-";


    const method =
      student.payment_method ||
      "-";


    const paidTime =
      student.paid_at
      ? new Date(
          student.paid_at
        ).toLocaleString()
      : "-";


    const screenshot =
      student.payment_screenshot_url
      ? `
        <button
          class="view-btn"
          onclick="viewScreenshot('${escapeJS(student.payment_screenshot_url)}')"
        >
          View
        </button>
      `
      : "-";


    const action =
      status === "PAID"
      ? `
        <button
          class="paid-btn"
          disabled
        >
          ✓ Paid
        </button>
      `
      : `
        <button
          class="paid-btn"
          onclick="markPaid('${escapeJS(student.id)}')"
        >
          PAID
        </button>
      `;


    return `
      <tr>

        <td data-label="#">
          ${number}
        </td>

        <td data-label="Full Name">
          ${escapeHTML(fullname)}
        </td>

        <td data-label="Father Name">
          ${escapeHTML(fathername)}
        </td>

        <td data-label="Gender">
          ${escapeHTML(gender)}
        </td>

        <td data-label="Age">
          ${escapeHTML(age)}
        </td>

        <td data-label="Phone">
          ${escapeHTML(phone)}
        </td>

        <td data-label="Email">
          ${escapeHTML(email)}
        </td>

        <td data-label="Course">
          ${escapeHTML(course)}
        </td>

        <td data-label="Address">
          ${escapeHTML(address)}
        </td>

        <td data-label="Amount">
          ${escapeHTML(amount)}
        </td>

        <td data-label="Method">
          ${escapeHTML(method)}
        </td>

        <td data-label="Status">
          <span class="status ${statusClass}">
            ${escapeHTML(status)}
          </span>
        </td>

        <td data-label="Screenshot">
          ${screenshot}
        </td>

        <td data-label="Action">
          ${action}
        </td>

        <td data-label="Paid Time">
          ${escapeHTML(paidTime)}
        </td>

      </tr>
    `;
  }


  // =========================
  // MARK PAID
  // =========================

  async function markPaid(id) {

    const confirmPaid =
      confirm(
        "Payment kana mirkaneessitee PAID gochuu barbaaddaa?"
      );


    if (!confirmPaid) {
      return;
    }


    try {

      const {
        error
      } = await supabaseClient
        .from("Students")
        .update({
          payment_status: "PAID",
          paid_at:
            new Date().toISOString()
        })
        .eq("id", id);


      if (error) {
        throw error;
      }


      showMessage(
        "Payment PAID godhameera.",
        "success"
      );


      await loadStudents();


    } catch (error) {

      console.error(error);

      showMessage(
        "PAID gochuu hin dandeenye: " +
        error.message,
        "error"
      );
    }
  }


  // =========================
  // VIEW SCREENSHOT
  // =========================

  async function viewScreenshot(
    path
  ) {

    try {

      if (!path) {

        alert(
          "Screenshot hin jiru."
        );

        return;
      }


      const {
        data,
        error
      } = await supabaseClient
        .storage
        .from("payment-proofs")
        .createSignedUrl(
          path,
          60 * 10
        );


      if (error) {
        throw error;
      }


      if (
        !data ||
        !data.signedUrl
      ) {

        throw new Error(
          "Screenshot URL hin argamne."
        );
      }


      document.getElementById(
        "screenshotImage"
      ).src =
        data.signedUrl;


      document.getElementById(
        "imageModal"
      ).style.display =
        "flex";


    } catch (error) {

      console.error(error);

      showMessage(
        "Screenshot banuu hin dandeenye: " +
        error.message,
        "error"
      );
    }
  }


  // =========================
  // CLOSE MODAL
  // =========================

  function closeModal() {

    document.getElementById(
      "imageModal"
    ).style.display =
      "none";


    document.getElementById(
      "screenshotImage"
    ).src = "";
  }


  // =========================
  // LOGOUT
  // =========================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "admin.html";
  }


  // =========================
  // MESSAGE
  // =========================

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.style.display =
      "block";


    if (type === "success") {

      message.style.background =
        "#065f46";

    } else {

      message.style.background =
        "#7f1d1d";
    }
  }


  function hideMessage() {

    document.getElementById(
      "message"
    ).style.display =
      "none";
  }


  // =========================
  // SECURITY HELPERS
  // =========================

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function escapeJS(value) {

    return String(value ?? "")
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );
  }


  // =========================
  // START
  // =========================

  async function startAdmin() {

    const isAdmin =
      await checkAdmin();


    if (!isAdmin) {
      return;
    }


    await loadStudents();
  }


  startAdmin();


  // Modal keessaa ala tuqnaan cufi
  document.getElementById(
    "imageModal"
  ).addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {
        closeModal();
      }

    }
  );

</script>

</body>
</html>
