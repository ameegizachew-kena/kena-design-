<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    .container {
      width: 96%;
      max-width: 1200px;
      margin: 15px auto;
    }

    .card {
      background: #101c2c;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 8px;
      color: #9fb0c5;
      font-weight: bold;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 9px;
      font-weight: bold;
    }

    .refresh {
      background: #2563eb;
      color: white;
      padding: 10px 15px;
    }

    .logout {
      background: #dc2626;
      color: white;
      padding: 10px 15px;
      margin-left: 5px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #07111f;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .search:focus {
      border-color: #32d583;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .filterBtn {
      padding: 9px 13px;
      background: #334155;
      color: white;
    }

    .filterBtn.active {
      background: #059669;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 15px;
      border-radius: 13px;
      text-align: center;
      font-weight: bold;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 6px;
    }

    .total {
      background: #082f49;
      color: #7dd3fc;
    }

    .paidStat {
      background: #064e3b;
      color: #6ee7b7;
    }

    .pendingStat {
      background: #713f12;
      color: #fde68a;
    }

    .unpaidStat {
      background: #7f1d1d;
      color: #fecaca;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: bold;
      word-break: break-word;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .success {
      background: #064e3b;
      color: #6ee7b7;
    }

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: #9fb0c5;
      font-weight: bold;
    }

    .tableWrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 1100px;
      border-collapse: collapse;
    }

    th {
      background: #07111f;
      color: #9fb0c5;
      padding: 12px;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #26364a;
      white-space: nowrap;
      vertical-align: middle;
    }

    tr:hover {
      background: #132236;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-paid {
      background: #064e3b;
      color: #6ee7b7;
    }

    .status-pending {
      background: #713f12;
      color: #fde68a;
    }

    .status-unpaid {
      background: #7f1d1d;
      color: #fecaca;
    }

    .paidBtn {
      background: #059669;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
    }

    .paidBtn:disabled {
      background: #166534;
      opacity: .7;
      cursor: not-allowed;
    }

    .viewBtn {
      background: #2563eb;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 35px;
      color: #9fb0c5;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.88);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modalBox {
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow: auto;
      background: #101c2c;
      border-radius: 15px;
      padding: 15px;
    }

    .modalTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modalTop h3 {
      margin: 0;
    }

    .closeBtn {
      background: #dc2626;
      color: white;
      padding: 8px 12px;
    }

    #screenshotImage {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
      background: #07111f;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .container {
        width: 94%;
      }

      .card {
        padding: 13px;
        border-radius: 14px;
      }

      h1 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat {
        padding: 12px 6px;
      }

      .stat strong {
        font-size: 23px;
      }

      .top {
        align-items: flex-start;
      }

      .refresh,
      .logout {
        padding: 9px 12px;
        font-size: 12px;
      }

      /*
        Mobile irratti:
        Full Name
        Course
        Amount
        Method
        Status
        Screenshot
        Action
        qofa mul'ata.
      */

      table {
        min-width: 760px;
      }

      th:nth-child(1),
      td:nth-child(1),

      th:nth-child(3),
      td:nth-child(3),

      th:nth-child(4),
      td:nth-child(4),

      th:nth-child(5),
      td:nth-child(5),

      th:nth-child(6),
      td:nth-child(6),

      th:nth-child(7),
      td:nth-child(7),

      th:nth-child(9),
      td:nth-child(9),

      th:nth-child(14),
      td:nth-child(14) {
        display: none;
      }

      th,
      td {
        padding: 10px 8px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="card">

    <div class="top">

      <div>

        <h1>Kena Design Admin</h1>

        <div class="subtitle">
          Barattoota:
          <span id="totalTop">0</span>
        </div>

      </div>

      <div>

        <button
          class="refresh"
          onclick="loadStudents()">
          ↻ Refresh
        </button>

        <button
          class="logout"
          onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message">
  </div>


  <!-- SEARCH -->

  <div class="card">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Maqaa, phone, course, status, address barbaadi..."
      oninput="renderStudents()"
    >

    <div class="filters">

      <button
        class="filterBtn active"
        id="allBtn"
        onclick="setFilter('ALL')">
        Hunda
      </button>

      <button
        class="filterBtn"
        id="paidBtnFilter"
        onclick="setFilter('PAID')">
        🟢 PAID
      </button>

      <button
        class="filterBtn"
        id="pendingBtnFilter"
        onclick="setFilter('PENDING')">
        🟡 PENDING
      </button>

      <button
        class="filterBtn"
        id="unpaidBtnFilter"
        onclick="setFilter('UNPAID')">
        🔴 UNPAID
      </button>

    </div>

  </div>


  <!-- STATS -->

  <div class="card">

    <div class="stats">

      <div class="stat total">
        Total
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat paidStat">
        Paid
        <strong id="paidCount">0</strong>
      </div>

      <div class="stat pendingStat">
        Pending
        <strong id="pendingCount">0</strong>
      </div>

      <div class="stat unpaidStat">
        Unpaid
        <strong id="unpaidCount">0</strong>
      </div>

    </div>

  </div>


  <!-- STUDENTS -->

  <div class="card">

    <div
      id="loading"
      class="loading">
      Loading...
    </div>

    <div class="tableWrap">

      <table
        id="studentsTable"
        style="display:none;">

        <thead>

          <tr>

            <th>#</th>

            <th>Full Name</th>

            <th>Father Name</th>

            <th>Gender</th>

            <th>Age</th>

            <th>Phone</th>

            <th>Email</th>

            <th>Course</th>

            <th>Address</th>

            <th>Amount</th>

            <th>Method</th>

            <th>Status</th>

            <th>Screenshot</th>

            <th>Paid Time</th>

            <th>Action</th>

          </tr>

        </thead>

        <tbody id="studentsBody"></tbody>

      </table>

    </div>

    <div
      id="empty"
      class="empty">
      Barataa hin argamne.
    </div>

  </div>

</div>


<!-- SCREENSHOT MODAL -->

<div
  id="imageModal"
  class="modal">

  <div class="modalBox">

    <div class="modalTop">

      <h3>Payment Screenshot</h3>

      <button
        class="closeBtn"
        onclick="closeModal()">
        Close
      </button>

    </div>

    <img
      id="screenshotImage"
      src=""
      alt="Payment Screenshot">

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://baoczizarrnzxwguyili.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

const ADMIN_EMAIL =
  "ameegizachew@gmail.com";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let students = [];

let currentFilter = "ALL";


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type = "error"
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display =
    "block";

}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin() {

  try {

    const timeout =
      new Promise((_, reject) => {

        setTimeout(() => {

          reject(
            new Error(
              "Supabase login verification timeout."
            )
          );

        }, 10000);

      });


    const sessionRequest =
      supabaseClient.auth.getSession();


    const {
      data,
      error
    } =
      await Promise.race([
        sessionRequest,
        timeout
      ]);


    if (error) {
      throw error;
    }


    const session =
      data &&
      data.session;


    if (!session) {

      showMessage(
        "Admin login hin jiru. Mee login godhi.",
        "error"
      );

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      return false;
    }


    const email =
      session.user &&
      session.user.email
        ? session.user.email.toLowerCase()
        : "";


    if (
      email !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      await supabaseClient.auth.signOut();

      showMessage(
        "Ati admin miti.",
        "error"
      );

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      return false;
    }


    return true;


  } catch (error) {

    console.error(
      "ADMIN CHECK ERROR:",
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "studentsTable"
    ).style.display =
      "table";


    showMessage(
      "Supabase/Admin connection rakkoo qaba: " +
      error.message,
      "error"
    );


    return false;
  }

}


/* =========================
   LOAD STUDENTS
========================= */

async function loadStudents() {

  const loading =
    document.getElementById(
      "loading"
    );

  const table =
    document.getElementById(
      "studentsTable"
    );


  loading.style.display =
    "block";

  table.style.display =
    "none";


  try {

    const controller =
      new AbortController();


    const timeout =
      setTimeout(() => {

        controller.abort();

      }, 15000);


    const request =
      supabaseClient
        .from("Students")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        )
        .abortSignal(
          controller.signal
        );


    const result =
      await request;


    clearTimeout(timeout);


    const {
      data,
      error
    } = result;


    if (error) {
      throw error;
    }


    students =
      data || [];


    updateStats();

    renderStudents();


    loading.style.display =
      "none";

    table.style.display =
      "table";


  } catch (error) {

    console.error(
      "STUDENTS ERROR:",
      error
    );


    loading.style.display =
      "none";

    table.style.display =
      "table";


    if (
      error.name ===
      "AbortError"
    ) {

      showMessage(
        "Supabase irraa deebiin yeroo dheeraa fudhate. Internet ykn Supabase connection ilaali.",
        "error"
      );

    } else {

      showMessage(
        "Barattoota fiduu hin dandeenye: " +
        error.message,
        "error"
      );

    }

  }

}


/* =========================
   STATUS
========================= */

function getStatus(student) {

  const status =
    String(
      student.payment_status || ""
    ).toUpperCase();


  if (
    status === "PAID"
  ) {

    return "PAID";

  }


  if (
    status === "PENDING"
  ) {

    return "PENDING";

  }


  return "UNPAID";

}


/* =========================
   STATS
========================= */

function updateStats() {

  const total =
    students.length;


  const paid =
    students.filter(
      s =>
        getStatus(s) ===
        "PAID"
    ).length;


  const pending =
    students.filter(
      s =>
        getStatus(s) ===
        "PENDING"
    ).length;


  const unpaid =
    students.filter(
      s =>
        getStatus(s) ===
        "UNPAID"
    ).length;


  document.getElementById(
    "totalTop"
  ).textContent =
    total;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "paidCount"
  ).textContent =
    paid;


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending;


  document.getElementById(
    "unpaidCount"
  ).textContent =
    unpaid;

}


/* =========================
   FILTER
========================= */

function setFilter(filter) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filterBtn"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  if (
    filter === "ALL"
  ) {

    document
      .getElementById(
        "allBtn"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter === "PAID"
  ) {

    document
      .getElementById(
        "paidBtnFilter"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter === "PENDING"
  ) {

    document
      .getElementById(
        "pendingBtnFilter"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter === "UNPAID"
  ) {

    document
      .getElementById(
        "unpaidBtnFilter"
      )
      .classList.add(
        "active"
      );

  }


  renderStudents();

}


/* =========================
   RENDER
========================= */

function renderStudents() {

  const body =
    document.getElementById(
      "studentsBody"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    students.filter(
      student => {

        const status =
          getStatus(student);


        if (
          currentFilter !==
          "ALL" &&
          status !==
          currentFilter
        ) {

          return false;

        }


        if (!search) {
          return true;
        }


        const text = [

          student.fullname,

          student["Full name"],

          student.fathername,

          student.gender,

          student.age,

          student.phone,

          student.email,

          student.course,

          student.address,

          student.other_address,

          student.payment_method,

          student.payment_status

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(
          search
        );

      }
    );


  body.innerHTML = "";


  if (
    filtered.length === 0
  ) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  filtered.forEach(
    (student, index) => {

      const status =
        getStatus(student);


      let statusClass =
        "status-unpaid";


      if (
        status === "PAID"
      ) {

        statusClass =
          "status-paid";

      }


      if (
        status === "PENDING"
      ) {

        statusClass =
          "status-pending";

      }


      const fullname =
        student.fullname ||
        student["Full name"] ||
        "-";


      const fathername =
        student.fathername ||
        "-";


      const gender =
        student.gender ||
        "-";


      const age =
        student.age ||
        "-";


      const phone =
        student.phone ||
        "-";


      const email =
        student.email ||
        "-";


      const course =
        student.course ||
        "-";


      const address =
        student.other_address ||
        student.address ||
        "-";


      const amount =
        student.payment_amount != null
          ? Number(
              student.payment_amount
            ).toLocaleString() +
            " ETB"
          : "-";


      const method =
        student.payment_method ||
        "-";


      const paidTime =
        student.paid_at
          ? new Date(
              student.paid_at
            ).toLocaleString()
          : "-";


      const screenshot =
        student.payment_screenshot_url
          ? `
              <button
                class="viewBtn"
                onclick="viewScreenshot('${escapeJS(student.payment_screenshot_url)}')">
                View
              </button>
            `
          : "-";


      const action =
        status === "PAID"
          ? `
              <button
                class="paidBtn"
                disabled>
                ✓ PAID
              </button>
            `
          : `
              <button
                class="paidBtn"
                onclick="markPaid('${escapeJS(student.id)}')">
                PAID
              </button>
            `;


      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHTML(fullname)}
        </td>

        <td>
          ${escapeHTML(fathername)}
        </td>

        <td>
          ${escapeHTML(gender)}
        </td>

        <td>
          ${escapeHTML(age)}
        </td>

        <td>
          ${escapeHTML(phone)}
        </td>

        <td>
          ${escapeHTML(email)}
        </td>

        <td>
          ${escapeHTML(course)}
        </td>

        <td>
          ${escapeHTML(address)}
        </td>

        <td>
          ${escapeHTML(amount)}
        </td>

        <td>
          ${escapeHTML(method)}
        </td>

        <td>

          <span
            class="status ${statusClass}">
            ${escapeHTML(status)}
          </span>

        </td>

        <td>
          ${screenshot}
        </td>

        <td>
          ${escapeHTML(paidTime)}
        </td>

        <td>
          ${action}
        </td>

      `;


      body.appendChild(tr);

    }
  );

}


/* =========================
   MARK PAID
========================= */

async function markPaid(id) {

  const ok =
    confirm(
      "Payment kana mirkaneessitee PAID gochuu barbaaddaa?"
    );


  if (!ok) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("Students")
        .update({
          payment_status:
            "PAID",

          paid_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    showMessage(
      "Payment PAID godhameera.",
      "success"
    );


    await loadStudents();


  } catch (error) {

    console.error(
      error
    );


    showMessage(
      "PAID gochuu hin dandeenye: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   SCREENSHOT
========================= */

async function viewScreenshot(
  path
) {

  try {

    if (!path) {

      throw new Error(
        "Screenshot hin jiru."
      );

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          "payment-proofs"
        )
        .createSignedUrl(
          path,
          600
        );


    if (error) {
      throw error;
    }


    if (
      !data ||
      !data.signedUrl
    ) {

      throw new Error(
        "Screenshot URL hin argamne."
      );

    }


    document.getElementById(
      "screenshotImage"
    ).src =
      data.signedUrl;


    document.getElementById(
      "imageModal"
    ).style.display =
      "flex";


  } catch (error) {

    console.error(
      "SCREENSHOT ERROR:",
      error
    );


    showMessage(
      "Screenshot banuu hin dandeenye: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

  document.getElementById(
    "imageModal"
  ).style.display =
    "none";


  document.getElementById(
    "screenshotImage"
  ).src =
    "";

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  try {

    await supabaseClient.auth.signOut();

  } finally {

    window.location.href =
      "index.html";

  }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJS(value) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* =========================
   START
========================= */

async function startAdmin() {

  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "block";


  const isAdmin =
    await checkAdmin();


  if (!isAdmin) {
    return;
  }


  await loadStudents();

}


startAdmin();

  .addEventListener(

    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );
