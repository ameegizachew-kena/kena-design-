<!DOCTYPE html>
<html lang="om">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kena Design Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 1500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      background: #087f3f;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .logout {
      background: #b00020;
      float: right;
    }

    .count {
      font-size: 24px;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1700px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
    }

    th {
      background: #f1f4f6;
    }

    .paid {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #dff7e5;
      color: #087f3f;
      font-weight: bold;
    }

    .pending {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-weight: bold;
    }

    .unpaid {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #ffe6e6;
      color: #b00020;
      font-weight: bold;
    }

    .view-btn {
      background: #1769aa;
    }

    .paid-btn {
      background: #087f3f;
    }

    .already-paid {
      color: #087f3f;
      font-weight: bold;
    }

    .error {
      color: #b00020;
      margin-top: 10px;
    }

    #adminArea {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- LOGIN -->

  <div
    id="loginArea"
    class="card"
  >

    <h1>Kena Design Admin</h1>

    <p>
      Admin account kee seeni.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>



  <!-- ADMIN AREA -->

  <div id="adminArea">


    <div class="card">

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

      <h1>
        Kena Design Admin
      </h1>

      <div class="count">

        Barattoota:
        <span id="studentCount">
          0
        </span>

      </div>

    </div>



    <!-- SEARCH -->

    <div class="card">

      <input
        id="search"
        type="text"
        placeholder="Maqaa, phone, course, reference, status barbaadi..."
        oninput="filterStudents()"
      >

    </div>



    <!-- TABLE -->

    <div class="card">

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>#</th>

              <th>Full Name</th>

              <th>Father Name</th>

              <th>Gender</th>

              <th>Age</th>

              <th>Phone</th>

              <th>Email</th>

              <th>Course</th>

              <th>Address</th>

              <th>Payment Status</th>

              <th>Amount</th>

              <th>Method</th>

              <th>Reference</th>

              <th>Screenshot</th>

              <th>Paid Time</th>

              <th>Action</th>

            </tr>

          </thead>


          <tbody
            id="studentTable"
          ></tbody>

        </table>

      </div>

    </div>

  </div>

</div>



<script>


  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL =
    "https://baoczizarrnzxwguyili.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let students = [];



  // =====================================================
  // LOGIN
  // =====================================================

  async function login() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const {
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email,
          password

        });


    if (error) {

      document
        .getElementById("loginError")
        .textContent =
          error.message;

      return;

    }


    showAdmin();

  }



  // =====================================================
  // SHOW ADMIN
  // =====================================================

  async function showAdmin() {

    document
      .getElementById("loginArea")
      .style.display =
        "none";


    document
      .getElementById("adminArea")
      .style.display =
        "block";


    await loadStudents();

  }



  // =====================================================
  // LOAD STUDENTS
  // =====================================================

  async function loadStudents() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("Students")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      alert(
        "Dogoggora: " +
        error.message
      );

      return;

    }


    students =
      data || [];


    document
      .getElementById("studentCount")
      .textContent =
        students.length;


    renderStudents(
      students
    );

  }



  // =====================================================
  // GET STORAGE PATH
  // =====================================================

  function getStoragePath(url) {

    if (!url) {
      return null;
    }


    try {

      const marker =
        "/storage/v1/object/public/payment-proofs/";


      if (
        url.includes(marker)
      ) {

        return decodeURIComponent(
          url.split(marker)[1]
        );

      }


      /*
        Yoo gara fuulduraatti
        payment_screenshot_url
        keessatti object path qofa
        yoo kuufame:
        fakkeenya:
        abc123/screenshot.jpg
      */

      if (
        !url.startsWith("http")
      ) {

        return url;

      }


    } catch (e) {

      console.error(e);

    }


    return null;

  }



  // =====================================================
  // CREATE PRIVATE SIGNED URL
  // =====================================================

  async function createScreenshotUrl(
    student
  ) {

    const original =
      student.payment_screenshot_url;


    const path =
      getStoragePath(
        original
      );


    if (!path) {

      return null;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from("payment-proofs")
        .createSignedUrl(
          path,
          300
        );


    if (error) {

      console.error(
        "Signed URL error:",
        error.message
      );

      return null;

    }


    return data?.signedUrl || null;

  }



  // =====================================================
  // VIEW SCREENSHOT
  // =====================================================

  async function viewScreenshot(
    studentId
  ) {

    const student =
      students.find(
        s =>
          String(s.id) ===
          String(studentId)
      );


    if (!student) {

      alert(
        "Student hin argamne."
      );

      return;

    }


    if (
      !student.payment_screenshot_url
    ) {

      alert(
        "Screenshot hin jiru."
      );

      return;

    }


    const button =
      document.getElementById(
        "view-" + studentId
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        "Opening...";

    }


    const signedUrl =
      await createScreenshotUrl(
        student
      );


    if (button) {

      button.disabled = false;

      button.textContent =
        "View";

    }


    if (!signedUrl) {

      alert(
        "Screenshot banamee jira ykn URL isaa sirrii miti."
      );

      return;

    }


    window.open(
      signedUrl,
      "_blank",
      "noopener,noreferrer"
    );

  }



  // =====================================================
  // RENDER STUDENTS
  // =====================================================

  function renderStudents(
    list
  ) {

    const table =
      document
        .getElementById(
          "studentTable"
        );


    table.innerHTML = "";


    list.forEach(
      (student, index) => {

        const tr =
          document.createElement(
            "tr"
          );


        const status =
          String(
            student.payment_status ||
            "PENDING"
          ).toUpperCase();


        let statusClass =
          "pending";


        if (
          status === "PAID"
        ) {

          statusClass =
            "paid";

        }


        if (
          status === "UNPAID"
        ) {

          statusClass =
            "unpaid";

        }


        const amount =
          student.payment_amount
            ? Number(
                student.payment_amount
              ).toLocaleString()
            : "-";


        const paidTime =
          student.paid_at
            ? new Date(
                student.paid_at
              ).toLocaleString()
            : "-";


        let screenshotHtml =
          "-";


        if (
          student.payment_screenshot_url
        ) {

          screenshotHtml = `

            <button
              id="view-${student.id}"
              class="view-btn"
              type="button"
              onclick="viewScreenshot('${student.id}')"
            >
              View
            </button>

          `;

        }


        let actionHtml =
          "-";


        if (
          status === "PENDING"
        ) {

          actionHtml = `

            <button
              class="paid-btn"
              type="button"
              onclick="markAsPaid('${student.id}')"
            >
              PAID
            </button>

          `;

        }


        if (
          status === "PAID"
        ) {

          actionHtml = `

            <span
              class="already-paid"
            >
              ✓ Paid
            </span>

          `;

        }


        tr.innerHTML = `

          <td>
            ${index + 1}
          </td>

          <td>
            ${escapeHtml(
              student.fullname
            )}
          </td>

          <td>
            ${escapeHtml(
              student.fathername
            )}
          </td>

          <td>
            ${escapeHtml(
              student.gender
            )}
          </td>

          <td>
            ${escapeHtml(
              student.age
            )}
          </td>

          <td>
            ${escapeHtml(
              student.phone
            )}
          </td>

          <td>
            ${escapeHtml(
              student.email || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              student.course
            )}
          </td>

          <td>
            ${escapeHtml(
              student.address
            )}
          </td>

          <td>

            <span
              class="${statusClass}"
            >
              ${escapeHtml(status)}
            </span>

          </td>

          <td>
            ${amount} ETB
          </td>

          <td>
            ${escapeHtml(
              student.payment_method ||
              "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              student.payment_reference ||
              "-"
            )}
          </td>

          <td>
            ${screenshotHtml}
          </td>

          <td>
            ${escapeHtml(
              paidTime
            )}
          </td>

          <td>
            ${actionHtml}
          </td>

        `;


        table.appendChild(tr);

      }
    );

  }



  // =====================================================
  // MARK AS PAID
  // =====================================================

  async function markAsPaid(
    studentId
  ) {

    const student =
      students.find(
        s =>
          String(s.id) ===
          String(studentId)
      );


    if (!student) {

      alert(
        "Student hin argamne."
      );

      return;

    }


    const confirmation =
      confirm(
        "Payment kana mirkaneessitee PAID gochuu barbaaddaa?"
      );


    if (!confirmation) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("Students")
        .update({

          payment_status:
            "PAID",

          paid_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          studentId
        );


    if (error) {

      alert(
        "Payment update hin milkoofne:\n" +
        error.message
      );

      return;

    }


    alert(
      "Payment PAID godhameera."
    );


    await loadStudents();

  }



  // =====================================================
  // SEARCH
  // =====================================================

  function filterStudents() {

    const q =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if (!q) {

      renderStudents(
        students
      );

      return;

    }


    const filtered =
      students.filter(
        student => {

          const text = [

            student.fullname,

            student.fathername,

            student.phone,

            student.email,

            student.course,

            student.address,

            student.payment_status,

            student.payment_method,

            student.payment_reference,

            student.payment_amount

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          return text.includes(q);

        }
      );


    renderStudents(
      filtered
    );

  }



  // =====================================================
  // HTML ESCAPE
  // =====================================================

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }



  // =====================================================
  // LOGOUT
  // =====================================================

  async function logout() {

    await supabaseClient.auth
      .signOut();


    location.reload();

  }



  // =====================================================
  // EXISTING SESSION
  // =====================================================

  async function checkSession() {

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if (
      data &&
      data.session
    ) {

      showAdmin();

    }

  }


  checkSession();


</script>

</body>

  </html>
