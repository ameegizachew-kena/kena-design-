<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Kena Design</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-box,
    .admin-box {
      background: #101c2c;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #32d583;
      color: #07111f;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      background: #ef4444;
      color: white;
      max-width: 150px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .count {
      background: #18283d;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .search {
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #101c2c;
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #26364a;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #18283d;
    }

    .table-box {
      overflow-x: auto;
      border-radius: 12px;
    }

    .hidden {
      display: none;
    }

    .message {
      text-align: center;
      padding: 15px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 24px;
      }

      th,
      td {
        font-size: 13px;
        padding: 9px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔐 Kena Design - Admin</h1>


  <!-- LOGIN -->

  <div id="loginBox" class="login-box">

    <h2>Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Seeni
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminBox" class="admin-box hidden">

    <div class="top">

      <div class="count">
        Barattoota: <strong id="studentCount">0</strong>
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Ba'i
      </button>

    </div>


    <input
      class="search"
      type="text"
      id="search"
      placeholder="Barataa barbaadi..."
      oninput="filterStudents()"
    >


    <div class="table-box">

      <table>

        <thead>

          <tr>
            <th>#</th>
            <th>Maqaa</th>
            <th>Maqaa Abbaa</th>
            <th>Koorniyaa</th>
            <th>Umurii</th>
            <th>Bilbila</th>
            <th>Email</th>
            <th>Koorsii</th>
            <th>Teessoo</th>
          </tr>

        </thead>

        <tbody id="studentTable">
        </tbody>

      </table>

    </div>

    <div
      id="dataMessage"
      class="message"
    ></div>

  </div>

</div>


<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://baoczizarrnzxwguyili.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let students = [];


  // ==============================
  // LOGIN
  // ==============================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const message =
      document.getElementById("loginMessage");


    message.textContent =
      "Seenaa jira...";


    const { error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.textContent =
        "Login hin milkoofne: " +
        error.message;

      return;
    }


    message.textContent = "";

    showAdmin();

    loadStudents();

  }


  // ==============================
  // SHOW ADMIN
  // ==============================

  function showAdmin() {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

  }


  // ==============================
  // LOAD STUDENTS
  // ==============================

  async function loadStudents() {

    const dataMessage =
      document.getElementById("dataMessage");


    dataMessage.textContent =
      "Galmee fe'aa jira...";


    const { data, error } =
      await supabaseClient
        .from("Students")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      dataMessage.textContent =
        "Dogoggora: " +
        error.message;

      console.error(error);

      return;
    }


    students = data || [];


    document
      .getElementById("studentCount")
      .textContent = students.length;


    displayStudents(students);


    dataMessage.textContent = "";

  }


  // ==============================
  // DISPLAY STUDENTS
  // ==============================

  function displayStudents(data) {

    const table =
      document.getElementById("studentTable");


    table.innerHTML = "";


    data.forEach((student, index) => {

      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>${index + 1}</td>

        <td>${student.fullname || ""}</td>

        <td>${student.fathername || ""}</td>

        <td>${student.gender || ""}</td>

        <td>${student.age || ""}</td>

        <td>${student.phone || ""}</td>

        <td>${student.email || ""}</td>

        <td>${student.course || ""}</td>

        <td>${student.address || ""}</td>

      `;


      table.appendChild(row);

    });

  }


  // ==============================
  // SEARCH
  // ==============================

  function filterStudents() {

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
      students.filter(student =>

        (
          (student.fullname || "") + " " +
          (student.fathername || "") + " " +
          (student.phone || "") + " " +
          (student.course || "") + " " +
          (student.address || "")
        )
        .toLowerCase()
        .includes(search)

      );


    displayStudents(filtered);

  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

    document
      .getElementById("password")
      .value = "";

  }


  // ==============================
  // CHECK EXISTING SESSION
  // ==============================

  async function checkLogin() {

    const {
      data: {
        session
      }
    } = await supabaseClient
      .auth
      .getSession();


    if (session) {

      showAdmin();

      loadStudents();

    }

  }


  checkLogin();

</script>

</body>
        </html>
