<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: #101c2c;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    h1 {
      margin-top: 0;
    }

    /* LOGIN */

    #loginPage {
      max-width: 430px;
      margin: 70px auto;
    }

    .login-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-title h1 {
      font-size: 28px;
    }

    .login-title p {
      color: #9fb0c5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #07111f;
      color: white;
      outline: none;
      font-size: 15px;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #32d583;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #32d583;
      color: #07111f;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* HEADER */

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .subtitle {
      color: #9fb0c5;
      font-weight: bold;
      margin-top: 7px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh {
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    /* SEARCH */

    .search {
      width: 100%;
      margin-bottom: 10px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #334155;
      color: white;
    }

    .filter-btn.active {
      background: #059669;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 6px;
    }

    .total {
      background: #082f49;
      color: #7dd3fc;
    }

    .paid-stat {
      background: #064e3b;
      color: #6ee7b7;
    }

    .pending-stat {
      background: #713f12;
      color: #fde68a;
    }

    .unpaid-stat {
      background: #7f1d1d;
      color: #fecaca;
    }

    /* MESSAGE */

    .message {
      display: none;
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-weight: bold;
      word-break: break-word;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .success {
      background: #064e3b;
      color: #6ee7b7;
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 35px;
      color: #9fb0c5;
      font-weight: bold;
    }

    /* TABLE */

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
    }

    th {
      background: #07111f;
      color: #9fb0c5;
      padding: 11px;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 11px;
      border-bottom: 1px solid #26364a;
      white-space: nowrap;
    }

    tr:hover {
      background: #132236;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-paid {
      background: #064e3b;
      color: #6ee7b7;
    }

    .status-pending {
      background: #713f12;
      color: #fde68a;
    }

    .status-unpaid {
      background: #7f1d1d;
      color: #fecaca;
    }

    .paid-btn {
      background: #059669;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
    }

    .paid-btn:disabled {
      background: #166534;
      opacity: .7;
      cursor: not-allowed;
    }

    .view-btn {
      background: #2563eb;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 35px;
      color: #9fb0c5;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.88);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal-box {
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow: auto;
      background: #101c2c;
      border-radius: 15px;
      padding: 15px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-top h3 {
      margin: 0;
    }

    .close-btn {
      background: #dc2626;
      color: white;
    }

    #screenshotImage {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      body {
        padding: 8px;
      }

      .card {
        padding: 13px;
        border-radius: 14px;
      }

      #loginPage {
        margin: 40px auto;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat {
        padding: 13px 7px;
      }

      .stat strong {
        font-size: 23px;
      }

      .header-row {
        align-items: flex-start;
      }

      .buttons button {
        padding: 9px 12px;
        font-size: 12px;
      }

      table {
        min-width: 760px;
      }

      /* Mobile irratti odeeffannoo barbaachisaa qofa */

      th:nth-child(1),
      td:nth-child(1),

      th:nth-child(3),
      td:nth-child(3),

      th:nth-child(4),
      td:nth-child(4),

      th:nth-child(5),
      td:nth-child(5),

      th:nth-child(6),
      td:nth-child(6),

      th:nth-child(7),
      td:nth-child(7),

      th:nth-child(9),
      td:nth-child(9),

      th:nth-child(14),
      td:nth-child(14) {
        display: none;
      }

      th,
      td {
        padding: 9px 7px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

    <p>

    </p>

  <div id="loginMessage"
       class="message">
  </div>

  <label>
    Email
  </label>

  <input

<!-- =========================

========================= -->

<div

  style="display:none;">

  <!-- HEADER -->

  <div class="card">

    <div class="header-row">

<!-- =========================

<div

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://baoczizarrnzxwguyili.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

const ADMIN_EMAIL =
  "ameegizachew@gmail.com";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let students = [];

let currentFilter =
  "ALL";


/* =========================
   LOGIN MESSAGE
========================= */

function showLoginMessage(
  text
) {

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.textContent =
    text;

  box.className =
    "message error";

  box.style.display =
    "block";
}


/* =========================
   ADMIN MESSAGE
========================= */

function showMessage(
  text,
  type = "error"
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message " + type;

  box.style.display =
    "block";
}


/* =========================
   LOGIN
========================= */

async function loginAdmin() {

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();

  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  if (!email) {

    showLoginMessage(
      "Email galchi."
    );

    return;
  }


  if (!password) {

    showLoginMessage(
      "Password galchi."
    );

    return;
  }


  const button =
    document.getElementById(
      "loginButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Logging in...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email: email,
          password: password
        });


    if (error) {
      throw error;
    }


    if (
      !data ||
      !data.user
    ) {

      throw new Error(
        "Login hin milkoofne."
      );
    }


    if (
      data.user.email
        .toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      await supabaseClient
        .auth
        .signOut();

      throw new Error(
        "Email kun admin email miti."
      );
    }


    document.getElementById(
      "loginPage"
    ).style.display =
      "none";


    document.getElementById(
      "adminPage"
    ).style.display =
      "block";


    await loadStudents();


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );


    showLoginMessage(
      "Login hin milkoofne: " +
      error.message
    );


  } finally {

    button.disabled =
      false;

    button.textContent =
      "Login";

  }

}


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkExistingSession() {

  try {

    const timeout =
      new Promise((_, reject) => {

        setTimeout(() => {

          reject(
            new Error(
              "Session timeout"
            )
          );

        }, 8000);

      });


    const sessionRequest =
      supabaseClient
        .auth
        .getSession();


    const {
      data,
      error
    } =
      await Promise.race([
        sessionRequest,
        timeout
      ]);


    if (error) {
      return;
    }


    const session =
      data &&
      data.session;


    if (
      !session ||
      !session.user
    ) {

      return;
    }


    if (
      session.user.email
        .toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      await supabaseClient
        .auth
        .signOut();

      return;
    }


    document.getElementById(
      "loginPage"
    ).style.display =
      "none";


    document.getElementById(
      "adminPage"
    ).style.display =
      "block";


    await loadStudents();


  } catch (error) {

    console.log(
      "No existing session:",
      error.message
    );

  }

}


/* =========================
   LOAD STUDENTS
========================= */

async function loadStudents() {

  const loading =
    document.getElementById(
      "loading"
    );

  const table =
    document.getElementById(
      "studentsTable"
    );


  loading.style.display =
    "block";

  table.style.display =
    "none";


  try {

    const controller =
      new AbortController();


    const timeout =
      setTimeout(() => {

        controller.abort();

      }, 15000);


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Students")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        )
        .abortSignal(
          controller.signal
        );


    clearTimeout(
      timeout
    );


    if (error) {
      throw error;
    }


    students =
      data || [];


    updateStats();

    renderStudents();


    loading.style.display =
      "none";

    table.style.display =
      "table";


  } catch (error) {

    console.error(
      "STUDENTS ERROR:",
      error
    );


    loading.style.display =
      "none";

    table.style.display =
      "table";


    if (
      error.name ===
      "AbortError"
    ) {

      showMessage(
        "Supabase irraa deebiin yeroo dheeraa fudhate. Internet ykn Supabase connection ilaali.",
        "error"
      );

    } else {

      showMessage(
        "Barattoota fiduu hin dandeenye: " +
        error.message,
        "error"
      );

    }

  }

}


/* =========================
   STATUS
========================= */

function getStatus(
  student
) {

  const status =
    String(
      student.payment_status ||
      ""
    ).toUpperCase();


  if (
    status ===
    "PAID"
  ) {

    return "PAID";

  }


  if (
    status ===
    "PENDING"
  ) {

    return "PENDING";

  }


  return "UNPAID";

}


/* =========================
   STATS
========================= */

function updateStats() {

  const total =
    students.length;


  const paid =
    students.filter(
      s =>
        getStatus(s) ===
        "PAID"
    ).length;


  const pending =
    students.filter(
      s =>
        getStatus(s) ===
        "PENDING"
    ).length;


  const unpaid =
    students.filter(
      s =>
        getStatus(s) ===
        "UNPAID"
    ).length;


  document.getElementById(
    "totalTop"
  ).textContent =
    total;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "paidCount"
  ).textContent =
    paid;


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending;


  document.getElementById(
    "unpaidCount"
  ).textContent =
    unpaid;

}


/* =========================
   FILTER
========================= */

function setFilter(
  filter
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );


  if (
    filter ===
    "ALL"
  ) {

    document
      .getElementById(
        "allBtn"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter ===
    "PAID"
  ) {

    document
      .getElementById(
        "paidFilter"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter ===
    "PENDING"
  ) {

    document
      .getElementById(
        "pendingFilter"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter ===
    "UNPAID"
  ) {

    document
      .getElementById(
        "unpaidFilter"
      )
      .classList.add(
        "active"
      );

  }


  renderStudents();

}


/* =========================
   RENDER STUDENTS
========================= */

function renderStudents() {

  const body =
    document.getElementById(
      "studentsBody"
    );

  const empty =
    document.getElementById(
      "empty"
    );


  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    students.filter(
      student => {

        const status =
          getStatus(
            student
          );


        if (
          currentFilter !==
          "ALL" &&
          status !==
          currentFilter
        ) {

          return false;

        }


        if (!search) {

          return true;

        }


        const text = [

          student.fullname,

          student["Full name"],

          student.fathername,

          student.phone,

          student.email,

          student.course,

          student.address,

          student.other_address,

          student.payment_method,

          student.payment_status

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(
          search
        );

      }
    );


  body.innerHTML =
    "";


  if (
    filtered.length ===
    0
  ) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  filtered.forEach(
    (student, index) => {

      const status =
        getStatus(
          student
        );


      let statusClass =
        "status-unpaid";


      if (
        status ===
        "PAID"
      ) {

        statusClass =
          "status-paid";

      }


      if (
        status ===
        "PENDING"
      ) {

        statusClass =
          "status-pending";

      }


      const fullname =
        student.fullname ||
        student["Full name"] ||
        "-";


      const fathername =
        student.fathername ||
        "-";


      const gender =
        student.gender ||
        "-";


      const age =
        student.age ||
        "-";


      const phone =
        student.phone ||
        "-";


      const email =
        student.email ||
        "-";


      const course =
        student.course ||
        "-";


      const address =
        student.other_address ||
        student.address ||
        "-";


      const amount =
        student.payment_amount !=
        null
          ? Number(
              student.payment_amount
            ).toLocaleString() +
            " ETB"
          : "-";


      const method =
        student.payment_method ||
        "-";


      const paidTime =
        student.paid_at
          ? new Date(
              student.paid_at
            ).toLocaleString()
          : "-";


      const screenshot =
        student.payment_screenshot_url
          ? `
            <button
              class="view-btn"
              onclick="viewScreenshot('${escapeJS(
                student.payment_screenshot_url
              )}')">
              View
            </button>
          `
          : "-";


      const action =
        status ===
        "PAID"
          ? `
            <button
              class="paid-btn"
              disabled>
              ✓ PAID
            </button>
          `
          : `
            <button
              class="paid-btn"
              onclick="markPaid('${escapeJS(
                student.id
              )}')">
              PAID
            </button>

/* =========================
   MARK PAID
========================= */

async function markPaid(
  id
) {

  const ok =
    confirm(
      "Payment kana mirkaneessitee PAID gochuu barbaaddaa?"
    );


  if (!ok) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("Students")
        .update({

          payment_status:
            "PAID",

          paid_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    showMessage(
      "Payment PAID godhameera.",
      "success"
    );


    await loadStudents();


  } catch (error) {

    console.error(
      error
    );


    showMessage(
      "PAID gochuu hin dandeenye: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   SCREENSHOT
========================= */

async function viewScreenshot(
  path
) {

  try {

    if (!path) {

      throw new Error(
        "Screenshot hin jiru."
      );

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          "payment-proofs"
        )
        .createSignedUrl(
          path,
          600
        );


    if (error) {
      throw error;
    }


    if (
      !data ||
      !data.signedUrl
    ) {

      throw new Error(
        "Screenshot URL hin argamne."
      );

    }


    document.getElementById(
      "screenshotImage"
    ).src =
      data.signedUrl;


    document.getElementById(
      "imageModal"
    ).style.display =
      "flex";


  } catch (error) {

    console.error(
      "SCREENSHOT ERROR:",
      error
    );


    showMessage(
      "Screenshot banuu hin dandeenye: " +
      error.message,
      "error"
    );

  }

}


/* =========================

========================= */

function closeModal() {

  document.getElementById(

  ).style.display =
    "none";


  document.getElementById(
    "screenshotImage"
  ).src =

}


/* =========================

========================= */

async function logout() {

  await supabaseClient
    .auth
    .signOut();

  document.getElementById(
    "adminPage"
  ).style.display =
    "none";

  document.getElementById(
    "loginPage"
  ).style.display =

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJS(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}
