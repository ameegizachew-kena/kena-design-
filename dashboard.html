body{

  line-height:1.6

header{
  background:#fff;

  top:0;
  z-index:10
}

.nav{

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.logo{font-size:22px;font-weight:bold}
.logo span{color:#10a878}

button,.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block

.logout{background:#ef4444;color:white}
.primary{background:#10a878;color:white}

.container{max-width:1100px;margin:auto;padding:22px 15px}

.welcome,.section{
  background:white;
  border:1px solid #dce8f0;
  border-radius:16px;
  padding:22px;
  margin-bottom:22px

.welcome{
  background:linear-gradient(120deg,#e8fbf3,#f0f8ff)
}

h1{font-size:25px;margin-bottom:8px}
h2{font-size:21px;margin-bottom:12px}
.muted{color:#63798d}

.info{
  background:white;
  border:1px solid #dce8f0;
  border-radius:9px;
  padding:12px;
  margin-top:12px;
  overflow-wrap:anywhere
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px
}

.card{
  border:1px solid #d7e5ee;
  background:#f9fcff;
  border-radius:13px;
  padding:17px;
  min-width:0
}

.icon{font-size:30px}
.card h3{margin:5px 0}
.card p{color:#63798d;margin-bottom:13px}

.btn{background:#10a878;color:white}
.btn:hover,.primary:hover{background:#087c59}

.secondary{background:#e6f5ef;color:#087c59}

.notice{
  background:#fff8e6;
  color:#76580b;
  border:1px solid #f1dfa4;
  border-radius:10px;
  padding:13px;
  margin-top:15px
}

.progress{margin-top:18px}
.bar{
  height:12px;
  background:#dce7ee;
  border-radius:20px;
  overflow:hidden;
  margin:9px 0
}
.fill{
  height:100%;
  width:0;
  background:#10a878;
  transition:width .3s
}

.hidden{display:none!important}

footer{text-align:center;padding:25px;color:#71869a}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .welcome,.section{padding:16px}
  h1{font-size:22px}
}

function checkLogin(){
  const loggedIn = localStorage.getItem("loggedIn");
  const savedStudent = localStorage.getItem("student");

  if(loggedIn !== "true" || !savedStudent){
    location.href = "login.html";
    return null;
  }

  try{
    return JSON.parse(savedStudent);
  }catch(e){
    localStorage.removeItem("student");
    localStorage.removeItem("loggedIn");
    location.href = "login.html";
    return null;
  }
}

function normalize(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ");
}

/* COURSE CARD */

function createCourseCard(course){
  const card = document.createElement("article");
  card.className = "card";

  const icon = document.createElement("div");
  icon.className = "icon";
  icon.textContent = course.icon;

  const title = document.createElement("h3");
  title.textContent = course.title;

  const description = document.createElement("p");
  description.textContent = course.description;

  const button = document.createElement("button");
  button.className = "primary";
  button.textContent = "📚 Barnoota Bani";
  button.addEventListener("click",function(){
    showLessons(course.id);
  });

  card.append(icon,title,description,button);
  return card;
}

/* LESSON CARD */

function createLessonCard(courseId,title,index){
  const card = document.createElement("article");
  card.className = "card";

  const icon = document.createElement("div");
  icon.className = "icon";
  icon.textContent = index === 30 ? "🏆" : "📘";

  const heading = document.createElement("h3");
  heading.textContent = "Lesson " + (index + 1) + " - " + title;

  const description = document.createElement("p");
  description.textContent =
    "Barnoota kana baradhu; ibsa fi hojii shaakala isaa hordofi.";

  const link = document.createElement("a");
  link.className = "btn";
  link.textContent = "📖 Baradhu →";

  /*
    Linkiiwwan faayilii jiran qofaaf.
    Lesson 1-3 Graphic Design irratti maqaa faayilii beekamaa fayyadama.
    Lessonwwan biroo yeroo faayiliin isaanii uumamu walqabsiisuu qabda.
  */

  if(courseId === "graphic design" && index === 0){
    link.href = "lesson.html";
  }else if(courseId === "graphic design" && index === 1){
    link.href = "lesson2.html";
  }else if(courseId === "graphic design" && index === 2){
    link.href = "lesson3.html";
  }else{
    link.href = "#";
    link.addEventListener("click",function(event){
      event.preventDefault();
      alert(
        "Lesson kanaaf fuulli barnootaa ammallee hin uumamne. " +
        "Faayilii lesson kanaa uumuu qabda."
      );
    });
  }

  const completed = document.createElement("p");
  completed.style.marginTop = "10px";

  const key = completionKey(courseId,index + 1);

  if(localStorage.getItem(key) === "true"){
    completed.textContent = "✅ Barnoota kana xumurteetta.";
  }

  card.append(icon,heading,description,link,completed);
  return card;
}

function completionKey(courseId,lessonNumber){
  return "completed_" +
    courseId.replace(/\s+/g,"_") +
    "_lesson_" + lessonNumber;
}

/* DASHBOARD */

function loadStudent(){
  const student = checkLogin();
  if(!student) return;

  const name = student.fullname || "Barataa!";
  const course = normalize(student.course);

  document.getElementById("welcomeName").textContent = name;
  document.getElementById("studentName").textContent = name;
  document.getElementById("studentCourse").textContent =
    student.course || "-";

  const courseList = document.getElementById("courseList");
  courseList.replaceChildren();

  /*
    Barataan course tokko qofa qaba yoo ta'e,
    course isaa qofa agarsiisi.
    Yoo admin course hedduu kenne, coursewwan sana agarsiisi.
  */

  const studentCourses = Array.isArray(student.courses)
    ? student.courses.map(normalize)
    : [course];

  const availableCourses = courses.filter(function(item){
    return studentCourses.includes(item.id);
  });

  if(availableCourses.length === 0){
    const notice = document.createElement("div");
    notice.className = "notice";
    notice.textContent =
      "Course kee hin beekamne. Admin waliin dubbadhu. " +
      "Maqaan course sirrii ta'uu isaa mirkaneessi.";
    courseList.appendChild(notice);
    return;
  }

  availableCourses.forEach(function(item){
    courseList.appendChild(createCourseCard(item));
  });
}

/* LESSON LIST */

function showLessons(courseId){
  const titles = lessonTitles[courseId];
  const course = courses.find(function(item){
    return item.id === courseId;
  });

  if(!titles || !course) return;

  document.getElementById("courseSection").classList.add("hidden");
  document.getElementById("lessonSection").classList.remove("hidden");

  document.getElementById("courseTitle").textContent =
    "📚 " + course.title + " - Lesson 1–30";

  document.getElementById("courseDescription").textContent =
    course.description;

  const list = document.getElementById("lessonList");
  list.replaceChildren();

  titles.forEach(function(title,index){
    list.appendChild(createLessonCard(courseId,title,index));
  });

  document.getElementById("lessonNotice").classList.add("hidden");

  updateProgress(courseId,titles.length);

  window.scrollTo({top:0,behavior:"smooth"});
}

function showCourses(){
  document.getElementById("lessonSection").classList.add("hidden");
  document.getElementById("courseSection").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* PROGRESS */

function updateProgress(courseId,total){
  let completed = 0;

  for(let i=1;i<=total;i++){
    if(localStorage.getItem(completionKey(courseId,i)) === "true"){
      completed++;
    }
  }

  const percent = Math.round((completed / total) * 100);

  document.getElementById("progressFill").style.width =
    percent + "%";

  document.getElementById("progressText").textContent =
    completed + " / " + total + " Lesson xumurteetta (" +
    percent + "%).";
}

/* LOGOUT */

function logout(){
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("student");
  location.href = "login.html";
}
