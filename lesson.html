<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,sans-serif;
  line-height:1.7;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.header{
  text-align:center;
  padding:25px 15px;
  border-bottom:1px solid #26384d;
}
.header h1{color:#32d583;margin:0;font-size:30px}
.header p{color:#b9c4d2;font-size:18px}
.card{
  background:#101c2c;
  border:1px solid #32d583;
  border-radius:20px;
  padding:22px;
  margin:22px 0;
}
.card h2{color:#32d583;margin-top:0}
.assignment-preview{
  margin-top:18px;
  position:relative;
  cursor:pointer;
  border:2px solid #32d583;
  border-radius:18px;
  overflow:hidden;
  background:#07111f;
}
.assignment-preview img{
  width:100%;
  display:block;
  max-height:650px;
  object-fit:contain;
}
.click-hint{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.78);
  color:#fff;
  padding:8px 16px;
  border-radius:22px;
  font-size:14px;
  white-space:nowrap;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.94);
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{display:flex}
.modal img{
  max-width:96vw;
  max-height:90vh;
  object-fit:contain;
  border-radius:15px;
}
.close{
  position:absolute;
  top:8px;
  right:20px;
  color:#fff;
  font-size:48px;
  cursor:pointer;
  line-height:1;
}
@media(max-width:600px){
  .container{padding:12px}
  .header h1{font-size:25px}
  .card{padding:16px}
  .click-hint{font-size:12px}
}
</style>
