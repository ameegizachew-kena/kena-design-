<!DOCTYPE html>
<html lang="om">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #101c2c;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    #loginBox {
      max-width: 430px;
      margin: 70px auto 0;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .title h1 {
      margin-bottom: 8px;
    }

    .title p {
      color: #9fb0c5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border-radius: 9px;
      border: 1px solid #334155;
      background: #07111f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #32d583;
    }

    .loginBtn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #32d583;
      color: #07111f;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .loginBtn:disabled {
      opacity: .6;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .success {
      background: #064e3b;
      color: #6ee7b7;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logout {
      background: #dc2626;
      color: white;
      padding: 10px 15px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .welcome {
      color: #9fb0c5;
    }

    .course {
      background: linear-gradient(
        135deg,
        #064e3b,
        #0f766e
      );
      padding: 22px;
      border-radius: 15px;
    }

    .courseName {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    .paid {
      display: inline-block;
      margin-top: 10px;
      background: #16a34a;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .lesson {
      background: #18283b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .lesson h3 {
      margin: 0 0 7px;
    }

    .lesson p {
      color: #aebdce;
      margin: 0 0 10px;
    }

    .lessonBtn {
      background: #2563eb;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
    }

    .lessonBtn:hover {
      background: #1d4ed8;
    }

    .noLessons {
      text-align: center;
      color: #9fb0c5;
      padding: 30px;
    }

    @media(max-width:600px) {

      body {
        padding: 8px;
      }

      .card {
        padding: 14px;
      }

      #loginBox {
        margin-top: 35px;
      }

      .courseName {
        font-size: 21px;
      }

    }
  </style>

</head>


<body>


  <!-- LOGIN -->

  <div
    id="loginBox"
    class="card"
  >

    <div class="title">

      <h1>
        🎓 Kena Design
      </h1>

      <p>
        Student Learning Portal
      </p>

    </div>


    <div
      id="loginMessage"
      class="message"
    ></div>


    <label>
      Phone
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="09xxxxxxxx"
    >


    <label>
      PIN
    </label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="PIN kee galchi"
    >


    <button
      id="loginBtn"
      class="loginBtn"
      onclick="studentLogin()"
    >
      Login
    </button>

  </div>


  <!-- DASHBOARD -->

  <div
    id="dashboard"
    class="container"
    style="display:none;"
  >


    <div class="card">

      <div class="header">

        <div>

          <h1>
            🎓 Kena Design Learning
          </h1>

          <div
            id="welcome"
            class="welcome"
          ></div>

        </div>


        <button
          class="logout"
          onclick="studentLogout()"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- COURSE -->

    <div class="card">

      <div class="course">

        <div>
          Your Course
        </div>

        <div
          id="courseName"
          class="courseName"
        ></div>

        <span class="paid">
          ✓ PAYMENT PAID
        </span>

      </div>

    </div>


    <!-- LESSONS -->

    <div class="card">

      <h2>
        📚 Lessons
      </h2>

      <div id="lessons"></div>

    </div>


  </div>


  <script>


    /* =========================
       SETTINGS
    ========================= */

    const FUNCTION_URL =
      "https://baoczizarrnzxwguyili.supabase.co/functions/v1/student-login";


    /* =========================
       COURSES
    ========================= */

    const COURSES = {

      "Video Editing": [

        {
          title:
            "Lesson 1 — Introduction",

          description:
            "Video Editing maal akka ta'e baradhu.",

          link:
            "#"
        },

        {
          title:
            "Lesson 2 — Editing Basics",

          description:
            "Cut, trim fi timeline bu'uuraa.",

          link:
            "#"
        },

        {
          title:
            "Lesson 3 — Audio Editing",

          description:
            "Sagalee fi music sirreessuu.",

          link:
            "#"
        }

      ],


      "Graphic Design": [

        {
          title:
            "Lesson 1 — Introduction",

          description:
            "Graphic Design maal akka ta'e baradhu.",

          link:
            "#"
        },

        {
          title:
            "Lesson 2 — Design Basics",

          description:
            "Layout, shape fi typography.",

          link:
            "#"
        },

        {
          title:
            "Lesson 3 — Color",

          description:
            "Color theory fi color combination.",

          link:
            "#"
        }

      ],


      "Web Design": [

        {
          title:
            "Lesson 1 — Introduction",

          description:
            "Web Design bu'uuraa.",

          link:
            "#"
        },

        {
          title:
            "Lesson 2 — HTML",

          description:
            "HTML irraa website ijaaruu.",

          link:
            "#"
        },

        {
          title:
            "Lesson 3 — CSS",

          description:
            "CSS fi website styling.",

          link:
            "#"
        }

      ],


      "Digital Marketing": [

        {
          title:
            "Lesson 1 — Introduction",

          description:
            "Digital Marketing bu'uuraa.",

          link:
            "#"
        },

        {
          title:
            "Lesson 2 — Social Media",

          description:
            "Social media marketing.",

          link:
            "#"
        }

      ],


      "Photography": [

        {
          title:
            "Lesson 1 — Introduction",

          description:
            "Photography bu'uuraa.",

          link:
            "#"
        },

        {
          title:
            "Lesson 2 — Camera Basics",

          description:
            "Camera settings fi shooting.",

          link:
            "#"
        }

      ],


      "Flayer Package": [

        {
          title:
            "Lesson 1 — Flyer Design",

          description:
            "Flyer design bu'uuraa.",

          link:
            "#"
        }

      ],


      /* =========================
         YOUTUBE THUMBNAIL
         SIRREEFFAME
      ========================= */

      "YouTube Thumbnail": [

        {
          title:
            "Lesson 1 — Thumbnail Basics",

          description:
            "YouTube thumbnail ijaaruu.",

          link:
            "lesson.html?course=YouTube%20Thumbnail"
        }

      ],


      "Poster Design": [

        {
          title:
            "Lesson 1 — Poster Design",

          description:
            "Poster design bu'uuraa.",

          link:
            "#"
        }

      ]

    };


    /* =========================
       LOGIN
    ========================= */

    async function studentLogin() {

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const pin =
        document
          .getElementById("pin")
          .value
          .trim();


      if (!phone) {

        showLoginMessage(
          "Phone galchi."
        );

        return;
      }


      if (!pin) {

        showLoginMessage(
          "PIN galchi."
        );

        return;
      }


      const button =
        document.getElementById(
          "loginBtn"
        );


      button.disabled =
        true;

      button.textContent =
        "Logging in...";


      try {

        const response =
          await fetch(
            FUNCTION_URL,
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  phone:
                    phone,

                  pin:
                    pin

                })

            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Login hin milkoofne."
          );

        }


        const student =
          result.student;


        sessionStorage.setItem(
          "kena_student",
          JSON.stringify(
            student
          )
        );


        showDashboard(
          student
        );


      } catch (error) {

        console.error(
          error
        );


        showLoginMessage(
          error.message
        );


      } finally {

        button.disabled =
          false;

        button.textContent =
          "Login";

      }

    }


    /* =========================
       DASHBOARD
    ========================= */

    function showDashboard(
      student
    ) {

      document.getElementById(
        "loginBox"
      ).style.display =
        "none";


      document.getElementById(
        "dashboard"
      ).style.display =
        "block";


      document.getElementById(
        "welcome"
      ).textContent =
        "Welcome " +
        (
          student.fullname ||
          "Student"
        );


      document.getElementById(
        "courseName"
      ).textContent =
        student.course ||
        "Course hin argamne";


      renderLessons(
        student.course
      );

    }


    /* =========================
       LESSONS
    ========================= */

    function renderLessons(
      course
    ) {

      const box =
        document.getElementById(
          "lessons"
        );


      const lessons =
        COURSES[course] || [];


      box.innerHTML =
        "";


      if (
        lessons.length ===
        0
      ) {

        box.innerHTML = `
          <div class="noLessons">
            Lessons course kanaaf
            ammallee hin qophoofne.
          </div>
        `;

        return;

      }


      lessons.forEach(
        (lesson) => {

          box.insertAdjacentHTML(
            "beforeend",
            `

            <div class="lesson">

              <h3>
                ${escapeHTML(
                  lesson.title
                )}
              </h3>

              <p>
                ${escapeHTML(
                  lesson.description
                )}
              </p>

              <a
                class="lessonBtn"
                href="${escapeAttribute(
                  lesson.link
                )}"
              >
                📖 Open Lesson
              </a>

            </div>

            `
          );

        }
      );

    }


    /* =========================
       LOGIN MESSAGE
    ========================= */

    function showLoginMessage(
      text
    ) {

      const box =
        document.getElementById(
          "loginMessage"
        );


      box.textContent =
        text;


      box.className =
        "message error";


      box.style.display =
        "block";

    }


    /* =========================
       LOGOUT
    ========================= */

    function studentLogout() {

      sessionStorage.removeItem(
        "kena_student"
      );


      document.getElementById(
        "dashboard"
      ).style.display =
        "none";


      document.getElementById(
        "loginBox"
      ).style.display =
        "block";


      document.getElementById(
        "pin"
      ).value =
        "";

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        );

    }


    /* =========================
       EXISTING LOGIN
    ========================= */

    window.addEventListener(
      "load",
      () => {

        try {

          const saved =
            sessionStorage.getItem(
              "kena_student"
            );


          if (!saved) {
            return;
          }


          const student =
            JSON.parse(
              saved
            );


          if (
            student &&
            student.payment_status ===
              "PAID" &&
            student.learning_access ===
              true
          ) {

            showDashboard(
              student
            );

          }


        } catch (error) {

          sessionStorage.removeItem(
            "kena_student"
          );

        }

      }
    );

  </script>

</body>

</html>
