<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kena Design Learning</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:8px;
  background:#07111f;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

.card{
  background:#101c2c;
  padding:20px;
  border-radius:16px;
  margin-bottom:15px;
}

.course{
  color:#32d583;
  font-size:18px;
  font-weight:bold;
}

h1{
  font-size:32px;
  margin:10px 0 20px;
}

h2{
  font-size:27px;
}

h3{
  font-size:21px;
}

p,li{
  color:#d7e0eb;
  font-size:17px;
  line-height:1.8;
}

.contentBox{
  background:#0f2740;
  border-left:5px solid #32d583;
  padding:20px;
  border-radius:10px;
}

.example{
  background:#020617;
  border:1px solid #334155;
  border-radius:10px;
  padding:15px;
  margin:15px 0;
}

.backBtn,
.nextBtn{
  display:block;
  width:100%;
  text-align:center;
  padding:15px;
  border-radius:10px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  margin-top:10px;
  background:#2563eb;
}

.videoBox{
  width:100%;
  min-height:220px;
  background:#020617;
  border:1px solid #334155;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.completeBtn{
  width:100%;
  background:#32d583;
  color:#07111f;
  border:0;
  padding:16px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.completeBtn.done{
  background:#16a34a;
  color:white;
}

.status{
  display:none;
  background:#064e3b;
  color:#6ee7b7;
  padding:15px;
  border-radius:10px;
  margin-top:12px;
  font-weight:bold;
}

@media(max-width:600px){
  .card{
    padding:15px;
  }

  h1{
    font-size:28px;
  }

  h2{
    font-size:24px;
  }

  p,li{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="course">
🎓 Kena Design Learning
</div>

<h1 id="lessonTitle">
Lesson
</h1>

<a class="backBtn" href="./student.html">
← Back to Student Portal
</a>

</div>


<div class="card">

<h2>📚 Content</h2>

<div id="content" class="contentBox">
Loading...
</div>

</div>


<div class="card">

<div class="videoBox">

<div>

🎬

<h3>Lesson Video</h3>

<p>
Video barnootaa as irratti yeroo qophaa'u ni dabalama.
</p>

</div>

</div>

</div>


<div class="card">

<h2>📝 Assignment</h2>

<div id="assignment" class="contentBox">
Loading...
</div>

</div>


<div class="card">

<button
id="completeBtn"
class="completeBtn"
onclick="completeLesson()"
>
✓ Mark Lesson as Completed
</button>

<div id="status" class="status">
✅ Lesson completed!
</div>

<a class="nextBtn" href="./student.html">
← Back to Student Portal
</a>

</div>

</div>


<script>

/* =========================
   GET COURSE
========================= */

const params =
new URLSearchParams(
window.location.search
);

const course =
params.get("course") || "Graphic Design";


/* =========================
   COURSE LESSONS
========================= */

const COURSES = {

"Video Editing": {

title:"Video Editing — Lesson 1",

content:`

<h3>1. Video Editing jechuun maal?</h3>

<p>
Video Editing jechuun video waraabame tokko
sirreessuu, kutuu, walitti qabuufi bareechuudha.
</p>

<h3>2. Maaliif Video Editing barbaachisa?</h3>

<ul>
<li>Video qulqulluu uuma.</li>
<li>Dogoggora keessaa balleessa.</li>
<li>Sound fi music sirreessa.</li>
<li>Video nama hawwatu uuma.</li>
</ul>

<h3>3. Wantoota ijoo</h3>

<ul>
<li>Cut</li>
<li>Trim</li>
<li>Transition</li>
<li>Text</li>
<li>Music</li>
<li>Sound Effect</li>
</ul>

<div class="example">
<strong>Kaayyoo:</strong>
Video tokko qulqulluu fi professional gochuu.
</div>

`,

assignment:`

<p>
Video gabaabaa tokko filadhu.
</p>

<ul>
<li>Clip tokko kutu.</li>
<li>Text itti dabali.</li>
<li>Music itti dabali.</li>
<li>Video export godhi.</li>
</ul>

`

},


"Graphic Design": {

title:"Graphic Design — Lesson 1",

content:`

<h3>1. Graphic Design jechuun maal?</h3>

<p>
Graphic Design jechuun suuraa, text, halluu fi
shape fayyadamuun ergaa tokko karaa mul'ataa
dabarsuudha.
</p>

<h3>2. Wantoota ijoo Graphic Design</h3>

<ul>
<li>Typography</li>
<li>Color</li>
<li>Shape</li>
<li>Layout</li>
<li>Contrast</li>
<li>Composition</li>
</ul>

<h3>3. Design gaarii</h3>

<p>
Design gaariin qulqulluu, ifa fi dubbifamuu
salphaa ta'uu qaba.
</p>

<div class="example">
<strong>Yaadadhu:</strong>
Simple = Clear = Professional
</div>

`,

assignment:`

<p>
Poster ykn social media design tokko qopheessi.
</p>

<ul>
<li>Halluu 2 ykn 3 fayyadami.</li>
<li>Font dubbifamuu salphaa fayyadami.</li>
<li>Title ifa godhi.</li>
<li>Design qulqulluu godhi.</li>
</ul>

`

},


"Web Design": {

title:"Web Design — Lesson 1",

content:`

<h3>1. Web Design jechuun maal?</h3>

<p>
Web Design jechuun website tokko akka bareedu,
mobile fi computer irratti akka sirriitti hojjetu
qopheessuudha.
</p>

<h3>2. HTML</h3>

<p>
HTML website keessatti content fi structure uuma.
</p>

<h3>3. CSS</h3>

<p>
CSS halluu, size, spacing fi design website
to'ata.
</p>

<h3>4. JavaScript</h3>

<p>
JavaScript website akka interactive ta'u gargaara.
</p>

<ul>
<li>HTML = Structure</li>
<li>CSS = Design</li>
<li>JavaScript = Interaction</li>
</ul>

`,

assignment:`

<p>
HTML fi CSS fayyadamuun webpage xiqqoo tokko
qopheessi.
</p>

`

},


"Digital Marketing": {

title:"Digital Marketing — Lesson 1",

content:`

<h3>1. Digital Marketing jechuun maal?</h3>

<p>
Digital Marketing jechuun internet fi social media
fayyadamuun product ykn service beeksisuudha.
</p>

<h3>2. Bakka Digital Marketing</h3>

<ul>
<li>Facebook</li>
<li>Instagram</li>
<li>YouTube</li>
<li>TikTok</li>
<li>Google</li>
</ul>

<h3>3. Content Marketing</h3>

<p>
Content gaarii qopheessuun audience hawwachuu fi
customer argachuu dandeessa.
</p>

<div class="example">
<strong>Content gaarii:</strong>
Namaaf faayidaa qaba + ifa dha + nama hawwata.
</div>

`,

assignment:`

<p>
Business tokko filadhu.
</p>

<ul>
<li>Audience isaa murteessi.</li>
<li>Post tokko qopheessi.</li>
<li>Caption barreessi.</li>
<li>CTA itti dabali.</li>
</ul>

`

},


"Photography": {

title:"Photography — Lesson 1",

content:`

<h3>1. Photography jechuun maal?</h3>

<p>
Photography jechuun camera fayyadamuun
suuraa qabachuudha.
</p>

<h3>2. Composition</h3>

<ul>
<li>Rule of Thirds</li>
<li>Leading Lines</li>
<li>Balance</li>
<li>Framing</li>
</ul>

<h3>3. Lighting</h3>

<p>
Ifni suuraa keessatti gahee guddaa qaba.
Suuraa gaarii argachuuf lighting sirrii fayyadamuun
barbaachisaa dha.
</p>

<h3>4. Focus</h3>

<p>
Subject ijoo ifa ta'uu qaba.
</p>

`,

assignment:`

<p>
Suuraa 3 qopheessi:</p>

<ul>
<li>Portrait tokko</li>
<li>Object tokko</li>
<li>Outdoor photo tokko</li>
</ul>

`

},


"Flayer Package": {

title:"Flayer Package — Lesson 1",

content:`

<h3>1. Flyer jechuun maal?</h3>

<p>
Flyer jechuun odeeffannoo product, service,
event ykn business tokko beeksisuuf qophaa'uudha.
</p>

<h3>2. Flyer gaarii maal qaba?</h3>

<ul>
<li>Title guddaa</li>
<li>Suuraa qulqulluu</li>
<li>Halluu sirrii</li>
<li>Contact information</li>
<li>Call To Action</li>
</ul>

<h3>3. Layout</h3>

<p>
Odeeffannoon flyer keessatti sirnaan qoodamuu qaba.
</p>

`,

assignment:`

<p>
Business tokkoof flyer tokko qopheessi.</p>

<ul>
<li>Business name</li>
<li>Product/service</li>
<li>Phone number</li>
<li>Location</li>
<li>Call To Action</li>
</ul>

`

},


"YouTube Thumbnail": {

title:"YouTube Thumbnail — Lesson 1",

content:`

<h3>1. YouTube Thumbnail jechuun maal?</h3>

<p>
YouTube Thumbnail jechuun suuraa xiqqaa
video YouTube tokko bakka bu'uudha.
</p>

<p>
Thumbnail gaariin nama:
</p>

<ul>
<li>Video akka ilaalu</li>
<li>Akka cuqaasu</li>
<li>Akka fedhii itti qabaatu</li>
</ul>

<h3>2. Thumbnail gaarii maal qaba?</h3>

<ul>
<li>Suuraa qulqulluu</li>
<li>Text gabaabaa</li>
<li>Halluu sirrii</li>
<li>Subject ijoo</li>
<li>Contrast gaarii</li>
</ul>

<h3>3. Font</h3>

<p>
Font guddaa fi dubbifamuu salphaa fayyadami.
</p>

<div class="example">
<strong>Simple = Clear = Professional</strong>
</div>

<h3>4. Composition</h3>

<p>
Suuraa, title fi background sirnaan qoodi.
</p>

`,

assignment:`

<p>
YouTube Thumbnail tokko qopheessi.</p>

<ul>
<li>Suuraa qulqulluu tokko fayyadami.</li>
<li>Title gabaabaa barreessi.</li>
<li>Halluu 2 ykn 3 fayyadami.</li>
<li>Font guddaa fayyadami.</li>
<li>Subject ijoo ifa godhi.</li>
</ul>

`

},


"Poster Design": {

title:"Poster Design — Lesson 1",

content:`

<h3>1. Poster Design jechuun maal?</h3>

<p>
Poster jechuun event, product, service ykn
beeksisa tokko namaaf mul'isuuf qophaa'uudha.
</p>

<h3>2. Poster gaarii</h3>

<ul>
<li>Title guddaa</li>
<li>Suuraa qulqulluu</li>
<li>Halluu sirrii</li>
<li>Information barbaachisaa</li>
<li>Contact</li>
</ul>

<h3>3. Typography</h3>

<p>
Font muraasa fayyadamuun poster kee professional
godha.
</p>

<h3>4. Color</h3>

<p>
Halluu wal-siman filadhu. Halluu baay'ee walitti
makuu irraa of qusadhu.
</p>

`,

assignment:`

<p>
Event ykn business tokkoof poster tokko qopheessi.
</p>

<ul>
<li>Title</li>
<li>Date</li>
<li>Location</li>
<li>Contact</li>
<li>Suuraa</li>
</ul>

`

}

};


/* =========================
   SHOW COURSE
========================= */

const selected =
COURSES[course] ||
COURSES["Graphic Design"];

document.getElementById(
"lessonTitle"
).textContent = selected.title;

document.getElementById(
"content"
).innerHTML = selected.content;

document.getElementById(
"assignment"
).innerHTML = selected.assignment;


/* =========================
   COMPLETION
========================= */

const lessonKey =
"kena_lesson_completed_" +
encodeURIComponent(course);


function completeLesson(){

  localStorage.setItem(
    lessonKey,
    "completed"
  );

  showCompleted();

}


function showCompleted(){

  const btn =
  document.getElementById(
    "completeBtn"
  );

  const status =
  document.getElementById(
    "status"
  );

  if(btn){

    btn.textContent =
    "✓ Lesson Completed";

    btn.classList.add("done");

  }

  if(status){

    status.style.display =
    "block";

  }

}


window.addEventListener(
"load",
function(){

  if(
    localStorage.getItem(
      lessonKey
    ) === "completed"
  ){

    showCompleted();

  }

});

</script>

</body>
  </html>
