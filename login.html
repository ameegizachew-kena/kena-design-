<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0066ff;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0066ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginBtn {
      background: #008f45;
    }

    .otp-box {
      display: none;
      background: #fff3cd;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
    }

    .otp-number {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-top: 5px;
    }

    #message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h2>🎓 Student Login</h2>

  <!-- PHONE -->

  <label>📱 Lakkoofsa Bilbilaa</label>

  <input
    type="tel"
    id="phone"
    placeholder="0923502464"
    maxlength="13"
  >

  <!-- COURSE PIN -->

  <label>🔑 Course PIN</label>

  <input
    type="text"
    id="pin"
    placeholder="Fakkeenya: KD2350"
    maxlength="10"
    style="text-transform:uppercase;"
  >

  <!-- SEND OTP -->

  <button
    id="sendOtpBtn"
    onclick="sendOTP()"
  >
    📩 OTP Ergi
  </button>

  <!-- TESTING OTP -->

  <div
    id="otpBox"
    class="otp-box"
  >

    <div>OTP kee:</div>

    <div
      id="otpNumber"
      class="otp-number"
    >
      ------
    </div>

    <small>
      Testing mode
    </small>

  </div>

  <!-- OTP INPUT -->

  <label>🔢 OTP</label>

  <input
    type="text"
    id="otp"
    placeholder="OTP 6-digit"
    maxlength="6"
    inputmode="numeric"
  >

  <!-- LOGIN -->

  <button
    id="loginBtn"
    onclick="login()"
  >
    🔐 Login
  </button>

  <div id="message"></div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://baoczizarrnzxwguyili.supabase.co";


/* ==========================================
   EDGE FUNCTIONS
========================================== */

const SEND_OTP_URL =
  SUPABASE_URL +
  "/functions/v1/send-otp";

const VERIFY_OTP_URL =
  SUPABASE_URL +
  "/functions/v1/verify-otp";


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  success = false
) {

  const box =
    document.getElementById("message");

  box.style.display = "block";

  box.textContent = text;

  if (success) {

    box.style.background =
      "#d4edda";

    box.style.color =
      "#155724";

  } else {

    box.style.background =
      "#f8d7da";

    box.style.color =
      "#721c24";
  }
}


/* ==========================================
   SEND OTP
========================================== */

async function sendOTP() {

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const button =
    document
      .getElementById("sendOtpBtn");


  /* PHONE CHECK */

  if (
    !/^(09|07)\d{8}$/.test(phone)
  ) {

    showMessage(
      "Lakkoofsa bilbilaa sirrii galchi. Fakkeenya: 0923502464"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ OTP ergamaa jira...";


  try {

    const response =
      await fetch(
        SEND_OTP_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            phone: phone
          })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      showMessage(
        data.message ||
        "OTP erguun hin milkoofne."
      );

      return;
    }


    /* ==============================
       SHOW OTP
       TESTING ONLY
    ============================== */

    document
      .getElementById("otpBox")
      .style.display = "block";


    document
      .getElementById("otpNumber")
      .textContent =
        data.otp || "------";


    /* OTP INPUT AUTO FILL */

    if (data.otp) {

      document
        .getElementById("otp")
        .value =
          data.otp;
    }


    showMessage(
      "✅ OTP milkaa'inaan uumameera.",
      true
    );

  }

  catch (error) {

    console.error(
      "SEND OTP ERROR:",
      error
    );

    showMessage(
      "Server waliin wal qunnamuun hin danda'amne."
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "📩 OTP Ergi";
  }
}


/* ==========================================
   LOGIN / VERIFY OTP
========================================== */

async function login() {

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim()
      .toUpperCase();


  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  /* PHONE */

  if (
    !/^(09|07)\d{8}$/.test(phone)
  ) {

    showMessage(
      "Lakkoofsa bilbilaa sirrii galchi."
    );

    return;
  }


  /* PIN */

  if (!pin) {

    showMessage(
      "Course PIN galchi."
    );

    return;
  }


  /* OTP */

  if (
    !/^\d{6}$/.test(otp)
  ) {

    showMessage(
      "OTP digit 6 qabaachuu qaba."
    );

    return;
  }


  const button =
    document
      .getElementById("loginBtn");


  button.disabled = true;

  button.textContent =
    "⏳ Login hojjetamaa jira...";


  try {

    const response =
      await fetch(
        VERIFY_OTP_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            phone: phone,

            pin: pin,

            otp: otp

          })

        }
      );


    const data =
      await response.json();


    /* LOGIN FAILED */

    if (
      !response.ok ||
      !data.success
    ) {

      showMessage(
        data.error ||
        data.message ||
        "Login hin milkoofne."
      );

      return;
    }


    /* ==================================
       LOGIN SUCCESS
    ================================== */

    showMessage(
      "✅ Login milkaa'eera! Dashboard banamaa jira...",
      true
    );


    /* STUDENT DATA SAVE */

    localStorage.setItem(
      "student",
      JSON.stringify(
        data.student
      )
    );


    localStorage.setItem(
      "loggedIn",
      "true"
    );


    /* DASHBOARD REDIRECT */

    setTimeout(
      function() {

        window.location.href =
          "dashboard.html";

      },
      1000
    );

  }

  catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    showMessage(
      "Server waliin wal qunnamuun hin danda'amne."
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "🔐 Login";
  }
}

</script>

</body>
</html>
