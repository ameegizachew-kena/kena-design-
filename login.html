<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design - Student Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0066ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #008f45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    button:hover {
      background: #00753a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .info {
      margin-top: 18px;
      padding: 12px;
      background: #eef6ff;
      border: 1px solid #c8def7;
      border-radius: 8px;
      color: #174a78;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h2>🎓 Student Login</h2>

  <!-- PHONE -->

  <label for="phone">
    📱 Lakkoofsa Bilbilaa
  </label>

  <input
    type="tel"
    id="phone"
    placeholder="0923502464"
    maxlength="10"
    inputmode="numeric"
    autocomplete="tel"
  >

  <!-- PIN -->

  <label for="pin">
    🔑 Course PIN
  </label>

  <input
    type="text"
    id="pin"
    placeholder="Fakkeenya: KD2350"
    maxlength="10"
    autocomplete="off"
    style="text-transform:uppercase;"
  >

  <!-- LOGIN -->

  <button
    id="loginBtn"
    type="button"
    onclick="login()"
  >
    🔐 Login
  </button>

  <div class="info">
    Lakkoofsa bilbilaa fi Course PIN kee galchi.
  </div>

  <div id="message"></div>

</div>


<script>

/* =========================================================
   KENA DESIGN STUDENT LOGIN
   ========================================================= */


/*
  IMPORTANT:

  Backend login endpoint kee asitti galchi.

  Fakkeenya:

  https://baoczizarrnzxwguyili.supabase.co/functions/v1/login-student

  Endpoint kun phone + PIN fudhachuu qaba.

  Body:
  {
    "phone": "0923502464",
    "pin": "KD2350"
  }

  Response milkaa'e:
  {
    "success": true,
    "student": {
      ...
    }
  }
*/

const LOGIN_API_URL =
  "https://baoczizarrnzxwguyili.supabase.co/functions/v1/login-student";


/* =========================================================
   ELEMENTS
   ========================================================= */

const phoneInput =
  document.getElementById("phone");

const pinInput =
  document.getElementById("pin");

const loginBtn =
  document.getElementById("loginBtn");

const messageBox =
  document.getElementById("message");


/* =========================================================
   PHONE INPUT
   ========================================================= */

phoneInput.addEventListener(
  "input",
  function () {

    this.value =
      this.value
        .replace(/[^0-9]/g, "")
        .slice(0, 10);

  }
);


/* =========================================================
   PIN INPUT
   ========================================================= */

pinInput.addEventListener(
  "input",
  function () {

    this.value =
      this.value
        .toUpperCase()
        .replace(/\s/g, "")
        .slice(0, 10);

  }
);


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
  text,
  success = false
) {

  messageBox.style.display =
    "block";

  messageBox.textContent =
    text;

  if (success) {

    messageBox.style.background =
      "#d4edda";

    messageBox.style.color =
      "#155724";

  } else {

    messageBox.style.background =
      "#f8d7da";

    messageBox.style.color =
      "#721c24";
  }
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  const phone =
    phoneInput.value.trim();

  const pin =
    pinInput.value
      .trim()
      .toUpperCase();


  /* =======================================================
     PHONE VALIDATION
     ======================================================= */

  if (
    !/^(09|07)[0-9]{8}$/.test(phone)
  ) {

    showMessage(
      "Lakkoofsa bilbilaa sirrii galchi. Fakkeenya: 0923502464"
    );

    return;
  }


  /* =======================================================
     PIN VALIDATION
     ======================================================= */

  if (!pin) {

    showMessage(
      "Course PIN kee galchi."
    );

    return;
  }


  if (pin.length < 4) {

    showMessage(
      "Course PIN sirrii galchi."
    );

    return;
  }


  /* =======================================================
     LOGIN BUTTON
     ======================================================= */

  loginBtn.disabled =
    true;

  loginBtn.textContent =
    "⏳ Login hojjetamaa jira...";


  try {

    /* =====================================================
       SEND PHONE + PIN TO BACKEND
       ===================================================== */

    const response =
      await fetch(
        LOGIN_API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            phone: phone,

            pin: pin

          })
        }
      );


    /* =====================================================
       READ RESPONSE
       ===================================================== */

    const responseText =
      await response.text();

    let data = null;

    try {

      data =
        responseText
          ? JSON.parse(
              responseText
            )
          : null;

    } catch (error) {

      data = null;

    }


    /* =====================================================
       LOGIN FAILED
       ===================================================== */

    if (
      !response.ok ||
      !data ||
      data.success !== true
    ) {

      showMessage(
        data &&
        (
          data.error ||
          data.message
        )
          ? (
              data.error ||
              data.message
            )
          : "Lakkoofsa bilbilaa ykn Course PIN sirrii miti."
      );

      return;
    }


    /* =====================================================
       LOGIN SUCCESS
       ===================================================== */

    showMessage(
      "✅ Login milkaa'eera! Dashboard banamaa jira...",
      true
    );


    /* =====================================================
       SAVE STUDENT DATA
       ===================================================== */

    if (data.student) {

      localStorage.setItem(
        "student",
        JSON.stringify(
          data.student
        )
      );

    }


    localStorage.setItem(
      "loggedIn",
      "true"
    );


    /* =====================================================
       DASHBOARD
       ===================================================== */

    setTimeout(
      function () {

        window.location.href =
          "dashboard.html";

      },
      1000
    );


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    showMessage(
      "Server waliin wal qunnamuun hin danda'amne. Mee connection fi Login API kee ilaali."
    );


  } finally {

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "🔐 Login";

  }

}

</script>

</body>
</html>
