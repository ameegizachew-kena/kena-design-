<!DOCTYPE html>
<html lang="om">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KENA DESIGN - Student Login</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f5f9;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 28px;

      border-radius: 18px;

      box-shadow:
        0 5px 25px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin: 0 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;

      font-weight: bold;

      margin-top: 18px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #ccc;

      border-radius: 9px;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #008f45;

      box-shadow:
        0 0 0 2px
        rgba(0,143,69,0.1);
    }

    #pin {
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 9px;

      background: #008f45;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 25px;
    }

    button:hover {
      background: #007238;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;

      padding: 14px;

      border-radius: 9px;

      text-align: center;

      margin-top: 18px;

      line-height: 1.5;
    }

    .info {
      background: #eef7ff;
      color: #285577;
    }

    .success {
      background: #e8f8ee;
      color: #126331;
    }

    .error {
      background: #ffe8e8;
      color: #8b1e1e;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: #777;

      font-size: 13px;
    }

  </style>

</head>


<body>


<div class="login-box">

  <h2>
    🎓 Student Login
  </h2>

  <div class="subtitle">
    KENA DESIGN Online Learning
  </div>


  <!-- PHONE -->

  <label for="phone">
    📱 Lakkoofsa Bilbilaa
  </label>

  <input
    type="tel"
    id="phone"
    placeholder="0923502464"
    maxlength="10"
    inputmode="numeric"
  >


  <!-- COURSE PIN -->

  <label for="pin">
    🔑 Course PIN
  </label>

  <input
    type="text"
    id="pin"
    placeholder="Fakkeenya: KD2350"
    maxlength="6"
    minlength="6"
    autocomplete="off"
  >


  <button
    id="loginBtn"
    type="button"
    onclick="loginStudent()"
  >
    🔐 Login
  </button>


  <div id="message"></div>


  <div class="footer">
    © KENA DESIGN
  </div>

</div>


<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://baoczizarrnzxwguyili.supabase.co";


/* ==========================================
   LOGIN EDGE FUNCTION
========================================== */

const LOGIN_URL =
  SUPABASE_URL +
  "/functions/v1/student-login";


/* ==========================================
   ELEMENTS
========================================== */

const phoneInput =
  document.getElementById("phone");

const pinInput =
  document.getElementById("pin");

const loginBtn =
  document.getElementById("loginBtn");

const messageBox =
  document.getElementById("message");


/* ==========================================
   PHONE
========================================== */

phoneInput.addEventListener(
  "input",
  function () {

    this.value =
      this.value
        .replace(/[^0-9]/g, "")
        .slice(0, 10);

  }
);


/* ==========================================
   PIN
========================================== */

pinInput.addEventListener(
  "input",
  function () {

    this.value =
      this.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .slice(0, 6);

  }
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  type
) {

  messageBox.style.display =
    "block";

  messageBox.textContent =
    text;

  messageBox.className = "";

  messageBox.id = "message";

  messageBox.classList.add(type);

}


/* ==========================================
   LOGIN
========================================== */

async function loginStudent() {

  const phone =
    phoneInput.value.trim();

  const pin =
    pinInput.value
      .trim()
      .toUpperCase();


  /* PHONE */

  if (
    !/^(09|07)[0-9]{8}$/.test(phone)
  ) {

    showMessage(
      "❌ Lakkoofsa bilbilaa sirrii galchi.",
      "error"
    );

    return;
  }


  /* PIN */

  if (
    !/^KD[0-9]{4}$/.test(pin)
  ) {

    showMessage(
      "❌ Course PIN sirrii miti. Fakkeenya: KD2350",
      "error"
    );

    return;
  }


  /* LOADING */

  loginBtn.disabled = true;

  loginBtn.textContent =
    "⏳ Login...";

  showMessage(
    "Mee xiqqoo eegi...",
    "info"
  );


  try {

    const response =
      await fetch(
        LOGIN_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            phone: phone,
            pin: pin
          })
        }
      );


    const responseText =
      await response.text();

    let data = null;

    try {

      data =
        responseText
          ? JSON.parse(responseText)
          : null;

    } catch (e) {

      data = null;

    }


    /* SERVER ERROR */

    if (!response.ok) {

      showMessage(
        data?.error ||
        data?.message ||
        "❌ Login hin milkoofne.",
        "error"
      );

      return;
    }


    /* LOGIN FAILED */

    if (
      !data ||
      !data.success
    ) {

      showMessage(
        data?.error ||
        "❌ Login hin milkoofne.",
        "error"
      );

      return;
    }


    /* LOGIN SUCCESS */

    localStorage.setItem(
      "loggedIn",
      "true"
    );

    localStorage.setItem(
      "student",
      JSON.stringify(
        data.student
      )
    );


    showMessage(
      "✅ Login milkaa'eera! Dashboard banamaa jira...",
      "success"
    );


    /* DASHBOARD */

    setTimeout(
      function () {

        window.location.href =
          "dashboard.html";

      },
      1000
    );


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    showMessage(
      "❌ Server waliin wal qunnamuun hin danda'amne.",
      "error"
    );


  } finally {

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "🔐 Login";

  }

}

</script>

</body>

</html>
