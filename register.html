<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galmee Barataa - Kena Design</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      padding: 25px;
    }

    .form-box {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #32d583;
      font-weight: bold;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="form-box">
    <h1>Galmee Barataa</h1>

    <form onsubmit="registerStudent(event)">

      <!-- Maqaa Guutuu -->
      <label>Maqaa Guutuu</label>
      <input
        type="text"
        name="fullname"
        placeholder="Maqaa kee guutuu"
        required
      >

      <!-- Maqaa Abbaa -->
      <label>Maqaa Abbaa</label>
      <input
        type="text"
        name="fathername"
        placeholder="Maqaa abbaa"
        required
      >

      <!-- Koorniyaa -->
      <label>Koorniyaa</label>
      <select name="gender" required>
        <option value="">Filadhu</option>
        <option value="Dhiira">Dhiira</option>
        <option value="Dhalaa">Dhalaa</option>
      </select>

      <!-- Umurii -->
      <label>Umurii</label>
      <input
        type="number"
        name="age"
        placeholder="Umurii kee"
        min="1"
        max="100"
        required
      >

      <!-- Lakkoofsa Bilbilaa -->
      <label>Lakkoofsa Bilbilaa</label>
      <input
        type="tel"
        name="phone"
        placeholder="09xxxxxxxx ykn 07xxxxxxxx"
        pattern="(09|07)[0-9]{8}"
        maxlength="10"
        required
      >

      <!-- Email -->
      <label>Email</label>
      <input
        type="email"
        name="email"
        placeholder="Email (dirqama miti)"
      >

      <!-- Koorsii -->
      <label>Koorsii</label>
      <select name="course" required>
        <option value="">Koorsii filadhu</option>
        <option value="Video Editing">Video Editing</option>
        <option value="Graphic Design">Graphic Design</option>
        <option value="Web Design">Web Design</option>
        <option value="Digital Marketing">Digital Marketing</option>
        <option value="Photography">Photography</option>
        <option value="Flayer Package">Flayer Package</option>
        <option value="YouTube Thumbnail">YouTube Thumbnail</option>
        <option value="Poster Design">Poster Design</option>
      </select>

      <!-- Teessoo -->
      <label>Teessoo</label>

      <select
        name="address"
        id="addressSelect"
        required
        onchange="showOtherAddress()"
      >
        <option value="">Teessoo filadhu</option>

        <option value="Finfinnee">Finfinnee</option>
        <option value="Adamaa">Adamaa</option>
        <option value="Bishooftuu">Bishooftuu</option>
        <option value="Jimmaa">Jimmaa</option>
        <option value="Baahir Daar">Baahir Daar</option>
        <option value="Dirree Dhawaa">Dirree Dhawaa</option>
        <option value="Maqalee">Maqalee</option>
        <option value="Naqamtee">Naqamtee</option>
        <option value="Harar">Harar</option>
        <option value="Booranaa">Booranaa</option>
        <option value="Wallaggaa">Wallaggaa</option>
        <option value="Arsii">Arsii</option>
        <option value="Bale">Bale</option>
        <option value="Guji">Guji</option>
        <option value="Shambu">Shambu</option>
        <option value="Amboo">Amboo</option>
        <option value="Baakko">Baakko</option>
        <option value="Saqalaa">Saqalaa</option>
        <option value="Gimbi">Gimbi</option>
        <option value="Najjoo">Najjoo</option>
        <option value="Mandii">Mandii</option>
        <option value="Assosa">Assosa</option>
        <option value="Other">Other</option>
      </select>

      <!-- Other Address -->
      <input
        type="text"
        name="otherAddress"
        id="otherAddress"
        placeholder="Teessoo kee barreessi"
        style="display:none;"
      >

      <!-- Submit -->
      <button type="submit">
        Galmaa'i
      </button>

    </form>
  </div>


  <script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
      "https://baoczizarrnzxwguyili.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // OTHER ADDRESS
    // ==============================

    function showOtherAddress() {

      const select =
        document.getElementById("addressSelect");

      const otherInput =
        document.getElementById("otherAddress");

      if (select.value === "Other") {

        otherInput.style.display = "block";
        otherInput.required = true;

      } else {

        otherInput.style.display = "none";
        otherInput.required = false;
        otherInput.value = "";

      }
    }


    // ==============================
    // REGISTER STUDENT
    // ==============================

    async function registerStudent(event) {

      event.preventDefault();

      const form = event.target;


      // Address filatame ykn Other keessatti barreeffame
      const addressValue =
        form.address.value === "Other"
          ? form.otherAddress.value.trim()
          : form.address.value;


      // Supabase keessatti galchi
      const { error } =
        await supabaseClient
          .from("Students")
          .insert([{

            fullname:
              form.fullname.value.trim(),

            fathername:
              form.fathername.value.trim(),

            gender:
              form.gender.value,

            age:
              Number(form.age.value),

            phone:
              form.phone.value.trim(),

            email:
              form.email.value.trim(),

            course:
              form.course.value,

            address:
              addressValue

          }]);


      // Yoo dogoggorri jiraate
      if (error) {

        alert(
          "Galmeen hin milkoofne: "
          + error.message
        );

        console.error(error);

        return;
      }


      // Yoo milkaa'e
      alert(
        "Galmeen kee milkaa'eera! 🎉"
      );


      // Form qulqulleessi
      form.reset();


      // Other textbox dhoksi
      showOtherAddress();

    }

  </script>

</body>
</html>
