<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design - Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      width: 95%;
      max-width: 850px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .payment-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .payment-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .method {
      margin: 0;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      font-weight: bold;
    }

    .method input {
      width: auto;
      margin-right: 8px;
    }

    .account-info {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      line-height: 1.8;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.6;
      font-weight: bold;
    }

    #status.waiting {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    #status.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    #status.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      margin-top: 5px;
    }

    @media (max-width: 650px) {
      .row,
      .payment-methods {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Kena Design</h1>
    <div class="subtitle">Student Registration Form</div>

    <form id="registrationForm">

      <div class="row">
        <div>
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" required>
        </div>

        <div>
          <label for="fathername">Father Name</label>
          <input type="text" id="fathername" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div>
          <label for="age">Age</label>
          <input type="number" id="age" min="1" max="100" required>
        </div>
      </div>

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        maxlength="10"
        pattern="(09|07)[0-9]{8}"
        placeholder="09XXXXXXXX or 07XXXXXXXX"
        required
      >

      <div class="small">
        Phone number should start with 09 or 07.
      </div>

      <label for="email">Email (Optional)</label>
      <input type="email" id="email">

      <label for="course">Course</label>
      <select id="course" required>
        <option value="">Select Course</option>
        <option value="Video Editing">Video Editing - 530 ETB</option>
        <option value="Web Design">Web Design - 1,000 ETB</option>
        <option value="Graphic Design">Graphic Design - 400 ETB</option>
        <option value="Digital Marketing">Digital Marketing - 400 ETB</option>
        <option value="Photography">Photography - 400 ETB</option>
        <option value="Flayer Package">Flayer Package - 400 ETB</option>
        <option value="YouTube Thumbnail">YouTube Thumbnail - 400 ETB</option>
        <option value="Poster Design">Poster Design - 400 ETB</option>
      </select>

      <label for="address">Address</label>
      <select id="address" required>
        <option value="">Select Address</option>
        <option value="Finfinnee">Finfinnee</option>
        <option value="Adamaa">Adamaa</option>
        <option value="Bishooftuu">Bishooftuu</option>
        <option value="Jimmaa">Jimmaa</option>
        <option value="Baahir Daar">Baahir Daar</option>
        <option value="Dirree Dhawaa">Dirree Dhawaa</option>
        <option value="Maqalee">Maqalee</option>
        <option value="Naqamtee">Naqamtee</option>
        <option value="Harar">Harar</option>
        <option value="Booranaa">Booranaa</option>
        <option value="Wallaggaa">Wallaggaa</option>
        <option value="Arsii">Arsii</option>
        <option value="Bale">Bale</option>
        <option value="Guji">Guji</option>
        <option value="Shambu">Shambu</option>
        <option value="Amboo">Amboo</option>
        <option value="Baakko">Baakko</option>
        <option value="Saqalaa">Saqalaa</option>
        <option value="Gimbi">Gimbi</option>
        <option value="Najjoo">Najjoo</option>
        <option value="Mandii">Mandii</option>
        <option value="Assosa">Assosa</option>
        <option value="Other">Other</option>
      </select>

      <label for="otherAddress">Other Address</label>
      <textarea
        id="otherAddress"
        placeholder="If you selected Other, write your address here..."
      ></textarea>

      <div class="payment-box">

        <h3>Payment Method</h3>

        <div class="payment-methods">

          <label class="method">
            <input
              type="radio"
              name="paymentMethod"
              value="Telebirr"
              required
            >
            📱 Telebirr
          </label>

          <label class="method">
            <input
              type="radio"
              name="paymentMethod"
              value="CBE Birr"
              required
            >
            🏦 CBE Birr
          </label>

        </div>

        <div class="account-info">
          📱 <strong>Telebirr:</strong>
          0923502464 — Amanuel
          <br>

          🏦 <strong>CBE Birr:</strong>
          0923502464 — Amanuel
        </div>

        <label for="paymentScreenshot">
          Payment Screenshot
        </label>

        <input
          type="file"
          id="paymentScreenshot"
          accept="image/*"
          required
        >

        <div class="small">
          Upload a clear screenshot of your payment.
        </div>

      </div>

      <button
        type="submit"
        id="submitButton"
        class="submit-btn"
      >
        Submit Registration
      </button>

      <div id="status"></div>

    </form>

  </div>
</div>

<script>

const SUPABASE_URL =
  "https://baoczizarrnzxwguyili.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("registrationForm");

const submitButton =
  document.getElementById("submitButton");

const statusBox =
  document.getElementById("status");


const coursePrices = {
  "Video Editing": 530,
  "Web Design": 1000,
  "Graphic Design": 400,
  "Digital Marketing": 400,
  "Photography": 400,
  "Flayer Package": 400,
  "YouTube Thumbnail": 400,
  "Poster Design": 400
};


function showStatus(message, type) {

  statusBox.className = type;
  statusBox.innerHTML = message;
  statusBox.style.display = "block";

}


function getPaymentMethod() {

  const selected =
    document.querySelector(
      'input[name="paymentMethod"]:checked'
    );

  return selected ? selected.value : "";

}


form.addEventListener(
  "submit",
  async function (e) {

    e.preventDefault();
    e.stopPropagation();

    submitButton.disabled = true;
    submitButton.textContent = "Ergaa jira...";

    let uploadedFilePath = null;

    try {

      showStatus(
        "Galmee fi screenshot kee ergaa jirra...",
        "waiting"
      );


      const fullname =
        document.getElementById("fullname").value.trim();

      const fathername =
        document.getElementById("fathername").value.trim();

      const gender =
        document.getElementById("gender").value;

      const age =
        Number(document.getElementById("age").value);

      const phone =
        document.getElementById("phone").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const course =
        document.getElementById("course").value;

      const address =
        document.getElementById("address").value;

      const otherAddress =
        document.getElementById("otherAddress").value.trim();

      const paymentMethod =
        getPaymentMethod();

      const screenshot =
        document.getElementById("paymentScreenshot").files[0];


      if (!fullname ||
          !fathername ||
          !gender ||
          !age ||
          !phone ||
          !course ||
          !address ||
          !paymentMethod ||
          !screenshot) {

        throw new Error(
          "Meeqa guutuu barbaachisaa hunda guuti."
        );

      }


      if (!/^(09|07)[0-9]{8}$/.test(phone)) {

        throw new Error(
          "Lakkoofsi bilbilaa sirrii miti. 09 ykn 07 irraa jalqabu qaba."
        );

      }


      const paymentAmount =
        coursePrices[course];


      if (!paymentAmount) {

        throw new Error(
          "Gatiin course filatame hin argamne."
        );

      }


      /*
       * 1. UPLOAD PAYMENT SCREENSHOT
       */

      const extension =
        screenshot.name.includes(".")
          ? screenshot.name
              .split(".")
              .pop()
              .toLowerCase()
          : "jpg";


      const safePhone =
        phone.replace(/[^0-9]/g, "");

      const fileName =
        Date.now() +
        "_" +
        safePhone +
        "." +
        extension;


      uploadedFilePath =
        "proofs/" + fileName;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("payment-proofs")
          .upload(
            uploadedFilePath,
            screenshot,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: screenshot.type
            }
          );


      console.log(
        "UPLOAD RESULT:",
        uploadError
      );


      if (uploadError) {

        throw new Error(
          "Screenshot upload hin milkoofne: " +
          uploadError.message
        );

      }


      /*
       * 2. INSERT STUDENT
       */

      const studentData = {

        fullname: fullname,

        fathername: fathername,

        gender: gender,

        age: age,

        phone: phone,

        email: email || null,

        course: course,

        address: address,

        other_address:
          otherAddress || null,

        payment_method:
          paymentMethod,

        payment_amount:
          paymentAmount,

        payment_status:
          "PENDING",

        payment_reference:
          null,

        payment_screenshot_url:
          uploadedFilePath,

        paid_at:
          null

      };


      console.log(
        "STUDENT DATA:",
        studentData
      );


      const {
        data: insertedData,
        error: insertError
      } =
        await supabaseClient
          .from("Students")
          .insert([
            studentData
          ])
          .select();


      console.log(
        "INSERT RESULT:",
        insertedData,
        insertError
      );


      if (insertError) {

        throw new Error(
          "Galmeen database irratti hin milkoofne: " +
          insertError.message
        );

      }


      /*
       * 3. SUCCESS
       */

      showStatus(
        "✅ Galmeen kee milkaa'e!<br><br>" +
        "💳 Payment Status: <strong>PENDING</strong><br>" +
        "Screenshot kee adminiin ni mirkaneessa.<br><br>" +
        "Galatoomi!",
        "success"
      );


      form.reset();


    } catch (error) {

      console.error(
        "REGISTRATION ERROR:",
        error
      );


      /*
       * If DB insert fails after screenshot upload,
       * delete the uploaded screenshot.
       */

      if (uploadedFilePath) {

        try {

          await supabaseClient
            .storage
            .from("payment-proofs")
            .remove([
              uploadedFilePath
            ]);

        } catch (removeError) {

          console.error(
            "Screenshot cleanup error:",
            removeError
          );

        }

      }


      showStatus(
        "❌ " +
        (error.message ||
          "Galmeen hin milkoofne.") +
        "<br><br>" +
        "Mee irra deebi'ii yaali.",
        "error"
      );


    } finally {

      submitButton.disabled = false;

      submitButton.textContent =
        "Submit Registration";

    }

  }
);

</script>

</body>
          </html>
