<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design - Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    input[type="radio"] {
      width: auto;
      margin-right: 8px;
    }

    input[type="file"] {
      background: white;
      padding: 10px;
    }

    .price-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #eef8f0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .payment-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f7f7f7;
      border: 1px solid #e3e3e3;
    }

    .methods {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .method {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    .method:hover {
      border-color: #087f3f;
    }

    .account-info {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #eaf7ee;
      color: #075c2f;
      font-weight: bold;
      line-height: 1.6;
    }

    .proof-note {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #087f3f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      background: #e8f8ed;
      color: #087f3f;
    }

    .error {
      background: #ffecec;
      color: #b00020;
    }

    .waiting {
      background: #fff8df;
      color: #805f00;
    }

    .other-address {
      display: none;
    }

    @media (max-width: 500px) {
      .methods {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Kena Design</h1>

    <div class="subtitle">
      Galmee Barattootaa
    </div>

    <form id="registrationForm">

      <label>Full Name</label>
      <input
        id="fullname"
        type="text"
        required
        placeholder="Maqaa guutuu"
      >

      <label>Father Name</label>
      <input
        id="fathername"
        type="text"
        required
        placeholder="Maqaa abbaa"
      >

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Filadhu</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label>Age</label>
      <input
        id="age"
        type="number"
        min="10"
        max="100"
        required
        placeholder="Umurii"
      >

      <label>Phone</label>
      <input
        id="phone"
        type="tel"
        maxlength="10"
        pattern="(09|07)[0-9]{8}"
        required
        placeholder="09xxxxxxxx"
      >

      <label>Email (Optional)</label>
      <input
        id="email"
        type="email"
        placeholder="email@example.com"
      >

      <label>Course</label>
      <select id="course" required>
        <option value="">Course filadhu</option>

        <option value="Video Editing">
          Video Editing — 530 ETB
        </option>

        <option value="Web Design">
          Web Design — 1,000 ETB
        </option>

        <option value="Graphic Design">
          Graphic Design — 400 ETB
        </option>

        <option value="Digital Marketing">
          Digital Marketing — 400 ETB
        </option>

        <option value="Photography">
          Photography — 400 ETB
        </option>

        <option value="Flayer Package">
          Flayer Package — 400 ETB
        </option>

        <option value="YouTube Thumbnail">
          YouTube Thumbnail — 400 ETB
        </option>

        <option value="Poster Design">
          Poster Design — 400 ETB
        </option>
      </select>

      <div id="priceBox" class="price-box">
        Gatii: - ETB
      </div>


      <label>Address</label>

      <select id="address" required>
        <option value="">Address filadhu</option>

        <option>Finfinnee</option>
        <option>Adamaa</option>
        <option>Bishooftuu</option>
        <option>Jimmaa</option>
        <option>Baahir Daar</option>
        <option>Dirree Dhawaa</option>
        <option>Maqalee</option>
        <option>Naqamtee</option>
        <option>Harar</option>
        <option>Booranaa</option>
        <option>Wallaggaa</option>
        <option>Arsii</option>
        <option>Bale</option>
        <option>Guji</option>
        <option>Shambu</option>
        <option>Amboo</option>
        <option>Baakko</option>
        <option>Saqalaa</option>
        <option>Gimbi</option>
        <option>Najjoo</option>
        <option>Mandii</option>
        <option>Assosa</option>
        <option>Other</option>
      </select>


      <div id="otherAddressBox" class="other-address">

        <label>Other Address</label>

        <input
          id="otherAddress"
          type="text"
          placeholder="Address kee barreessi"
        >

      </div>


      <!-- PAYMENT -->

      <div class="payment-box">

        <strong>💳 Payment Method</strong>

        <div class="methods">

          <label class="method">
            <input
              type="radio"
              name="paymentMethod"
              value="Telebirr"
              required
            >
            📱 Telebirr
          </label>

          <label class="method">
            <input
              type="radio"
              name="paymentMethod"
              value="CBE Birr"
              required
            >
            🏦 CBE Birr
          </label>

        </div>


        <div id="accountInfo" class="account-info">
          Kaffaltii kee dura
          Telebirr ykn CBE Birr filadhu.
        </div>

      </div>


      <!-- TRANSACTION NUMBER -->

      <label>
        Transaction / Reference Number
      </label>

      <input
        id="paymentReference"
        type="text"
        required
        placeholder="Lakkoofsa transaction galchi"
      >


      <!-- SCREENSHOT -->

      <label>
        Screenshot Kaffaltii
      </label>

      <input
        id="paymentScreenshot"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        required
      >

      <div class="proof-note">
        Screenshot ragaa kaffaltii kee asitti olkaa'i.
        Admin'n erga ilaalee booda kaffaltiin mirkanaa'a.
      </div>


      <button
        id="payButton"
        type="submit"
      >
        Galmaa'i & Kaffaltii Mirkaneessaf Ergi
      </button>

    </form>


    <div
      id="status"
      class="status"
    ></div>

  </div>
</div>


<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL =
    "https://baoczizarrnzxwguyili.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================================
  // COURSE PRICES
  // =====================================================

  const PRICES = {

    "Video Editing": 530,

    "Web Design": 1000,

    "Graphic Design": 400,

    "Digital Marketing": 400,

    "Photography": 400,

    "Flayer Package": 400,

    "YouTube Thumbnail": 400,

    "Poster Design": 400

  };


  // =====================================================
  // ELEMENTS
  // =====================================================

  const course =
    document.getElementById("course");

  const priceBox =
    document.getElementById("priceBox");

  const address =
    document.getElementById("address");

  const otherAddressBox =
    document.getElementById(
      "otherAddressBox"
    );

  const otherAddress =
    document.getElementById(
      "otherAddress"
    );

  const form =
    document.getElementById(
      "registrationForm"
    );

  const payButton =
    document.getElementById(
      "payButton"
    );

  const statusBox =
    document.getElementById(
      "status"
    );

  const accountInfo =
    document.getElementById(
      "accountInfo"
    );


  // =====================================================
  // COURSE PRICE
  // =====================================================

  course.addEventListener(
    "change",
    () => {

      const amount =
        PRICES[course.value];

      priceBox.textContent =
        amount
          ? `Gatii: ${amount.toLocaleString()} ETB`
          : "Gatii: - ETB";

    }
  );


  // =====================================================
  // OTHER ADDRESS
  // =====================================================

  address.addEventListener(
    "change",
    () => {

      if (address.value === "Other") {

        otherAddressBox.style.display =
          "block";

        otherAddress.required =
          true;

      } else {

        otherAddressBox.style.display =
          "none";

        otherAddress.required =
          false;

        otherAddress.value = "";

      }

    }
  );


  // =====================================================
  // PAYMENT METHOD
  // =====================================================

  document
    .querySelectorAll(
      'input[name="paymentMethod"]'
    )
    .forEach(
      radio => {

        radio.addEventListener(
          "change",
          () => {

            if (
              radio.value ===
              "Telebirr"
            ) {

              accountInfo.innerHTML =
                "📱 <strong>Telebirr</strong><br>" +
                "Lakkoofsa: 0923502464<br>" +
                "Maqaa: Amanuel";

            }


            if (
              radio.value ===
              "CBE Birr"
            ) {

              accountInfo.innerHTML =
                "🏦 <strong>CBE Birr</strong><br>" +
                "Lakkoofsa: 0923502464<br>" +
                "Maqaa: Amanuel";

            }

          }
        );

      }
    );


  // =====================================================
  // STATUS
  // =====================================================

  function showStatus(
    message,
    type
  ) {

    statusBox.textContent =
      message;

    statusBox.className =
      "status " + type;

    statusBox.style.display =
      "block";

  }


  // =====================================================
  // SUBMIT
  // =====================================================

  form.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();


      const selectedCourse =
        course.value;


      if (!PRICES[selectedCourse]) {

        showStatus(
          "Course sirriitti filadhu.",
          "error"
        );

        return;
      }


      let selectedAddress =
        address.value;


      if (
        selectedAddress ===
        "Other"
      ) {

        selectedAddress =
          otherAddress.value.trim();


        if (!selectedAddress) {

          showStatus(
            "Address kee galchi.",
            "error"
          );

          return;
        }

      }


      const phone =
        document
          .getElementById("phone")
          .value.trim();


      if (
        !/^(09|07)[0-9]{8}$/.test(
          phone
        )
      ) {

        showStatus(
          "Phone 09xxxxxxxx ykn 07xxxxxxxx ta'uu qaba.",
          "error"
        );

        return;
      }


      const paymentMethod =
        document.querySelector(
          'input[name="paymentMethod"]:checked'
        )?.value;


      if (!paymentMethod) {

        showStatus(
          "Telebirr ykn CBE Birr keessaa tokko filadhu.",
          "error"
        );

        return;
      }


      const paymentReference =
        document
          .getElementById(
            "paymentReference"
          )
          .value.trim();


      if (!paymentReference) {

        showStatus(
          "Transaction / Reference Number galchi.",
          "error"
        );

        return;
      }


      const screenshotInput =
        document.getElementById(
          "paymentScreenshot"
        );


      const screenshot =
        screenshotInput.files[0];


      if (!screenshot) {

        showStatus(
          "Screenshot kaffaltii kee olkaa'i.",
          "error"
        );

        return;
      }


      // Check file size
      if (
        screenshot.size >
        5 * 1024 * 1024
      ) {

        showStatus(
          "Screenshot 5MB gadi ta'uu qaba.",
          "error"
        );

        return;
      }


      // Check image
      if (
        ![
          "image/jpeg",
          "image/png",
          "image/webp"
        ].includes(
          screenshot.type
        )
      ) {

        showStatus(
          "PNG, JPG ykn WEBP qofa fayyadami.",
          "error"
        );

        return;
      }


      payButton.disabled =
        true;

      payButton.textContent =
        "Ergaa jira...";


      showStatus(
        "Galmee fi screenshot kee ergaa jirra...",
        "waiting"
      );


      try {

        // =================================================
        // 1. CREATE UNIQUE FILE NAME
        // =================================================

        const safePhone =
          phone.replace(
            /[^0-9]/g,
            ""
          );


        const fileName =
          Date.now() +
          "_" +
          safePhone +
          "_" +
          Math.random()
            .toString(36)
            .substring(2, 8) +
          "." +
          (
            screenshot.name
              .split(".")
              .pop()
              .toLowerCase()
          );


        const filePath =
          "proofs/" +
          fileName;


        // =================================================
        // 2. UPLOAD SCREENSHOT
        // =================================================

        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("payment-proofs")
            .upload(
              filePath,
              screenshot,
              {
                cacheControl: "3600",
                upsert: false,
                contentType:
                  screenshot.type
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        // =================================================
        // 3. GET PUBLIC URL
        // =================================================

        const {
          data: publicData
        } =
          supabaseClient
            .storage
            .from("payment-proofs")
            .getPublicUrl(
              filePath
            );


        const screenshotUrl =
          publicData.publicUrl;


        // =================================================
        // 4. INSERT STUDENT
        // =================================================

        const studentData = {

          fullname:
            document
              .getElementById(
                "fullname"
              )
              .value.trim(),

          fathername:
            document
              .getElementById(
                "fathername"
              )
              .value.trim(),

          gender:
            document
              .getElementById(
                "gender"
              )
              .value,

          age:
            Number(
              document
                .getElementById(
                  "age"
                )
                .value
            ),

          phone,

          email:
            document
              .getElementById(
                "email"
              )
              .value.trim() ||
            null,

          course:
            selectedCourse,

          address:
            selectedAddress,

          payment_status:
            "PENDING",

          payment_method:
            paymentMethod,

          payment_amount:
            PRICES[
              selectedCourse
            ],

          payment_reference:
            paymentReference,

          payment_screenshot_url:
            screenshotUrl,

          paid_at:
            null

        };


        const {
          error: insertError
        } =
          await supabaseClient
            .from("Students")
            .insert(
              [studentData]
            );


        if (insertError) {

          throw insertError;

        }


        // =================================================
        // SUCCESS
        // =================================================

        form.reset();

        priceBox.textContent =
          "Gatii: - ETB";

        otherAddressBox.style.display =
          "none";

        accountInfo.innerHTML =
          "Kaffaltii kee dura Telebirr ykn CBE Birr filadhu.";


        showStatus(
          "Galmeen kee milkaa'eera! ✅ " +
          "Kaffaltiin kee PENDING dha. " +
          "Admin'n screenshot fi transaction number ilaalee booda mirkaneessa.",
          "success"
        );


      } catch (err) {

        console.error(
          "Registration error:",
          err
        );


        showStatus(
          err.message ||
          "Galmee erguu irratti dogoggorri uumame.",
          "error"
        );


        payButton.disabled =
          false;

        payButton.textContent =
          "Galmaa'i & Kaffaltii Mirkaneessaf Ergi";

      }

    }
  );

</script>

</body>
  </html>
