<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://baoczizarrnzxwguyili.supabase.co";

const SUPABASE_KEY = "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function registerStudent(event) {
    event.preventDefault();

    const form = event.target;

    const { error } = await supabaseClient
        .from("Students")
        .insert([{
            fullname: form.fullname.value.trim(),
            fathername: form.fathername.value.trim(),
            gender: form.gender.value,
            age: Number(form.age.value),
            phone: form.phone.value.trim(),
            email: form.email.value.trim(),
            course: form.course.value,
            address: form.address.value.trim()
        }]);

    if (error) {
        alert("Galmeen hin milkoofne: " + error.message);
        console.error(error);
        return;
    }

    alert("Galmeen kee milkaa'eera! 🎉");
    form.reset();
}
</script>
