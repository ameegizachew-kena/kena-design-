<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design - Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .price-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #eef8f0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .payment-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #f7f7f7;
    }

    .methods {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .method {
      flex: 1;
      padding: 12px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #087f3f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      text-align: center;
    }

    .success {
      background: #e8f8ed;
      color: #087f3f;
    }

    .error {
      background: #ffecec;
      color: #b00020;
    }

    .waiting {
      background: #fff8df;
      color: #805f00;
    }

    .other-address {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Kena Design</h1>
    <div class="subtitle">
      Galmee Barattootaa
    </div>

    <form id="registrationForm">

      <label>Full Name</label>
      <input
        id="fullname"
        type="text"
        required
        placeholder="Maqaa guutuu"
      >

      <label>Father Name</label>
      <input
        id="fathername"
        type="text"
        required
        placeholder="Maqaa abbaa"
      >

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Filadhu</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label>Age</label>
      <input
        id="age"
        type="number"
        min="10"
        max="100"
        required
        placeholder="Umurii"
      >

      <label>Phone</label>
      <input
        id="phone"
        type="tel"
        maxlength="10"
        pattern="(09|07)[0-9]{8}"
        required
        placeholder="09xxxxxxxx"
      >

      <label>Email (Optional)</label>
      <input
        id="email"
        type="email"
        placeholder="email@example.com"
      >

      <label>Course</label>
      <select id="course" required>
        <option value="">Course filadhu</option>
        <option value="Video Editing">
          Video Editing — 530 ETB
        </option>
        <option value="Web Design">
          Web Design — 1,000 ETB
        </option>
        <option value="Graphic Design">
          Graphic Design — 400 ETB
        </option>
        <option value="Digital Marketing">
          Digital Marketing — 400 ETB
        </option>
        <option value="Photography">
          Photography — 400 ETB
        </option>
        <option value="Flayer Package">
          Flayer Package — 400 ETB
        </option>
        <option value="YouTube Thumbnail">
          YouTube Thumbnail — 400 ETB
        </option>
        <option value="Poster Design">
          Poster Design — 400 ETB
        </option>
      </select>

      <div id="priceBox" class="price-box">
        Gatii: - ETB
      </div>

      <label>Address</label>
      <select id="address" required>
        <option value="">Address filadhu</option>
        <option>Finfinnee</option>
        <option>Adamaa</option>
        <option>Bishooftuu</option>
        <option>Jimmaa</option>
        <option>Baahir Daar</option>
        <option>Dirree Dhawaa</option>
        <option>Maqalee</option>
        <option>Naqamtee</option>
        <option>Harar</option>
        <option>Booranaa</option>
        <option>Wallaggaa</option>
        <option>Arsii</option>
        <option>Bale</option>
        <option>Guji</option>
        <option>Shambu</option>
        <option>Amboo</option>
        <option>Baakko</option>
        <option>Saqalaa</option>
        <option>Gimbi</option>
        <option>Najjoo</option>
        <option>Mandii</option>
        <option>Assosa</option>
        <option>Other</option>
      </select>

      <div
        id="otherAddressBox"
        class="other-address"
      >
        <label>Other Address</label>
        <input
          id="otherAddress"
          type="text"
          placeholder="Address kee barreessi"
        >
      </div>

      <div class="payment-box">
        <strong>Payment Method</strong>

        <div class="methods">
          <div class="method">
            📱 Telebirr
          </div>

          <div class="method">
            🏦 CBE Birr
          </div>
        </div>

        <small>
          Payment karaa Telebirr ykn CBE Birr qofa.
        </small>
      </div>

      <button
        id="payButton"
        type="submit"
      >
        Payment Godhi & Galmaa'i
      </button>

    </form>

    <div
      id="status"
      class="status"
    ></div>

  </div>
</div>


<script>
  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL =
    "https://baoczizarrnzxwguyili.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================================
  // COURSE PRICES
  // =====================================================

  const PRICES = {
    "Video Editing": 530,
    "Web Design": 1000,
    "Graphic Design": 400,
    "Digital Marketing": 400,
    "Photography": 400,
    "Flayer Package": 400,
    "YouTube Thumbnail": 400,
    "Poster Design": 400
  };


  const course =
    document.getElementById("course");

  const priceBox =
    document.getElementById("priceBox");

  const address =
    document.getElementById("address");

  const otherAddressBox =
    document.getElementById(
      "otherAddressBox"
    );

  const otherAddress =
    document.getElementById(
      "otherAddress"
    );

  const form =
    document.getElementById(
      "registrationForm"
    );

  const payButton =
    document.getElementById(
      "payButton"
    );

  const statusBox =
    document.getElementById(
      "status"
    );


  // =====================================================
  // COURSE PRICE DISPLAY
  // =====================================================

  course.addEventListener(
    "change",
    () => {
      const amount =
        PRICES[course.value];

      priceBox.textContent =
        amount
          ? `Gatii: ${amount.toLocaleString()} ETB`
          : "Gatii: - ETB";
    }
  );


  // =====================================================
  // OTHER ADDRESS
  // =====================================================

  address.addEventListener(
    "change",
    () => {
      if (address.value === "Other") {
        otherAddressBox.style.display =
          "block";

        otherAddress.required = true;
      } else {
        otherAddressBox.style.display =
          "none";

        otherAddress.required = false;
        otherAddress.value = "";
      }
    }
  );


  // =====================================================
  // STATUS HELPER
  // =====================================================

  function showStatus(
    message,
    type
  ) {
    statusBox.textContent =
      message;

    statusBox.className =
      "status " + type;

    statusBox.style.display =
      "block";
  }


  // =====================================================
  // SUBMIT REGISTRATION
  // =====================================================

  form.addEventListener(
    "submit",
    async (e) => {
      e.preventDefault();

      const selectedCourse =
        course.value;

      if (!PRICES[selectedCourse]) {
        showStatus(
          "Course sirriitti filadhu.",
          "error"
        );
        return;
      }

      let selectedAddress =
        address.value;

      if (
        selectedAddress === "Other"
      ) {
        selectedAddress =
          otherAddress.value.trim();

        if (!selectedAddress) {
          showStatus(
            "Address kee galchi.",
            "error"
          );
          return;
        }
      }

      const phone =
        document
          .getElementById("phone")
          .value.trim();

      if (
        !/^(09|07)[0-9]{8}$/.test(
          phone
        )
      ) {
        showStatus(
          "Phone 09xxxxxxxx ykn 07xxxxxxxx ta'uu qaba.",
          "error"
        );
        return;
      }

      const data = {
        action: "create",

        fullname:
          document
            .getElementById(
              "fullname"
            )
            .value.trim(),

        fathername:
          document
            .getElementById(
              "fathername"
            )
            .value.trim(),

        gender:
          document
            .getElementById(
              "gender"
            )
            .value,

        age:
          document
            .getElementById(
              "age"
            )
            .value,

        phone,

        email:
          document
            .getElementById(
              "email"
            )
            .value.trim(),

        course:
          selectedCourse,

        address:
          selectedAddress
      };


      payButton.disabled = true;

      payButton.textContent =
        "Payment qopheessaa...";

      showStatus(
        "Payment qopheessaa jirra...",
        "waiting"
      );


      try {

        const {
          data: result,
          error
        } =
          await supabaseClient
            .functions
            .invoke(
              "chapa-payment",
              {
                body: data
              }
            );


        if (error) {
          throw error;
        }

        if (
          !result ||
          !result.success ||
          !result.checkout_url
        ) {
          throw new Error(
            result?.error ||
            "Payment jalqabsiisuun dadhabe."
          );
        }


        // Save reference in browser
        sessionStorage.setItem(
          "kena_payment_reference",
          result.merchant_reference
        );


        sessionStorage.setItem(
          "kena_payment_amount",
          result.amount
        );


        showStatus(
          "Amma gara Chapa payment tti ce'aa...",
          "waiting"
        );


        // Go to Chapa
        window.location.href =
          result.checkout_url;

      } catch (err) {

        console.error(err);

        showStatus(
          err.message ||
          "Dogoggorri uumame.",
          "error"
        );

        payButton.disabled =
          false;

        payButton.textContent =
          "Payment Godhi & Galmaa'i";
      }
    }
  );


  // =====================================================
  // CHECK PAYMENT STATUS AFTER RETURNING
  // =====================================================

  async function checkPaymentStatus() {

    const ref =
      sessionStorage.getItem(
        "kena_payment_reference"
      );

    if (!ref) return;


    showStatus(
      "Payment kee mirkaneessaa jirra...",
      "waiting"
    );


    let attempts = 0;

    const timer =
      setInterval(
        async () => {

          attempts++;

          try {

            const {
              data,
              error
            } =
              await supabaseClient
                .functions
                .invoke(
                  "chapa-payment",
                  {
                    body: {
                      action:
                        "status",
                      merchant_reference:
                        ref
                    }
                  }
                );


            if (error) {
              console.error(error);
              return;
            }


            if (
              data?.payment_status ===
              "paid"
            ) {

              clearInterval(timer);

              sessionStorage.removeItem(
                "kena_payment_reference"
              );

              sessionStorage.removeItem(
                "kena_payment_amount"
              );


              form.reset();

              priceBox.textContent =
                "Gatii: - ETB";

              otherAddressBox.style.display =
                "none";


              showStatus(
                "Galmeen kee milkaa'eera! 🎉 Payment kee mirkanaa'eera.",
                "success"
              );

              return;
            }


            if (
              [
                "failed",
                "cancelled",
                "incomplete",
                "blocked"
              ].includes(
                data?.payment_status
              )
            ) {

              clearInterval(timer);

              showStatus(
                "Payment hin milkoofne. Mee irra deebi'ii yaali.",
                "error"
              );

              payButton.disabled =
                false;

              payButton.textContent =
                "Payment Godhi & Galmaa'i";
            }


          } catch (err) {
            console.error(err);
          }


          // Stop after 2 minutes
          if (attempts >= 24) {
            clearInterval(timer);

            showStatus(
              "Payment kee amma iyyuu pending dha. Yoo kaffalte, yeroo muraasa booda irra deebi'ii ilaali.",
              "waiting"
            );
          }

        },
        5000
      );
  }


  checkPaymentStatus();

</script>

</body>
  </html>
