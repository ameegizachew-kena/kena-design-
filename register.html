<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design - Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    input[type="radio"] {
      width: auto;
      margin-right: 8px;
    }

    input[type="file"] {
      background: white;
      padding: 10px;
    }

    .price-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #eef8f0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .payment-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f7f7f7;
      border: 1px solid #e3e3e3;
    }

    .methods {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .method {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    .method:hover {
      border-color: #087f3f;
    }

    .account-info {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #eaf7ee;
      color: #075c2f;
      font-weight: bold;
      line-height: 1.6;
    }

    .proof-note {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #087f3f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      background: #e8f8ed;
      color: #087f3f;
    }

    .error {
      background: #ffecec;
      color: #b00020;
    }

    .waiting {
      background: #fff8df;
      color: #805f00;
    }

    .other-address {
      display: none;
    }

    @media (max-width: 500px) {
      .methods {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Kena Design</h1>

    <div class="subtitle">
      Galmee Barattootaa
    </div>

    <form id="registrationForm">

      <!-- FULL NAME -->
      <label>Full Name</label>

      <input
        id="fullname"
        type="text"
        required
        placeholder="Maqaa guutuu"
      >


      <!-- FATHER NAME -->
      <label>Father Name</label>

      <input
        id="fathername"
        type="text"
        required
        placeholder="Maqaa abbaa"
      >


      <!-- GENDER -->
      <label>Gender</label>

      <select id="gender" required>

        <option value="">
          Filadhu
        </option>

        <option value="Male">
          Male
        </option>

        <option value="Female">
          Female
        </option>

      </select>


      <!-- AGE -->
      <label>Age</label>

      <input
        id="age"
        type="number"
        min="10"
        max="100"
        required
        placeholder="Umurii"
      >


      <!-- PHONE -->
      <label>Phone</label>

      <input
        id="phone"
        type="tel"
        maxlength="10"
        pattern="(09|07)[0-9]{8}"
        required
        placeholder="09xxxxxxxx"
      >


      <!-- EMAIL -->
      <label>Email (Optional)</label>

      <input
        id="email"
        type="email"
        placeholder="email@example.com"
      >


      <!-- COURSE -->
      <label>Course</label>

      <select id="course" required>

        <option value="">
          Course filadhu
        </option>

        <option value="Video Editing">
          Video Editing — 530 ETB
        </option>

        <option value="Web Design">
          Web Design — 1,000 ETB
        </option>

        <option value="Graphic Design">
          Graphic Design — 400 ETB
        </option>

        <option value="Digital Marketing">
          Digital Marketing — 400 ETB
        </option>

        <option value="Photography">
          Photography — 400 ETB
        </option>

        <option value="Flayer Package">
          Flayer Package — 400 ETB
        </option>

        <option value="YouTube Thumbnail">
          YouTube Thumbnail — 400 ETB
        </option>

        <option value="Poster Design">
          Poster Design — 400 ETB
        </option>

      </select>


      <!-- PRICE -->
      <div id="priceBox" class="price-box">
        Gatii: - ETB
      </div>


      <!-- ADDRESS -->
      <label>Address</label>

      <select id="address" required>

        <option value="">
          Address filadhu
        </option>

        <option>Finfinnee</option>
        <option>Adamaa</option>
        <option>Bishooftuu</option>
        <option>Jimmaa</option>
        <option>Baahir Daar</option>
        <option>Dirree Dhawaa</option>
        <option>Maqalee</option>
        <option>Naqamtee</option>
        <option>Harar</option>
        <option>Booranaa</option>
        <option>Wallaggaa</option>
        <option>Arsii</option>
        <option>Bale</option>
        <option>Guji</option>
        <option>Shambu</option>
        <option>Amboo</option>
        <option>Baakko</option>
        <option>Saqalaa</option>
        <option>Gimbi</option>
        <option>Najjoo</option>
        <option>Mandii</option>
        <option>Assosa</option>
        <option>Other</option>

      </select>


      <!-- OTHER ADDRESS -->
      <div
        id="otherAddressBox"
        class="other-address"
      >

        <label>Other Address</label>

        <input
          id="otherAddress"
          type="text"
          placeholder="Address kee barreessi"
        >

      </div>


      <!-- PAYMENT -->
      <div class="payment-box">

        <strong>
          💳 Payment Method
        </strong>

        <div class="methods">

          <label class="method">

            <input
              type="radio"
              name="paymentMethod"
              value="Telebirr"
              required
            >

            📱 Telebirr

          </label>


          <label class="method">

            <input
              type="radio"
              name="paymentMethod"
              value="CBE Birr"
              required
            >

            🏦 CBE Birr

          </label>

        </div>


        <div
          id="accountInfo"
          class="account-info"
        >
          Kaffaltii kee dura
          Telebirr ykn CBE Birr filadhu.
        </div>

      </div>


      <!-- SCREENSHOT -->
      <label>
        Screenshot Kaffaltii
      </label>

      <input
        id="paymentScreenshot"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        required
      >

      <div class="proof-note">

        Screenshot ragaa kaffaltii kee asitti olkaa'i.
        Admin'n erga ilaalee booda kaffaltiin mirkanaa'a.

        <br><br>

        📌 PNG, JPG ykn WEBP qofa.
        <br>

        📌 5MB gadi ta'uu qaba.

      </div>


      <!-- SUBMIT -->
      <button
        id="payButton"
        type="submit"
      >
        Galmaa'i & Kaffaltii Mirkaneessaf Ergi
      </button>

    </form>


    <!-- STATUS -->
    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://baoczizarrnzxwguyili.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IxQVHwajIHpNgK642UzfYw_2S-WHkui";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   COURSE PRICES
===================================================== */

const PRICES = {

  "Video Editing": 530,

  "Web Design": 1000,

  "Graphic Design": 400,

  "Digital Marketing": 400,

  "Photography": 400,

  "Flayer Package": 400,

  "YouTube Thumbnail": 400,

  "Poster Design": 400

};


/* =====================================================
   ELEMENTS
===================================================== */

const course =
  document.getElementById("course");

const priceBox =
  document.getElementById("priceBox");

const address =
  document.getElementById("address");

const otherAddressBox =
  document.getElementById(
    "otherAddressBox"
  );

const otherAddress =
  document.getElementById(
    "otherAddress"
  );

const form =
  document.getElementById(
    "registrationForm"
  );

const payButton =
  document.getElementById(
    "payButton"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const accountInfo =
  document.getElementById(
    "accountInfo"
  );


/* =====================================================
   COURSE PRICE
===================================================== */

course.addEventListener(
  "change",
  function () {

    const amount =
      PRICES[course.value];

    if (amount) {

      priceBox.textContent =
        `Gatii: ${amount.toLocaleString()} ETB`;

    } else {

      priceBox.textContent =
        "Gatii: - ETB";

    }

  }
);


/* =====================================================
   OTHER ADDRESS
===================================================== */

address.addEventListener(
  "change",
  function () {

    if (address.value === "Other") {

      otherAddressBox.style.display =
        "block";

      otherAddress.required =
        true;

    } else {

      otherAddressBox.style.display =
        "none";

      otherAddress.required =
        false;

      otherAddress.value =
        "";

    }

  }
);


/* =====================================================
   PAYMENT METHOD
===================================================== */

document
  .querySelectorAll(
    'input[name="paymentMethod"]'
  )
  .forEach(
    function (radio) {

      radio.addEventListener(
        "change",
        function () {

          if (
            radio.value ===
            "Telebirr"
          ) {

            accountInfo.innerHTML =
              "📱 <strong>Telebirr</strong><br>" +
              "Lakkoofsa: 0923502464<br>" +
              "Maqaa: Amanuel";

          }


          if (
            radio.value ===
            "CBE Birr"
          ) {

            accountInfo.innerHTML =
              "🏦 <strong>CBE Birr</strong><br>" +
              "Lakkoofsa: 0923502464<br>" +
              "Maqaa: Amanuel";

          }

        }
      );

    }
  );


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(
  message,
  type
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status " + type;

  statusBox.style.display =
    "block";

}


/* =====================================================
   SUBMIT FORM
===================================================== */

form.addEventListener(
  "submit",
  async function (e) {

    e.preventDefault();


    /* -----------------------------------------------
       COURSE
    ------------------------------------------------ */

    const selectedCourse =
      course.value;


    if (
      !PRICES[selectedCourse]
    ) {

      showStatus(
        "Course sirriitti filadhu.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       ADDRESS
    ------------------------------------------------ */

    let selectedAddress =
      address.value;


    if (
      selectedAddress ===
      "Other"
    ) {

      selectedAddress =
        otherAddress.value.trim();


      if (!selectedAddress) {

        showStatus(
          "Address kee galchi.",
          "error"
        );

        return;

      }

    }


    /* -----------------------------------------------
       PHONE
    ------------------------------------------------ */

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    if (
      !/^(09|07)[0-9]{8}$/.test(
        phone
      )
    ) {

      showStatus(
        "Phone 09xxxxxxxx ykn 07xxxxxxxx ta'uu qaba.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       PAYMENT METHOD
    ------------------------------------------------ */

    const paymentMethod =
      document.querySelector(
        'input[name="paymentMethod"]:checked'
      )?.value;


    if (!paymentMethod) {

      showStatus(
        "Telebirr ykn CBE Birr keessaa tokko filadhu.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       SCREENSHOT
    ------------------------------------------------ */

    const screenshotInput =
      document.getElementById(
        "paymentScreenshot"
      );

    const screenshot =
      screenshotInput.files[0];


    if (!screenshot) {

      showStatus(
        "Screenshot kaffaltii kee olkaa'i.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       FILE SIZE
    ------------------------------------------------ */

    if (
      screenshot.size >
      5 * 1024 * 1024
    ) {

      showStatus(
        "Screenshot 5MB gadi ta'uu qaba.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       FILE TYPE
    ------------------------------------------------ */

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];


    if (
      !allowedTypes.includes(
        screenshot.type
      )
    ) {

      showStatus(
        "PNG, JPG ykn WEBP qofa fayyadami.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       DISABLE BUTTON
    ------------------------------------------------ */

    payButton.disabled =
      true;

    payButton.textContent =
      "Ergaa jira...";


    showStatus(
      "Galmee fi screenshot kee ergaa jirra...",
      "waiting"
    );


    let uploadedFilePath =
      null;


    try {


      /* =============================================
         1. UNIQUE FILE NAME
      ============================================= */

      const safePhone =
        phone.replace(
          /[^0-9]/g,
          ""
        );


      const extension =
        screenshot.name
          .split(".")
          .pop()
          .toLowerCase();


      const uniquePart =
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 10);


      const fileName =
        uniquePart +
        "_" +
        safePhone +
        "." +
        extension;


      const filePath =
        "proofs/" +
        fileName;


      uploadedFilePath =
        filePath;


      /* =============================================
         2. UPLOAD PRIVATE SCREENSHOT
      ============================================= */

      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("payment-proofs")
          .upload(
            filePath,
            screenshot,
            {
              cacheControl: "3600",
              upsert: false,
              contentType:
                screenshot.type
            }
          );


      if (uploadError) {

        throw new Error(
          "Screenshot upload hin milkoofne: " +
          uploadError.message
        );

      }


      /* =============================================
         3. STUDENT DATA
      ============================================= */

      const studentData = {

        fullname:
          document
            .getElementById(
              "fullname"
            )
            .value
            .trim(),

        fathername:
          document
            .getElementById(
              "fathername"
            )
            .value
            .trim(),

        gender:
          document
            .getElementById(
              "gender"
            )
            .value,

        age:
          Number(
            document
              .getElementById(
                "age"
              )
              .value
          ),

        phone:

          phone,

        email:
          document
            .getElementById(
              "email"
            )
            .value
            .trim() ||
          null,

        course:

          selectedCourse,

        address:

          selectedAddress,

        payment_status:

          "PENDING",

        payment_method:

          paymentMethod,

        payment_amount:

          PRICES[
            selectedCourse
          ],

        /*
          Transaction / Reference Number
          HIN JIRU.
        */

        payment_screenshot_url:

          filePath,

        paid_at:

          null

      };


      /* =============================================
         4. INSERT STUDENT
      ============================================= */

      const {
        error: insertError
      } =
        await supabaseClient
          .from("Students")
          .insert(
            [studentData]
          );


      if (insertError) {

        throw new Error(
          "Galmee database keessa galchuu hin dandeenye: " +
          insertError.message
        );

      }


      /* =============================================
         5. SUCCESS
      ============================================= */

      form.reset();


      priceBox.textContent =
        "Gatii: - ETB";


      otherAddressBox.style.display =
        "none";


      otherAddress.required =
        false;


      accountInfo.innerHTML =
        "Kaffaltii kee dura Telebirr ykn CBE Birr filadhu.";


      showStatus(

        "Galmeen kee milkaa'eera! ✅ " +
        "Kaffaltiin kee PENDING dha. " +
        "Admin'n screenshot ilaalee booda mirkaneessa.",

        "success"

      );


      payButton.disabled =
        false;

      payButton.textContent =
        "Galmaa'i & Kaffaltii Mirkaneessaf Ergi";


    } catch (err) {


      console.error(
        "Registration error:",
        err
      );


      /* ---------------------------------------------
         CLEANUP UPLOADED FILE IF DATABASE FAILED
      ---------------------------------------------- */

      if (
        uploadedFilePath
      ) {

        try {

          await supabaseClient
            .storage
            .from("payment-proofs")
            .remove([
              uploadedFilePath
            ]);

        } catch (
          cleanupError
        ) {

          console.error(
            "Screenshot cleanup error:",
            cleanupError
          );

        }

      }


      showStatus(

        err.message ||
        "Galmee erguu irratti dogoggorri uumame.",

        "error"

      );


      payButton.disabled =
        false;


      payButton.textContent =
        "Galmaa'i & Kaffaltii Mirkaneessaf Ergi";

    }

  }
)
