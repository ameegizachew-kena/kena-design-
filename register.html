<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galmee Barataa | KENA DESIGN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="nav">
            <div class="brand">
                <span>K</span> KENA DESIGN
            </div>

            <a href="index.html">← Gara Home</a>
        </div>
    </header>

    <main>

        <section class="register-section">

            <div class="register-card">

                <h1>Galmee Barataa</h1>

                <p class="subtitle">
                    Mee odeeffannoo kee sirriitti guuti.
                </p>

                <form onsubmit="registerStudent(event)">

                    <label for="fullname">
                        Maqaa Guutuu
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Maqaa guutuu galchi"
                        required
                    >


                    <label for="fathername">
                        Maqaa Abbaa
                    </label>

                    <input
                        type="text"
                        id="fathername"
                        name="fathername"
                        placeholder="Maqaa abbaa galchi"
                        required
                    >


                    <label for="gender">
                        Saala
                    </label>

                    <select id="gender" name="gender" required>
                        <option value="">Saala filadhu</option>
                        <option value="dhiira">Dhiira</option>
                        <option value="dubara">Dubara</option>
                    </select>


                    <label for="age">
                        Umurii
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Umurii kee galchi"
                        min="5"
                        max="100"
                        required
                    >


                    <label for="phone">
                        Lakkoofsa Bilbilaa
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09XXXXXXXX"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                    >


                    <label for="course">
                        Koorsii / Barnoota
                    </label>

                    <select id="course" name="course" required>
                        <option value="">Koorsii filadhu</option>
                        <option value="graphic-design">
                            Graphic Design
                        </option>

                        <option value="video-editing">
                            Video Editing
                        </option>

                        <option value="web-design">
                            Web Design
                        </option>

                        <option value="photography">
                            Photography
                        </option>
                    </select>


                    <label for="address">
                        Teessoo
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Teessoo kee galchi"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password kee galchi"
                        required
                    >


                    <button type="submit">
    Galmaa'i
</button>

</form>

            </div>

</section>

</main>

<script>
function registerStudent(event) {
    event.preventDefault();
    alert("Galmeen kee milkaa'eera! 🎉");
    event.target.reset();
}
</script>

</body>
</html>
