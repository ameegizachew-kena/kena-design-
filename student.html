/* =====================================================
   SEND OTP
   ===================================================== */

async function sendOTP(isResend = false){

  const phone =
    document.getElementById("phone").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  clearMessages();


  if(!phone || !pin){

    showLoginError(
      "⚠️ Phone number fi Course PIN guuti."
    );

    return;
  }


  if(!/^(09|07)[0-9]{8}$/.test(phone)){

    showLoginError(
      "⚠️ Phone number sirrii galchi. Fakkeenya: 0912345678"
    );

    return;
  }


  const sendButton =
    document.getElementById("sendOtpBtn");

  const resendButton =
    document.getElementById("resendOtpBtn");


  sendButton.disabled = true;

  if(isResend){
    resendButton.disabled = true;
    resendButton.textContent = "⏳ Ergaa jira...";
  }else{
    sendButton.textContent = "⏳ OTP Ergaa jira...";
  }


  try{

    const response =
      await fetch(SEND_OTP_URL, {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          phone:phone,
          pin:pin
        })

      });


    const data =
      await readJSON(response);


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        "OTP erguun hin milkoofne."
      );

    }


    /*
      OTP section agarsiisi
    */

    document
      .getElementById("otpSection")
      .classList.remove("hidden");


    showOTPMessage(
      "✅ " +
      (
        data.message ||
        "OTP gara bilbila keessaniitti ergameera."
      )
    );


    startOtpTimer(
      Number(data.expires_in || 300)
    );


  }catch(error){

    console.error(error);

    showLoginError(
      "❌ " +
      (
        error.message ||
        "OTP erguu irratti rakkoon uumame."
      )
    );

  }finally{

    if(isResend){

      resendButton.textContent =
        "🔄 OTP Irra Deebi'i";

    }else{

      sendButton.textContent =
        "📩 OTP Ergi";

    }

    /*
      Resend timer keessatti
      button deebisee enable godhama.
    */

    if(!isResend){

      sendButton.disabled = false;

    }

  }

}


/* =====================================================
   VERIFY OTP
   ===================================================== */

async function verifyOTP(){

  const phone =
    document.getElementById("phone").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  const otp =
    document.getElementById("otp").value.trim();


  clearOtpMessages();


  if(!otp){

    showOTPError(
      "⚠️ OTP galchi."
    );

    return;
  }


  if(!/^\d{6}$/.test(otp)){

    showOTPError(
      "⚠️ OTP digitii 6 qabaachuu qaba."
    );

    return;
  }


  const button =
    document.getElementById("verifyOtpBtn");

  button.disabled = true;
  button.textContent = "⏳ Mirkaneessaa...";


  try{

    const response =
      await fetch(VERIFY_OTP_URL, {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          phone:phone,
          pin:pin,
          otp:otp
        })

      });


    const data =
      await readJSON(response);


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        "OTP mirkaneessuun hin milkoofne."
      );

    }


    const student =
      data.student ||
      data.data ||
      data;


    if(!student || !student.course){

      throw new Error(
        "Odeeffannoon student sirrii hin argamne."
      );

    }


    /*
      Login success
    */

    sessionStorage.setItem(
      "kena_student",
      JSON.stringify(student)
    );


    sessionStorage.setItem(
      "kena_student_login_time",
      String(Date.now())
    );


    showDashboard(student);


  }catch(error){

    console.error(error);

    showOTPError(
      "❌ " +
      (
        error.message ||
        "OTP mirkaneessuu irratti rakkoon uumame."
      )
    );

  }finally{

    button.disabled = false;
    button.textContent =
      "✅ OTP Mirkaneessi";

  }

}


/* =====================================================
   READ JSON SAFELY
   ===================================================== */

async function readJSON(response){

  const text =
    await response.text();

  try{

    return text
      ? JSON.parse(text)
      : {};

  }catch(error){

    return {
      error:
        "Server irraa deebiin sirrii hin dhufne."
    };

  }

}


/* =====================================================
   OTP TIMER
   ===================================================== */

function startOtpTimer(seconds){

  clearInterval(otpTimerInterval);

  otpSeconds = seconds;

  const timer =
    document.getElementById("otpTimer");

  const resend =
    document.getElementById("resendOtpBtn");


  resend.disabled = true;


  updateOtpTimer();


  otpTimerInterval =
    setInterval(() => {

      otpSeconds--;

      updateOtpTimer();


      if(otpSeconds <= 0){

        clearInterval(
          otpTimerInterval
        );

        timer.textContent =
          "⏰ OTP yeroo isaa xumureera. OTP haaraa gaafadhu.";

        resend.disabled = false;

      }

    },1000);

}


function updateOtpTimer(){

  const timer =
    document.getElementById("otpTimer");


  const minutes =
    Math.floor(otpSeconds / 60);

  const seconds =
    otpSeconds % 60;


  timer.textContent =
    `⏱️ OTP'n ${minutes}:${String(seconds).padStart(2,"0")} keessatti dhuma.`;

}

function renderStudentInfo(student){

  const fullname =
    student.fullname ||

    "Student";


  const fathername =
    student.fathername ||
    "-";


  const course =
    student.course ||
    "-";


  const phone =
    student.phone ||
    "-";


  const payment =
    student.payment_status ||
    "PENDING";


  box.innerHTML = `

    <div class="info">
      <span>Maqaa Guutuu</span>
      <strong>${escapeHTML(fullname)}</strong>
    </div>

    <div class="info">
      <span>Maqaa Abbaa</span>
      <strong>${escapeHTML(fathername)}</strong>
    </div>

      <span>Course</span>
      <strong>${escapeHTML(course)}</strong>
    </div>

    <div class="info">
      <span>Phone</span>
      <strong>${escapeHTML(phone)}</strong>
    </div>

    <div class="info">
      <span>Payment</span>
      <strong>
        <span class="status">
          ${escapeHTML(String(payment).toUpperCase())}
        </span>
      </strong>
    </div>

  `;

}


/* =====================================================
   LESSONS
   ===================================================== */

function renderLessons(course){

  const container =
    document.getElementById("lessonsContainer");


  container.innerHTML = "";


  const lessons =
    COURSES[course];


  if(!lessons){

    container.innerHTML = `

      <div
        class="message error"
        style="display:block;"
      >
        Course kanaaf lesson hin qophoofne.
      </div>

    `;

    return;
  }


  lessons.forEach(item => {

    const div =
      document.createElement("div");

    div.className =
      "lesson";


    const title =
      document.createElement("h3");

    title.textContent =
      item.title;


    const description =
      document.createElement("p");

    description.textContent =
      item.description;


    const link =
      document.createElement("a");


    /*
      Lesson routing

      Lesson 1 → lesson.html
      Lesson 2 → lesson2.html
    */


    if(Number(item.lesson) === 1){

      link.href =
        "/kena-design-/lesson.html";

    }

    else if(Number(item.lesson) === 2){

      link.href =
        "/kena-design-/lesson2.html";

    }

    else{

      link.href =
        "/kena-design-/lesson.html?course=" +
        encodeURIComponent(course) +
        "&lesson=" +
        encodeURIComponent(item.lesson);

    }


    link.textContent =
      "📖 Open Lesson";


    div.appendChild(title);

    div.appendChild(description);

    div.appendChild(link);


    container.appendChild(div);

  });

}

    .getElementById("otpTimer")

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =====================================================
   AUTO LOGIN FROM SESSION
   ===================================================== */

window.addEventListener(
  "load",
  function(){

    try{

      const saved =
        sessionStorage.getItem(
          "kena_student"
        );


      const loginTime =
        Number(
          sessionStorage.getItem(
            "kena_student_login_time"
          ) || 0
        );


      /*
        Session 2 hours booda
        ofumaan haqama.
      */

      const TWO_HOURS =
        2 * 60 * 60 * 1000;


      if(
        saved &&
        loginTime &&
        Date.now() - loginTime < TWO_HOURS
      ){

        const student =
          JSON.parse(saved);


        if(
          student &&
          student.course
        ){

          showDashboard(
            student
          );

        }

      }else{

        sessionStorage.removeItem(
          "kena_student"
        );

        sessionStorage.removeItem(
          "kena_student_login_time"
        );

      }

    }catch(error){

      console.error(
        "Session error:",
        error
      );

      sessionStorage.removeItem(
        "kena_student"
      );

      sessionStorage.removeItem(
        "kena_student_login_time"
      );

    }

  }
);
