  font-size:15px;

  border:0;

}

.lessonBtn:active{

}

/* =========================
   LOGIN
========================= */

async function studentLogin(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if(!phone){

    showLoginMessage(
      "Phone galchi."
    );

    return;

  }


  if(!pin){

    showLoginMessage(
      "Course PIN galchi."
    );

    return;

  }


  const button =
    document.getElementById(
      "loginBtn"
    );


  button.disabled = true;

  button.textContent =
    "Logging in...";


  try{

    const response =
      await fetch(
        FUNCTION_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              phone:phone,
              pin:pin
            })
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "Login hin milkoofne."
      );

    }


    const student =
      result.student;


    /*
      Student session
    */

    sessionStorage.setItem(
      "kena_student",
      JSON.stringify(student)
    );


    showDashboard(
      student
    );


  }catch(error){

    console.error(error);

    showLoginMessage(
      error.message ||
      "Dogoggorri uumame."
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Login";

  }

}



/* =========================
   DASHBOARD
========================= */

function showDashboard(
  student
){

  document.getElementById(
    "loginBox"
  ).style.display =
    "none";


  document.getElementById(
    "dashboard"
  ).style.display =
    "block";


  document.getElementById(
    "welcome"
  ).textContent =
    "Welcome " +
    (
      student.fullname ||
      "Student"
    );


  document.getElementById(
    "courseName"
  ).textContent =
    student.course ||
    "Course hin argamne";


  renderLessons(
    student.course
  );

}



/* =========================
   LESSONS
========================= */

function renderLessons(
  course
){

  const box =
    document.getElementById(
      "lessons"
    );


  const lessons =
    COURSES[course] || [];


  box.innerHTML = "";


  if(
    lessons.length === 0
  ){

    box.innerHTML = `
      <div class="noLessons">
        Lessons course kanaaf
        ammallee hin qophoofne.
      </div>
    `;

    return;

  }


  lessons.forEach(
    (lesson)=>{

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "lesson";


      const title =
        document.createElement(
          "h3"
        );


      title.textContent =
        lesson.title;


      const description =
        document.createElement(
          "p"
        );


      description.textContent =
        lesson.description;


      /*
        REAL LINK
        Button akka linkitti
        hojjeta.
      */

      const link =
        document.createElement(
          "a"
        );


      link.className =
        "lessonBtn";


      link.href =
        lesson.link;


      link.target =
        "_self";


      link.rel =
        "noopener";


      link.textContent =
        "📖 Open Lesson";


      div.appendChild(
        title
      );

      div.appendChild(
        description
      );

      div.appendChild(
        link
      );


      box.appendChild(
        div
      );

    }
  );

}



/* =========================

function showLoginMessage(
  text
){

  const box =
    document.getElementById(

  box.textContent =
    text;


  box.className =
    "message error";


  box.style.display =
    "block";

}



/* =========================
   LOGOUT
========================= */

function studentLogout(){

  sessionStorage.removeItem(
    "kena_student"
  );


  document.getElementById(
    "dashboard"
  ).style.display =
    "none";


  document.getElementById(
    "loginBox"
  ).style.display =
    "block";


  document.getElementById(
    "pin"
  ).value = "";

}



/* =========================
   EXISTING SESSION
========================= */

window.addEventListener(
  "load",
  function(){

    try{

      const saved =
        sessionStorage.getItem(
          "kena_student"
        );


      if(!saved){

        return;

      }


      const student =
        JSON.parse(saved);


      if(
        student &&
        student.payment_status ===
          "PAID" &&
        student.learning_access ===
          true
      ){

        showDashboard(
          student
        );

      }


    }catch(error){

      console.error(error);

      sessionStorage.removeItem(
        "kena_student"
      );

    }

  }
);
