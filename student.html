<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KENA DESIGN - Student Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
}
.container{max-width:600px;margin:auto;padding:20px}
header{
  text-align:center;padding:30px 10px;
  border-bottom:1px solid #24364d;margin-bottom:25px
}
header h1{color:#32d583;font-size:30px;margin-bottom:8px}
header p{color:#b9c5d3}
.box{
  background:#101c2c;border:1px solid #21334a;
  border-radius:18px;padding:25px;margin-bottom:20px
}
.box h2{color:#32d583;margin-bottom:18px}
label{
  display:block;margin:14px 0 7px;
  color:#dce5ef;font-weight:bold
}
input{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid #344a63;background:#07111f;
  color:white;font-size:16px;outline:none
}
input:focus{border-color:#32d583}
button{
  width:100%;margin-top:20px;padding:14px;
  border:0;border-radius:10px;background:#32d583;
  color:#061018;font-size:17px;font-weight:bold
}
button:disabled{opacity:.55}
.message{
  display:none;padding:14px;border-radius:10px;
  margin-top:15px;line-height:1.5;overflow-wrap:anywhere
}
.error{background:#421b22;color:#ffb4bd}
.success{background:#10382a;color:#9ff0c7}
.register-link{text-align:center;margin-top:20px;color:#9fb0c2}
.register-link a{color:#32d583;font-weight:bold;text-decoration:none}
@media(max-width:650px){.container{padding:14px}.box{padding:18px}}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>🎨 KENA DESIGN</h1>
  <p>Student Login</p>
</header>

<section class="box">
  <h2>🎓 Student Login</h2>

  <label for="phone">📱 Lakkoofsa Bilbilaa</label>
  <input
    type="tel"
    id="phone"
    placeholder="09xxxxxxxx ykn 07xxxxxxxx"
    maxlength="10"
    autocomplete="tel"
  >

  <label for="pin">🔐 Course PIN</label>
  <input
    type="password"
    id="pin"
    placeholder="Course PIN galchi"
    autocomplete="off"
  >

  <button id="loginButton" onclick="loginStudent()">
    🔐 Login
  </button>

  <div id="message" class="message"></div>

  <div class="register-link">
    Barataa haaraa?
    <a href="register.html">Galmaa'i</a>
  </div>
</section>
</div>

<script>
const LOGIN_URL =
  "https://baoczizarrnzxwguyili.supabase.co/functions/v1/student-login";

function showMessage(text, type) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message " + type;
  box.style.display = "block";
}

async function loginStudent() {
  const phone = document.getElementById("phone").value.trim();
  const pin = document.getElementById("pin").value.trim().toUpperCase();
  const button = document.getElementById("loginButton");

  document.getElementById("message").style.display = "none";

  if (!/^(09|07)[0-9]{8}$/.test(phone)) {
    showMessage("Lakkoofsa bilbilaa sirrii galchi.", "error");
    return;
  }

  if (!pin) {
    showMessage("Course PIN galchi.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Seenaa jira...";

  try {
    const response = await fetch(LOGIN_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({phone, pin})
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || data.success === false) {
      throw new Error(
        data.error || data.message || "Login hin milkoofne."
      );
    }

    const student = data.student || data.data;

    if (!student) {
      throw new Error("Odeeffannoon barataa hin argamne.");
    }

    sessionStorage.setItem("kena_student", JSON.stringify(student));
    localStorage.setItem(
      "studentName",
      student.fullname || student.name || student["Full name"] || ""
    );
    localStorage.setItem("fatherName", student.fathername || "");
    localStorage.setItem("studentCourse", student.course || "");
    localStorage.setItem("studentPhone", student.phone || phone);
    localStorage.setItem("studentPayment", student.payment_status || "");

    showMessage("Login milkaa'eera. Gara dashboard deemaa jirta...", "success");

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 700);

  } catch (error) {
    console.error("STUDENT LOGIN ERROR:", error);
    showMessage(
      error.message || "Rakkoo login irratti uumame.",
      "error"
    );
  } finally {
    button.disabled = false;
    button.textContent = "🔐 Login";
  }
}

document.getElementById("pin").addEventListener("keydown", event => {
  if (event.key === "Enter") loginStudent();
});
</script>
</body>
</html>
