<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    .header {
      background: #101c2c;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #24344a;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 30px auto;
    }

    .box {
      background: #101c2c;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #30445e;
      border-radius: 10px;
      background: #07111f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #32d583;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #32d583;
      color: #061018;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .logout {
      background: #e5484d;
      color: white;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
    }

    .error {
      background: #3b1720;
      color: #ffb4b8;
    }

    .success {
      background: #123522;
      color: #9ff0bd;
    }

    #dashboard {
      display: none;
    }

    .student-card {
      background: #17263a;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .student-card p {
      margin: 8px 0;
    }

    .paid {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #123d27;
      color: #8ff0b0;
      font-size: 13px;
      font-weight: bold;
    }

    .lesson {
      background: #17263a;
      padding: 17px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .lesson h3 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .lesson p {
      color: #b8c4d2;
      margin: 5px 0;
    }

    .lesson a {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #32d583;
      color: #061018;
      padding: 12px;
      border-radius: 9px;
      margin-top: 12px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: #aab7c7;
      margin-top: 15px;
      display: none;
    }

    .course-title {
      font-size: 20px;
      font-weight: bold;
      color: #32d583;
      margin-bottom: 15px;
    }

    @media (max-width: 500px) {
      .container {
        width: 94%;
        margin-top: 20px;
      }

      .box {
        padding: 20px;
      }

      .header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🎓 Kena Design Learning</h1>
  </div>

  <div class="container">

    <!-- LOGIN -->
    <div class="box" id="loginBox">

      <h2>Student Login</h2>

      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="09xxxxxxxx"
        maxlength="10"
        autocomplete="tel"
      >

      <label for="pin">
        Course PIN
      </label>

      <input
        type="password"
        id="pin"
        placeholder="Fakkeenya: KD2350"
        autocomplete="current-password"
      >

      <button
        type="button"
        id="loginBtn"
      >
        🔐 Login
      </button>

      <div
        id="loading"
        class="loading"
      >
        Login irratti hojjechaa jira...
      </div>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>


    <!-- DASHBOARD -->
    <div
      class="box"
      id="dashboard"
    >

      <h2>Welcome 👋</h2>

      <div class="student-card">

        <p>
          <strong>Maqaa:</strong>
          <span id="studentName">-</span>
        </p>

        <p>
          <strong>Phone:</strong>
          <span id="studentPhone">-</span>
        </p>

        <p>
          <strong>Course:</strong>
          <span id="studentCourse">-</span>
        </p>

        <p>
          <strong>Payment:</strong>
          <span class="paid">
            ✓ PAYMENT PAID
          </span>
        </p>

      </div>


      <div class="course-title">
        📚 Lessons
      </div>

      <div id="lessonsContainer"></div>

      <button
        type="button"
        id="logoutBtn"
        class="logout"
      >
        🚪 Logout
      </button>

    </div>

  </div>


<script>

const LOGIN_URL =
  "https://baoczizarrnzxwguyili.supabase.co/functions/v1/student-login";


/* =========================
   COURSE LESSONS
========================= */

const COURSES = {

  "Graphic Design": [
    {
      title: "Lesson 1 — Graphic Design Basics",
      description: "Introduction to graphic design and design principles.",
      lesson: 1
    },
    {
      title: "Lesson 2 — Canva & Design Tools",
      description: "Learn the basic tools used for graphic design.",
      lesson: 2
    },
    {
      title: "Lesson 3 — Color & Typography",
      description: "Learn colors, fonts and typography.",
      lesson: 3
    },
    {
      title: "Lesson 4 — Final Graphic Project",
      description: "Create a complete graphic design project.",
      lesson: 4
    }
  ],


  "Video Editing": [
    {
      title: "Lesson 1 — Video Editing Basics",
      description: "Introduction to video editing.",
      lesson: 1
    },
    {
      title: "Lesson 2 — Cutting & Transitions",
      description: "Learn cutting, trimming and transitions.",
      lesson: 2
    },
    {
      title: "Lesson 3 — Audio & Effects",
      description: "Learn audio, music and video effects.",
      lesson: 3
    },
    {
      title: "Lesson 4 — Final Video Project",
      description: "Create your final video project.",
      lesson: 4
    }
  ],


  "Web Design": [
    {
      title: "Lesson 1 — HTML Basics",
      description: "Learn the fundamentals of HTML.",
      lesson: 1
    },
    {
      title: "Lesson 2 — CSS Basics",
      description: "Learn CSS and website styling.",
      lesson: 2
    },
    {
      title: "Lesson 3 — Responsive Design",
      description: "Make websites work on mobile and desktop.",
      lesson: 3
    },
    {
      title: "Lesson 4 — Final Website Project",
      description: "Build a complete website.",
      lesson: 4
    }
  ],


  "Digital Marketing": [
    {
      title: "Lesson 1 — Digital Marketing Basics",
      description: "Introduction to digital marketing.",
      lesson: 1
    },
    {
      title: "Lesson 2 — Social Media Marketing",
      description: "Learn social media marketing strategies.",
      lesson: 2
    },
    {
      title: "Lesson 3 — Marketing Project",
      description: "Create your digital marketing project.",
      lesson: 3
    }
  ],


  "Photography": [
    {
      title: "Lesson 1 — Photography Basics",
      description: "Learn camera and photography basics.",
      lesson: 1
    },
    {
      title: "Lesson 2 — Lighting & Composition",
      description: "Learn lighting and composition.",
      lesson: 2
    },
    {
      title: "Lesson 3 — Final Photography Project",
      description: "Create your photography project.",
      lesson: 3
    }
  ],


  "Flayer Package": [
    {
      title: "Lesson 1 — Flayer Design Basics",
      description: "Learn the basics of flayer design.",
      lesson: 1
    },
    {
      title: "Lesson 2 — Final Flayer Project",
      description: "Create a professional flayer.",
      lesson: 2
    }
  ],


  "YouTube Thumbnail": [
    {
      title: "Lesson 1 — Thumbnail Basics",
      description: "Learn YouTube thumbnail fundamentals.",
      lesson: 1
    },
    {
      title: "Lesson 2 — Thumbnail Design Tools",
      description: "Learn tools for creating thumbnails.",
      lesson: 2
    },
    {
      title: "Lesson 3 — Final Thumbnail Project",
      description: "Create a professional YouTube thumbnail.",
      lesson: 3
    }
  ],


  "Poster Design": [
    {
      title: "Lesson 1 — Poster Design Basics",
      description: "Learn poster design fundamentals.",
      lesson: 1
    },
    {
      title: "Lesson 2 — Poster Layout & Color",
      description: "Learn poster layout and colors.",
      lesson: 2
    },
    {
      title: "Lesson 3 — Final Poster Project",
      description: "Create a complete poster design.",
      lesson: 3
    }
  ]

};


/* =========================
   ELEMENTS
========================= */

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const phoneInput =
  document.getElementById("phone");

const pinInput =
  document.getElementById("pin");

const loginMessage =
  document.getElementById("loginMessage");

const loading =
  document.getElementById("loading");

const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const lessonsContainer =
  document.getElementById("lessonsContainer");


/* =========================
   MESSAGE
========================= */

function showMessage(message, type = "error") {

  loginMessage.textContent = message;

  loginMessage.className =
    "message " + type;

  loginMessage.style.display =
    "block";
}


/* =========================
   LOGIN
========================= */

async function studentLogin() {

  const phone =
    phoneInput.value.trim();

  const pin =
    pinInput.value.trim().toUpperCase();


  loginMessage.style.display =
    "none";


  if (!phone || !pin) {

    showMessage(
      "Phone fi Course PIN guuti."
    );

    return;
  }


  if (!/^(09|07)[0-9]{8}$/.test(phone)) {

    showMessage(
      "Phone format sirrii miti. 09xxxxxxxx ykn 07xxxxxxxx fayyadami."
    );

    return;
  }


  loginBtn.disabled = true;

  loading.style.display =
    "block";


  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 15000);


  try {

    const response =
      await fetch(
        LOGIN_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            phone: phone,
            pin: pin
          }),

          signal:
            controller.signal
        }
      );


    const raw =
      await response.text();


    let result;

    try {

      result =
        JSON.parse(raw);

    } catch {

      throw new Error(
        "Server irraa deebiin sirrii hin taane dhufe."
      );
    }


    if (!response.ok || !result.success) {

      throw new Error(
        result.message ||
        "Login hin milkoofne."
      );
    }


    const student =
      result.student;


    if (
      student.payment_status !==
      "PAID"
    ) {

      throw new Error(
        "Kaffaltiin kee hin mirkanoofne."
      );
    }


    if (
      student.learning_access !==
      true
    ) {

      throw new Error(
        "Learning access kee hin banamne."
      );
    }


    sessionStorage.setItem(
      "kena_student",
      JSON.stringify(student)
    );


    openDashboard(student);


  } catch (error) {

    console.error(error);


    if (
      error.name ===
      "AbortError"
    ) {

      showMessage(
        "Serveriin yeroo dheeraa fudhate. Mee irra deebi'ii yaali."
      );

    } else {

      showMessage(
        error.message ||
        "Login irratti rakkoon uumame."
      );
    }


  } finally {

    clearTimeout(timeout);

    loginBtn.disabled =
      false;

    loading.style.display =
      "none";
  }
}


/* =========================
   OPEN DASHBOARD
========================= */

function openDashboard(student) {

  document.getElementById(
    "studentName"
  ).textContent =
    student.fullname || "-";


  document.getElementById(
    "studentPhone"
  ).textContent =
    student.phone || "-";


  document.getElementById(
    "studentCourse"
  ).textContent =
    student.course || "-";


  renderLessons(
    student.course
  );


  loginBox.style.display =
    "none";

  dashboard.style.display =
    "block";
}


/* =========================
   RENDER LESSONS
========================= */

function renderLessons(course) {

  lessonsContainer.innerHTML =
    "";


  const lessons =
    COURSES[course];


  if (!lessons) {

    lessonsContainer.innerHTML =
      `
      <div class="message error"
           style="display:block;">
        Course kanaaf lesson hin qophoofne.
      </div>
      `;

    return;
  }


  lessons.forEach(
    (item) => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "lesson";


      const title =
        document.createElement(
          "h3"
        );

      title.textContent =
        item.title;


      const description =
        document.createElement(
          "p"
        );

      description.textContent =
        item.description;


      const link =
        document.createElement(
          "a"
        );

      link.href =
        "./lesson.html?course=" +
        encodeURIComponent(course) +
        "&lesson=" +
        item.lesson;

      link.textContent =
        "📖 Open Lesson";


      div.appendChild(title);

      div.appendChild(
        description
      );

      div.appendChild(link);


      lessonsContainer.appendChild(
        div
      );
    }
  );
}


/* =========================
   LOGOUT
========================= */

function logout() {

  sessionStorage.removeItem(
    "kena_student"
  );

  dashboard.style.display =
    "none";

  loginBox.style.display =
    "block";

  phoneInput.value =
    "";

  pinInput.value =
    "";

  loginMessage.style.display =
    "none";
}


/* =========================
   BUTTON EVENTS
========================= */

loginBtn.addEventListener(
  "click",
  studentLogin
);


logoutBtn.addEventListener(
  "click",
  logout
);


/* ENTER KEY */

pinInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      studentLogin();
    }
  }
);


/* =========================
   AUTO LOGIN
========================= */

function checkSavedStudent() {

  try {

    const saved =
      sessionStorage.getItem(
        "kena_student"
      );


    if (!saved) {
      return;
    }


    const student =
      JSON.parse(saved);


    if (
      student &&
      student.payment_status ===
      "PAID" &&
      student.learning_access ===
      true
    ) {

      openDashboard(
        student
      );
    }

  } catch (error) {

    console.error(
      "Saved login error:",
      error
    );

    sessionStorage.removeItem(
      "kena_student"
    );
  }
}


checkSavedStudent();

</script>

</body>
          </html>
