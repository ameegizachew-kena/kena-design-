  /* =====================
LOGIN
===================== */


async function studentLogin(){


const phone =
document.getElementById("phone").value.trim();


const course =
document.getElementById("course").value;


const pin =
document.getElementById("pin").value.trim();



if(!phone || !course || !pin){

showLoginMessage(
"Phone, Course fi PIN guuti."
);

return;

}



const button =
document.getElementById("loginBtn");


button.disabled=true;

button.textContent="Logging in...";



try{


const response =
await fetch(
FUNCTION_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

phone:phone,

course:course,

pin:pin

})


}

);



const result =
await response.json();



if(
!response.ok ||
!result.success
){

throw new Error(
result.message ||
"Login hin milkoofne."
);

}



const student =
result.student;



sessionStorage.setItem(

"kena_student",

JSON.stringify(student)

);



showDashboard(student);



}catch(error){


showLoginMessage(
error.message
);


}

finally{


button.disabled=false;

button.textContent="Login";


}


}



/* =====================
SHOW DASHBOARD
===================== */


function showDashboard(student){



document.getElementById(
"loginBox"
).style.display="none";



document.getElementById(
"dashboard"
).style.display="block";



document.getElementById(
"welcome"
).textContent=

"Welcome " +

(student.fullname || "Student");



document.getElementById(
"courseName"
).textContent=

student.course;



renderLessons(
student.course
);



}



/* =====================
LESSONS
===================== */


function renderLessons(course){



const box =
document.getElementById("lessons");



const lessons =
COURSES[course] || [];



box.innerHTML="";



if(lessons.length===0){


box.innerHTML=`

<div class="noLessons">

Lessons hin qophoofne.

</div>

`;


return;


}



lessons.forEach(
lesson=>{


const div =
document.createElement("div");

div.className="lesson";



div.innerHTML=`

<h3>${lesson.title}</h3>

<p>${lesson.description}</p>

<button class="lessonBtn">

📖 Open Lesson

</button>

`;



div.querySelector("button")
.onclick=()=>{

window.location.href =
lesson.link;

};



box.appendChild(div);



}

);



}



/* =====================
MESSAGE
===================== */


function showLoginMessage(text){


const box =
document.getElementById(
"loginMessage"
);



box.textContent=text;


box.className=
"message error";


box.style.display="block";


}



/* =====================
LOGOUT
===================== */


function studentLogout(){


sessionStorage.removeItem(
"kena_student"
);



document.getElementById(
"dashboard"
).style.display="none";



document.getElementById(
"loginBox"
).style.display="block";



document.getElementById(
"pin"
).value="";


}



/* =====================
AUTO LOGIN
===================== */


window.addEventListener(
"load",
()=>{


const saved =
sessionStorage.getItem(
"kena_student"
);



if(saved){


const student =
JSON.parse(saved);



if(
student.payment_status==="PAID" &&
student.learning_access===true
){

showDashboard(student);

}


}


}

);
