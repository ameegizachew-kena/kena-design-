<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kena Design - Student</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 30px 0;
    }

    .box {
      background: #101c2c;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #32d583;
      margin-bottom: 5px;
    }

    .logo p {
      color: #b8c4d4;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #34445a;
      background: #0b1727;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      border-color: #32d583;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #32d583;
      color: #06101d;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #ef4444;
      color: white;
      margin-top: 15px;
    }

    .message {
      display: none;
      padding: 13px;
      margin-top: 15px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .error {
      background: #451a1a;
      color: #ffb4b4;
    }

    .success {
      background: #123b2a;
      color: #9ff0c5;
    }

    #dashboard {
      display: none;
    }

    .student-info {
      background: #0b1727;
      padding: 18px;
      border-radius: 14px;
      margin: 20px 0;
    }

    .student-info p {
      margin: 8px 0;
      color: #d7e0ec;
    }

    .student-info strong {
      color: #32d583;
    }

    .course-title {
      color: #32d583;
      margin-top: 25px;
    }

    .lesson {
      background: #0b1727;
      border: 1px solid #26384f;
      padding: 20px;
      border-radius: 14px;
      margin: 15px 0;
    }

    .lesson h3 {
      color: #32d583;
      margin-bottom: 8px;
    }

    .lesson p {
      color: #c5d0dd;
      line-height: 1.6;
    }

    .lesson a {
      display: inline-block;
      text-decoration: none;
      background: #32d583;
      color: #06101d;
      padding: 11px 17px;
      border-radius: 9px;
      font-weight: bold;
      margin-top: 8px;
    }

    .lesson a:hover {
      opacity: .9;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #aebdcd;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .topbar h2 {
      margin: 0;
    }

    .small-btn {
      width: auto;
      margin: 0;
      padding: 10px 16px;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding: 20px 0;
      }

      .box {
        padding: 18px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .small-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="box">

    <div class="logo">
      <h1>Kena Design</h1>
      <p>Student Learning Portal</p>
    </div>

    <h2>🎓 Student Login</h2>

    <label for="phone">
      Phone Number
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="09xxxxxxxx ykn 07xxxxxxxx"
      maxlength="10"
      autocomplete="tel"
    >

    <label for="course">
      Course
    </label>

    <select id="course">

      <option value="">
        -- Course filadhu --
      </option>

      <option value="Graphic Design">
        Graphic Design
      </option>

      <option value="Video Editing">
        Video Editing
      </option>

      <option value="Web Design">
        Web Design
      </option>

      <option value="Digital Marketing">
        Digital Marketing
      </option>

      <option value="Photography">
        Photography
      </option>

      <option value="Flayer Package">
        Flayer Package
      </option>

      <option value="YouTube Thumbnail">
        YouTube Thumbnail
      </option>

      <option value="Poster Design">
        Poster Design
      </option>

    </select>

    <label for="pin">
      Course PIN
    </label>

    <input
      id="pin"
      type="password"
      placeholder="Course PIN galchi"
      autocomplete="current-password"
    >

    <button onclick="studentLogin()">
      🔐 Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="box">

    <div class="topbar">

      <div>
        <h2>🎓 Kena Design</h2>
        <p id="welcome">
          Baga nagaan dhuftan!
        </p>
      </div>

      <button
        class="small-btn logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- STUDENT INFO -->
    <div class="student-info">

      <p>
        <strong>Maqaa:</strong>
        <span id="studentName">-</span>
      </p>

      <p>
        <strong>Abbaa:</strong>
        <span id="fatherName">-</span>
      </p>

      <p>
        <strong>Course:</strong>
        <span id="courseName">-</span>
      </p>

      <p>
        <strong>Bilbila:</strong>
        <span id="studentPhone">-</span>
      </p>

      <p>
        <strong>Payment:</strong>
        <span id="paymentStatus">-</span>
      </p>

    </div>


    <h2 class="course-title">
      📚 Lessons
    </h2>

    <div id="lessons"></div>

  </div>

</div>


<script>

  /*
    SUPABASE STUDENT LOGIN EDGE FUNCTION
  */

  const FUNCTION_URL =
    "https://baoczizarrnzxwguyili.supabase.co/functions/v1/student-login";


  /*
    COURSE LESSONS
  */

  const COURSES = {

    "Graphic Design": [

      {
        lesson: 1,
        title: "Lesson 1 - Introduction to Graphic Design",
        description:
          "Graphic Design maal akka ta'e, bu'uura isaa fi hojii isaa baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - Fonts fi PixelLab",
        description:
          "Font haaraa buufachuu, install gochuu fi PixelLab keessatti fayyadamu baradhu."
      },

      {
        lesson: 3,
        title: "Lesson 3 - Graphic Design Practice",
        description:
          "Barnoota kee irratti hojii practical hojjedhu."
      },

      {
        lesson: 4,
        title: "Lesson 4 - Final Graphic Design Practice",
        description:
          "Project xumuraa hojjechuun dandeettii kee mirkaneessi."
      }

    ],


    "Video Editing": [

      {
        lesson: 1,
        title: "Lesson 1 - Introduction to Video Editing",
        description:
          "Bu'uura video editing baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - Video Editing Practice",
        description:
          "Hojii practical video editing hojjedhu."
      },

      {
        lesson: 3,
        title: "Lesson 3 - Advanced Video Editing",
        description:
          "Teknika video editing dabalataa baradhu."
      },

      {
        lesson: 4,
        title: "Lesson 4 - Final Video Project",
        description:
          "Project video xumuraa hojjedhu."
      }

    ],


    "Web Design": [

      {
        lesson: 1,
        title: "Lesson 1 - Introduction to Web Design",
        description:
          "Bu'uura website fi web design baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - HTML Basics",
        description:
          "HTML bu'uuraa baradhu."
      },

      {
        lesson: 3,
        title: "Lesson 3 - CSS Basics",
        description:
          "CSS fi styling website baradhu."
      },

      {
        lesson: 4,
        title: "Lesson 4 - Website Project",
        description:
          "Website project hojjedhu."
      }

    ],


    "Digital Marketing": [

      {
        lesson: 1,
        title: "Lesson 1 - Introduction to Digital Marketing",
        description:
          "Digital marketing maal akka ta'e baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - Social Media Marketing",
        description:
          "Social media marketing baradhu."
      },

      {
        lesson: 3,
        title: "Lesson 3 - Digital Marketing Practice",
        description:
          "Practical hojii digital marketing hojjedhu."
      }

    ],


    "Photography": [

      {
        lesson: 1,
        title: "Lesson 1 - Introduction to Photography",
        description:
          "Bu'uura photography baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - Photography Practice",
        description:
          "Hojii practical photography hojjedhu."
      },

      {
        lesson: 3,
        title: "Lesson 3 - Advanced Photography",
        description:
          "Teknika photography dabalataa baradhu."
      }

    ],


    "Flayer Package": [

      {
        lesson: 1,
        title: "Lesson 1 - Flayer Design",
        description:
          "Bu'uura flayer design baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - Flayer Practice",
        description:
          "Flayer practical hojjedhu."
      }

    ],


    "YouTube Thumbnail": [

      {
        lesson: 1,
        title: "Lesson 1 - YouTube Thumbnail",
        description:
          "Bu'uura YouTube Thumbnail design baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - Thumbnail Practice",
        description:
          "YouTube Thumbnail practical hojjedhu."
      },

      {
        lesson: 3,
        title: "Lesson 3 - Advanced Thumbnail",
        description:
          "Thumbnail design dabalataa baradhu."
      }

    ],


    "Poster Design": [

      {
        lesson: 1,
        title: "Lesson 1 - Poster Design",
        description:
          "Bu'uura poster design baradhu."
      },

      {
        lesson: 2,
        title: "Lesson 2 - Poster Practice",
        description:
          "Poster practical hojjedhu."
      },

      {
        lesson: 3,
        title: "Lesson 3 - Advanced Poster Design",
        description:
          "Poster design dabalataa baradhu."
      }

    ]

  };


  /*
    SHOW MESSAGE
  */

  function showMessage(
    text,
    type = "error"
  ) {

    const box =
      document.getElementById(
        "loginMessage"
      );

    box.textContent = text;

    box.className =
      "message " + type;

    box.style.display =
      "block";
  }


  /*
    STUDENT LOGIN
  */

  async function studentLogin() {

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const course =
      document
        .getElementById("course")
        .value
        .trim();

    const pin =
      document
        .getElementById("pin")
        .value
        .trim();


    if (!phone) {

      showMessage(
        "Lakkoofsa bilbilaa galchi."
      );

      return;
    }


    if (!course) {

      showMessage(
        "Course kee filadhu."
      );

      return;
    }


    if (!pin) {

      showMessage(
        "Course PIN galchi."
      );

      return;
    }


    if (!/^(09|07)[0-9]{8}$/.test(phone)) {

      showMessage(
        "Lakkoofsi bilbilaa 09xxxxxxxx ykn 07xxxxxxxx ta'uu qaba."
      );

      return;
    }


    try {

      showMessage(
        "Login hojjechaa jira...",
        "success"
      );


      const response =
        await fetch(
          FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              phone: phone,
              pin: pin
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Login hin milkoofne."
        );
      }


      if (!data.student) {

        throw new Error(
          "Student data hin argamne."
        );
      }


      /*
        SAVE STUDENT SESSION
      */

      sessionStorage.setItem(
        "kena_student",
        JSON.stringify(
          data.student
        )
      );


      openDashboard(
        data.student
      );

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Login irratti rakkoon uumame."
      );
    }

  }


  /*
    OPEN DASHBOARD
  */

  function openDashboard(student) {

    document
      .getElementById("loginBox")
      .style.display = "none";


    document
      .getElementById("dashboard")
      .style.display = "block";


    const fullname =
      student.fullname ||
      student["Full name"] ||
      "Student";


    const fathername =
      student.fathername ||
      "-";


    const course =
      student.course ||
      "-";


    const phone =
      student.phone ||
      "-";


    const paymentStatus =
      student.payment_status ||
      "-";


    document
      .getElementById("studentName")
      .textContent =
      fullname;


    document
      .getElementById("fatherName")
      .textContent =
      fathername;


    document
      .getElementById("courseName")
      .textContent =
      course;


    document
      .getElementById("studentPhone")
      .textContent =
      phone;


    document
      .getElementById("paymentStatus")
      .textContent =
      paymentStatus;


    document
      .getElementById("welcome")
      .textContent =
      "Baga nagaan dhuftan, " +
      fullname +
      "!";


    renderLessons(
      course
    );
  }


  /*
    RENDER LESSONS

    IMPORTANT:
    Lesson 1 → lesson.html
    Lesson 2 → lesson2.html

    Kana jechuun course kamiyyuu keessatti
    Lesson 1 fi Lesson 2 button sirriitti
    file isaanii bana.
  */

  function renderLessons(course) {

    const lessonsContainer =
      document.getElementById(
        "lessons"
      );


    lessonsContainer.innerHTML =
      "";


    const lessons =
      COURSES[course];


    if (!lessons) {

      lessonsContainer.innerHTML = `
        <div class="lesson">
          <div class="empty">
            Course kanaaf lesson hin qophoofne.
          </div>
        </div>
      `;

      return;
    }


    lessons.forEach(
      (item) => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "lesson";


        const title =
          document.createElement(
            "h3"
          );

        title.textContent =
          item.title;


        const description =
          document.createElement(
            "p"
          );

        description.textContent =
          item.description;


        const link =
          document.createElement(
            "a"
          );


        /*
          LESSON ROUTING
        */

        if (
          item.lesson === 1
        ) {

          link.href =
            "./lesson.html?course=" +
            encodeURIComponent(course) +
            "&lesson=1";

        } else if (
          item.lesson === 2
        ) {

          link.href =
            "./lesson2.html?course=" +
            encodeURIComponent(course) +
            "&lesson=2";

        } else {

          link.href =
            "./lesson.html?course=" +
            encodeURIComponent(course) +
            "&lesson=" +
            item.lesson;
        }


        link.textContent =
          "📖 Open Lesson";


        div.appendChild(
          title
        );

        div.appendChild(
          description
        );

        div.appendChild(
          link
        );


        lessonsContainer.appendChild(
          div
        );

      }
    );

  }


  /*
    LOGOUT
  */

  function logout() {

    sessionStorage.removeItem(
      "kena_student"
    );


    document
      .getElementById("dashboard")
      .style.display = "none";


    document
      .getElementById("loginBox")
      .style.display = "block";


    document
      .getElementById("phone")
      .value = "";


    document
      .getElementById("pin")
      .value = "";


    document
      .getElementById("course")
      .value = "";


    document
      .getElementById("loginMessage")
      .style.display = "none";

  }


  /*
    AUTO LOGIN

    Yoo student duraan login godhe
    dashboard isaa deebisee bana.
  */

  window.addEventListener(
    "DOMContentLoaded",
    () => {

      const saved =
        sessionStorage.getItem(
          "kena_student"
        );


      if (!saved) {
        return;
      }


      try {

        const student =
          JSON.parse(saved);


        if (student) {

          openDashboard(
            student
          );

        }

      } catch (error) {

        console.error(error);

        sessionStorage.removeItem(
          "kena_student"
        );
      }

    }
  );


  /*
    ENTER KEY LOGIN
  */

  document
    .getElementById("pin")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          studentLogin();

        }

      }
    );

</script>

</body>
</html>
