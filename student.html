<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      background:#07111f;
      color:white;
      min-height:100vh;
    }

    .container{
      width:100%;
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    header{
      text-align:center;
      padding:25px 10px;
      border-bottom:1px solid #24364d;
      margin-bottom:25px;
    }

    header h1{
      color:#32d583;
      font-size:32px;
      margin-bottom:8px;
    }

    header p{
      color:#b9c5d3;
      font-size:15px;
    }

    .box{
      background:#101c2c;
      border:1px solid #21334a;
      border-radius:18px;
      padding:25px;
      margin-bottom:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }

    .box h2{
      color:#32d583;
      margin-bottom:18px;
    }

    label{
      display:block;
      margin:14px 0 7px;
      color:#dce5ef;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:1px solid #344a63;
      background:#07111f;
      color:white;
      font-size:16px;
      outline:none;
    }

    input:focus{
      border-color:#32d583;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#32d583;
      color:#061018;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }

    .logout{
      background:#ef4444;
      color:white;
      max-width:160px;
      margin-left:auto;
      display:block;
    }

    .message{
      display:none;
      padding:14px;
      border-radius:10px;
      margin-top:15px;
      line-height:1.5;
    }

    .error{
      background:#421b22;
      color:#ffb4bd;
      border:1px solid #74303a;
    }

    .success{
      background:#10382a;
      color:#9ff0c7;
      border:1px solid #216c4c;
    }

    .student-info{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-top:15px;
    }

    .info{
      background:#0b1727;
      padding:15px;
      border-radius:12px;
      border:1px solid #20334a;
    }

    .info span{
      display:block;
      color:#8fa3b8;
      font-size:13px;
      margin-bottom:5px;
    }

    .info strong{
      color:white;
      word-break:break-word;
    }

    .status{
      display:inline-block;
      padding:7px 12px;
      border-radius:20px;
      font-size:13px;
      font-weight:bold;
      background:#10382a;
      color:#67e8a7;
    }

    .lessons{
      display:grid;
      gap:15px;
      margin-top:15px;
    }

    .lesson{
      background:#0b1727;
      border:1px solid #23374e;
      border-radius:15px;
      padding:20px;
    }

    .lesson h3{
      color:#32d583;
      margin-bottom:8px;
      font-size:19px;
    }

    .lesson p{
      color:#bdc9d7;
      line-height:1.6;
      margin-bottom:15px;
    }

    .lesson a{
      display:inline-block;
      text-decoration:none;
      background:#32d583;
      color:#061018;
      font-weight:bold;
      padding:11px 17px;
      border-radius:9px;
    }

    .lesson a:hover{
      opacity:.9;
    }

    .hidden{
      display:none !important;
    }

    .loading{
      text-align:center;
      color:#9fb0c2;
      padding:15px;
    }

    @media(max-width:650px){
      .container{
        padding:14px;
      }

      header h1{
        font-size:27px;
      }

      .box{
        padding:18px;
      }

      .student-info{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

    <h1>🎨 KENA DESIGN</h1>

  </header>


  <!-- ================= LOGIN ================= -->

  <section id="loginSection" class="box">

    <h2>🎓 Student Login</h2>

    <label for="phone">
      📱 Phone Number
    </label>

    <input
      type="tel"
      id="phone"
      placeholder="09xxxxxxxx ykn 07xxxxxxxx"
      maxlength="10"
      autocomplete="tel"
    >

    <label for="pin">
      🔐 Course PIN
    </label>

    <input
      type="password"
      id="pin"
      placeholder="Course PIN galchi"
      autocomplete="off"
    >

    <button onclick="loginStudent()">
      🔓 Login
    </button>

    <div id="loginError" class="message error"></div>

  </section>


  <!-- ================= DASHBOARD ================= -->

  <section id="dashboardSection" class="hidden">

    <div class="box">

      <h2>👋 Baga Nagaan Dhuftan</h2>

      <div id="studentInfo" class="student-info"></div>

      <button
        class="logout"

        🚪 Logout

    </div>

    <div class="box">

      <div id="lessonsContainer" class="lessons"></div>

</div>

  /* =====================================================
     LOGIN
     ===================================================== */

  async function loginStudent(){

    const phone =
      document.getElementById("phone").value.trim();

    const pin =
      document.getElementById("pin").value.trim();

    const error =
      document.getElementById("loginError");


    error.style.display = "none";
    error.textContent = "";


    if(!phone || !pin){

      showLoginError(
        "⚠️ Phone number fi Course PIN guuti."
      );

      return;
    }


    if(!/^(09|07)[0-9]{8}$/.test(phone)){

      showLoginError(
        "⚠️ Phone number sirrii galchi. Fakkeenya: 0912345678"
      );

      return;
    }


    const button =
      document.querySelector("#loginSection button");

    button.disabled = true;
    button.textContent = "⏳ Login...";


    try{

      const response =
        await fetch(LOGIN_URL, {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            phone:phone,
            pin:pin
          })

        });


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          data.message ||
          "Login hin milkoofne."
        );

      }


      /*
        Edge Function irraa student
        karaa adda addaatiin yoo dhufe
        sirriitti qabachuuf:
      */

      const student =
        data.student || data.data || data;


      if(!student || !student.course){

        throw new Error(
          "Odeeffannoon student sirrii hin argamne."
        );

      }


      /*
        Session keessatti kuusi
      */

      sessionStorage.setItem(
        "kena_student",
        JSON.stringify(student)
      );


      showDashboard(student);


    }catch(err){

      console.error(err);

      showLoginError(
        "❌ " + (
          err.message ||
          "Login irratti rakkoon uumame."
        )
      );

    }finally{

      button.disabled = false;
      button.textContent = "🔓 Login";

    }

  }


  /* =====================================================
     SHOW LOGIN ERROR
     ===================================================== */

  function showLoginError(message){

    const error =
      document.getElementById("loginError");

    error.textContent = message;
    error.style.display = "block";

  }


  /* =====================================================
     SHOW DASHBOARD
     ===================================================== */

  function showDashboard(student){

    document
      .getElementById("loginSection")
      .classList.add("hidden");


    document
      .getElementById("dashboardSection")
      .classList.remove("hidden");


    renderStudentInfo(student);

    renderLessons(student.course);

  }


  /* =====================================================
     STUDENT INFORMATION
     ===================================================== */

  function renderStudentInfo(student){

    const box =
      document.getElementById("studentInfo");


    const fullname =
      student.fullname ||
      student["Full name"] ||
      "Student";


    const fathername =
      student.fathername ||
      "-";


    const course =
      student.course ||
      "-";


    const phone =
      student.phone ||
      "-";


    const payment =
      student.payment_status ||
      "PENDING";


    box.innerHTML = `

      <div class="info">
        <span>Maqaa Guutuu</span>
        <strong>${escapeHTML(fullname)}</strong>
      </div>

      <div class="info">
        <span>Maqaa Abbaa</span>
        <strong>${escapeHTML(fathername)}</strong>
      </div>

      <div class="info">
        <span>Course</span>
        <strong>${escapeHTML(course)}</strong>
      </div>

      <div class="info">
        <span>Phone</span>
        <strong>${escapeHTML(phone)}</strong>
      </div>

      <div class="info">
        <span>Payment</span>
        <strong>
          <span class="status">
            ${escapeHTML(String(payment).toUpperCase())}
          </span>
        </strong>
      </div>

    `;

  }


  /* =====================================================
     LESSONS
     ===================================================== */

  function renderLessons(course){

    const container =
      document.getElementById("lessonsContainer");


    container.innerHTML = "";


    const lessons =
      COURSES[course];


    if(!lessons){

      container.innerHTML = `

        <div class="message error" style="display:block;">
          Course kanaaf lesson hin qophoofne.
        </div>

      `;

      return;
    }


    lessons.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "lesson";


      const title =
        document.createElement("h3");

      title.textContent =
        item.title;


      const description =
        document.createElement("p");

      description.textContent =
        item.description;


      const link =
        document.createElement("a");


      /*
        ==============================================
        IMPORTANT LESSON ROUTING
        ==============================================

        Lesson 1 → lesson.html

        Lesson 2 → lesson2.html

        GitHub Pages project path:
        /kena-design-/lesson2.html

        Kun waan kanaan Lesson 2
        gara Lesson 1 hin deebi'u.
        ==============================================
      */


      if(Number(item.lesson) === 1){

        link.href =
          "/kena-design-/lesson.html";

      }

      else if(Number(item.lesson) === 2){

        link.href =
          "/kena-design-/lesson2.html";

      }

      else{

        link.href =
          "/kena-design-/lesson.html?course=" +
          encodeURIComponent(course) +
          "&lesson=" +
          encodeURIComponent(item.lesson);

      }


      link.textContent =
        "📖 Open Lesson";


      div.appendChild(title);

      div.appendChild(description);

      div.appendChild(link);


      container.appendChild(div);

    });

  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  function logoutStudent(){

    sessionStorage.removeItem(
      "kena_student"
    );


    document
      .getElementById("dashboardSection")
      .classList.add("hidden");


    document
      .getElementById("loginSection")
      .classList.remove("hidden");


    document.getElementById("phone").value = "";

    document.getElementById("pin").value = "";

  }


  /* =====================================================
     ESCAPE HTML
     ===================================================== */

  function escapeHTML(value){

    return String(value)

      .replace(/&/g,"&amp;")

      .replace(/</g,"&lt;")

      .replace(/>/g,"&gt;")

      .replace(/"/g,"&quot;")

      .replace(/'/g,"&#039;");

  }


  /* =====================================================
     AUTO LOGIN FROM SESSION
     ===================================================== */

  window.addEventListener(
    "load",
    function(){

      try{

        const saved =
          sessionStorage.getItem(
            "kena_student"
          );


        if(saved){

          const student =
            JSON.parse(saved);


          if(student && student.course){

            showDashboard(student);

          }

        }

      }catch(error){

        console.error(
          "Session error:",
          error
        );

        sessionStorage.removeItem(
          "kena_student"
        );

      }

    }
  );


  /* =====================================================
     ENTER KEY LOGIN
     ===================================================== */

  document
    .getElementById("pin")
    .addEventListener(
      "keydown",
      function(event){

        if(event.key === "Enter"){

          loginStudent();

        }
