    }

    }

    }

      margin-top:15px;
    }

      padding:15px;

    }

      }

      }

/* =====================================================
   VARIABLES
   ===================================================== */

let cooldownTimer = null;

let cooldownSeconds = 0;



/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(
  elementId,
  message,
  type
){

  const box =
    document.getElementById(elementId);

  box.textContent = message;

  box.className =
    "message " + type;

  box.style.display = "block";

}



/* =====================================================
   HIDE MESSAGE
   ===================================================== */

function hideMessage(elementId){

  const box =
    document.getElementById(elementId);

  box.style.display = "none";

  box.textContent = "";

}



/* =====================================================
   PHONE VALIDATION
   ===================================================== */

function validPhone(phone){

  return /^(09|07)[0-9]{8}$/.test(phone);

}



/* =====================================================
   SEND OTP
   ===================================================== */

async function sendOTP(){

  hideMessage("loginError");

  hideMessage("otpMessage");


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim()
      .toUpperCase();


  const button =
    document.getElementById(
      "sendOtpButton"
    );


  /* PHONE */

  if(!phone){

    showMessage(
      "loginError",
      "⚠️ Phone number galchi.",
      "error"
    );

    return;
  }


  if(!validPhone(phone)){

    showMessage(
      "loginError",
      "⚠️ Phone number sirrii galchi. Fakkeenya: 0912345678",
      "error"
    );

    return;
  }


  /* PIN */

  if(!pin){

    showMessage(
      "loginError",
      "⚠️ Course PIN galchi.",
      "error"
    );

    return;
  }


  /* COOLDOWN */

  if(cooldownSeconds > 0){

    showMessage(
      "loginError",
      `⏳ Mee ${cooldownSeconds} seconds eegi.`,
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ OTP ergamaa jira...";


  try{

    const response =
      await fetch(
        SEND_OTP_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            phone:phone,

            pin:pin

          })

        }
      );


    const data =
      await response.json()
        .catch(() => ({}));


    if(!response.ok){

      /*
        Cooldown server irraa yoo dhufe
      */

      if(
        response.status === 429 &&
        data.cooldown
      ){

        startCooldown(
          Number(data.cooldown)
        );

      }


      throw new Error(
        data.error ||
        data.message ||
        "OTP erguun hin milkoofne."
      );

    }


    /* OTP BOX BANU */

    document
      .getElementById("otpBox")
      .classList.remove("hidden");


    showMessage(
      "otpMessage",
      "✅ OTP gara bilbila keetti ergameera. OTP daqiiqaa 5 keessatti galchi.",
      "success"
    );


    /*
      60 seconds cooldown
    */

    startCooldown(60);


    /*
      OTP input irratti focus
    */

    document
      .getElementById("otp")
      .focus();


  }catch(error){

    console.error(
      "SEND OTP ERROR:",
      error
    );


    showMessage(
      "loginError",
      "❌ " +
      (
        error.message ||
        "OTP erguu irratti rakkoon uumame."
      ),
      "error"
    );


  }finally{

    /*
      Yoo cooldown hin jirre button
      deebisee hojii irra galchi.
    */

    if(cooldownSeconds <= 0){

      button.disabled = false;

      button.textContent =
        "📩 OTP Ergi";

    }

  }

}



/* =====================================================
   COOLDOWN
   ===================================================== */

function startCooldown(seconds){

  clearInterval(cooldownTimer);


  cooldownSeconds =
    Number(seconds) || 60;


  const button =
    document.getElementById(
      "sendOtpButton"
    );


  const countdown =
    document.getElementById(
      "countdown"
    );


  button.disabled = true;


  function update(){

    if(cooldownSeconds <= 0){

      clearInterval(
        cooldownTimer
      );

      countdown.textContent =
        "";

      button.disabled = false;

      button.textContent =
        "📩 OTP Ergi";

      return;
    }


    button.textContent =
      `⏳ ${cooldownSeconds}s`;

    countdown.textContent =
      `OTP haaraa erguuf ${cooldownSeconds} seconds hafe.`;


    cooldownSeconds--;

  }


  update();


  cooldownTimer =
    setInterval(
      update,
      1000
    );

}



/* =====================================================
   VERIFY OTP
   ===================================================== */

async function verifyOTP(){

  hideMessage("loginError");

  hideMessage("otpMessage");


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim()
      .toUpperCase();


  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  const button =
    document.getElementById(
      "verifyButton"
    );


  /* CHECK */

  if(!phone || !pin || !otp){

    showMessage(
      "loginError",
      "⚠️ Phone, PIN fi OTP guuti.",
      "error"
    );

    return;
  }


  if(!validPhone(phone)){

    showMessage(
      "loginError",
      "⚠️ Phone number sirrii miti.",
      "error"
    );

    return;
  }


  if(!/^[0-9]{6}$/.test(otp)){

    showMessage(
      "loginError",
      "⚠️ OTP lakkoofsa 6 qabaachuu qaba.",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ Mirkanaa'aa jira...";


  try{

    const response =
      await fetch(
        VERIFY_OTP_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            phone:phone,

            pin:pin,

            otp:otp

          })

        }
      );


    const data =
      await response.json()
        .catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        "OTP sirrii miti."
      );

    }


    /*
      Student data
    */

    const student =
      data.student ||
      data.data ||
      data;


    if(
      !student ||
      !student.course
    ){

      throw new Error(
        "Odeeffannoon student hin argamne."
      );

    }


    /*
      Save session
    */

    sessionStorage.setItem(
      "kena_student",
      JSON.stringify(student)
    );


    /*
      Dashboard
    */

    showDashboard(
      student
    );


  }catch(error){

    console.error(
      "VERIFY OTP ERROR:",
      error
    );


    showMessage(
      "loginError",
      "❌ " +
      (
        error.message ||
        "OTP mirkaneessuu irratti rakkoon uumame."
      ),
      "error"
    );


  }finally{

    button.disabled = false;

    button.textContent =
      "✅ OTP Mirkaneessi";

  }

}

function showDashboard(student){

  document

  document

      "dashboardSection"
    )
    .classList.remove(
      "hidden"
    );


  renderStudentInfo(
    student
  );


  renderLessons(
    student.course
  );

}

  const course =

  const phone =
    student.phone ||

  const payment =
    student.payment_status ||
    "PAID";


  box.innerHTML = `

    <div class="info">
      <span>Maqaa Guutuu</span>
      <strong>
        ${escapeHTML(fullname)}
      </strong>
    </div>


    <div class="info">

    </div>


    <div class="info">
      <span>Phone</span>

        ${escapeHTML(phone)}
      </strong>
    </div>


    <div class="info">
      <span>Payment</span>

      <strong>

        <span class="status">

          ${escapeHTML(
            String(payment)
              .toUpperCase()

        </span>

}



/* =====================================================
   LESSONS
   ===================================================== */

function renderLessons(course){

  const container =
    document.getElementById(
      "lessonsContainer"
    );


  container.innerHTML = "";


  const lessons =
    COURSES[course];


  if(!lessons){

    container.innerHTML = `

      <div
        class="message error"
        style="display:block;"
      >
        Course kanaaf lesson hin qophoofne.
      </div>

    `;

    return;
  }


  lessons.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "lesson";


      const title =
        document.createElement(
          "h3"
        );

      title.textContent =
        item.title;


      const description =
        document.createElement(
          "p"
        );

      description.textContent =
        item.description;


      const link =
        document.createElement(
          "a"
        );


      /*
        LESSON ROUTING

        Lesson 1 → lesson.html
        Lesson 2 → lesson2.html

      */

      if(
        Number(item.lesson) === 1
      ){

        link.href =
          "/kena-design-/lesson.html";

      }

      else if(
        Number(item.lesson) === 2
      ){

        link.href =
          "/kena-design-/lesson2.html";

      }

      else{

        link.href =
          "/kena-design-/lesson.html?course=" +
          encodeURIComponent(course) +
          "&lesson=" +
          encodeURIComponent(
            item.lesson
          );

      }


      link.textContent =
        "📖 Open Lesson";


      div.appendChild(
        title
      );

      div.appendChild(
        description
      );

      div.appendChild(
        link
      );


      container.appendChild(
        div
      );

    }
  );

}

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   AUTO LOGIN FROM SESSION
   ===================================================== */

window.addEventListener(
  "load",
  function(){

    try{

      const saved =
        sessionStorage.getItem(
          "kena_student"
        );


      if(saved){

        const student =
          JSON.parse(saved);


        if(
          student &&
          student.course
        ){

          showDashboard(
            student
          );

        }

      }

    }catch(error){

      console.error(
        "Session error:",
        error
      );


      sessionStorage.removeItem(
        "kena_student"
      );

    }

  }
);
